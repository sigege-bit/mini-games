  // ==========================================
  // 2. 共通Web Audioサウンドエンジン (外部ファイルゼロ)
  // ==========================================
  class SoundFX {
    static ctx = null;
    static bgmTimer = null;
    static bgmStep = 0;
    static isBgmPlaying = false;

    static init() {
      if (!this.ctx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) this.ctx = new AudioContextClass();
      }
    }

    static resume() {
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    static play(type, extra = 1) {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);

      if (type === 'tap') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'catch') {
        const scale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.00, 987.77, 1046.50, 1174.66, 1318.51];
        const idx = Math.min(Math.max(0, extra - 1), scale.length - 1);
        const baseFreq = scale[idx];

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(baseFreq, now);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'fever') {
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98];
        notes.forEach((freq, i) => {
          setTimeout(() => {
            if (!soundEnabled || !this.ctx) return;
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.connect(g);
            g.connect(this.ctx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, this.ctx.currentTime);
            g.gain.setValueAtTime(0.25, this.ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
            o.start(this.ctx.currentTime);
            o.stop(this.ctx.currentTime + 0.18);
          }, i * 50);
        });
      } else if (type === 'damage') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.25);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'gameover') {
        const notes = [440, 415.3, 392, 349.23, 261.63];
        notes.forEach((freq, i) => {
          setTimeout(() => {
            if (!soundEnabled || !this.ctx) return;
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.connect(g);
            g.connect(this.ctx.destination);
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(freq, this.ctx.currentTime);
            o.frequency.linearRampToValueAtTime(freq * 0.9, this.ctx.currentTime + 0.3);
            g.gain.setValueAtTime(0.3, this.ctx.currentTime);
            g.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            o.start(this.ctx.currentTime);
            o.stop(this.ctx.currentTime + 0.3);
          }, i * 140);
        });
      }
    }

    static startBGM() {
      if (this.isBgmPlaying || !soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.isBgmPlaying = true;
      this.bgmStep = 0;

      const melody = [
        523.25, 0, 659.25, 0, 783.99, 0, 659.25, 0,
        880.00, 783.99, 659.25, 587.33, 523.25, 0, 587.33, 0,
        659.25, 0, 587.33, 0, 523.25, 0, 440.00, 0,
        523.25, 0, 587.33, 0, 659.25, 783.99, 1046.50, 0
      ];
      const tempo = 140;

      this.bgmTimer = setInterval(() => {
        if (!soundEnabled || !this.ctx) {
          this.bgmStep = (this.bgmStep + 1) % melody.length;
          return;
        }
        const freq = melody[this.bgmStep];
        if (freq > 0) {
          try {
            const now = this.ctx.currentTime;
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.connect(g);
            g.connect(this.ctx.destination);
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, now);
            g.gain.setValueAtTime(0.08, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            o.start(now);
            o.stop(now + 0.1);
          } catch(e) {}
        }
        this.bgmStep = (this.bgmStep + 1) % melody.length;
      }, tempo);
    }

    static stopBGM() {
      if (this.bgmTimer) {
        clearInterval(this.bgmTimer);
        this.bgmTimer = null;
      }
      this.isBgmPlaying = false;
    }
  }

  // ==========================================
  // 3. Canvas動的テクスチャ生成ヘルパー
  // ==========================================
  function generateDynamicTextures(scene) {
    if (scene.textures.exists('particle_star')) return;

    // 1. 星パーティクル
    const starCanvas = scene.textures.createCanvas('particle_star', 32, 32);
    const starCtx = starCanvas.getContext();
    starCtx.fillStyle = '#FFD700';
    starCtx.beginPath();
    const cx = 16, cy = 16, spikes = 5, outerR = 14, innerR = 6;
    let rot = Math.PI / 2 * 3;
    let x = cx, y = cy;
    const step = Math.PI / spikes;
    starCtx.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
      x = cx + Math.cos(rot) * outerR;
      y = cy + Math.sin(rot) * outerR;
      starCtx.lineTo(x, y);
      rot += step;
      x = cx + Math.cos(rot) * innerR;
      y = cy + Math.sin(rot) * innerR;
      starCtx.lineTo(x, y);
      rot += step;
    }
    starCtx.lineTo(cx, cy - outerR);
    starCtx.closePath();
    starCtx.fill();
    starCanvas.refresh();

    // 2. 肉球パーティクル
    const pawCanvas = scene.textures.createCanvas('particle_paw', 32, 32);
    const pCtx = pawCanvas.getContext();
    pCtx.fillStyle = '#FF85A2';
    pCtx.beginPath();
    pCtx.arc(16, 20, 8, 0, Math.PI * 2);
    pCtx.fill();
    const toes = [{ x: 8, y: 10 }, { x: 13, y: 6 }, { x: 19, y: 6 }, { x: 24, y: 10 }];
    toes.forEach(t => {
      pCtx.beginPath();
      pCtx.arc(t.x, t.y, 3.5, 0, Math.PI * 2);
      pCtx.fill();
    });
    pawCanvas.refresh();

    // 3. ハートパーティクル
    const heartCanvas = scene.textures.createCanvas('particle_heart', 32, 32);
    const hCtx = heartCanvas.getContext();
    hCtx.fillStyle = '#FF4D6D';
    hCtx.beginPath();
    hCtx.moveTo(16, 10);
    hCtx.bezierCurveTo(16, 4, 6, 4, 6, 12);
    hCtx.bezierCurveTo(6, 20, 16, 26, 16, 28);
    hCtx.bezierCurveTo(16, 26, 26, 20, 26, 12);
    hCtx.bezierCurveTo(26, 4, 16, 4, 16, 10);
    hCtx.fill();
    heartCanvas.refresh();
  }

  // ==========================================

      this.add.text(width / 2, 420, t.rule1, { fontSize: '13px', fill: '#cbd5e1' }).setOrigin(0.5);
      this.add.text(width / 2, 455, t.rule2, { fontSize: '13px', fill: '#fbbf24' }).setOrigin(0.5);

        fontStyle: 'bold',
        fill: '#FFD700'

      // スタートボタン（ふわふわ浮遊＆パルスアニメーション）

      const startBtn = this.add.rectangle(0, 0, width - 80, 54, 0xFF6B8B)

        .setInteractive({ useHandCursor: true });

        fontSize: '18px',
        fontStyle: 'bold',
        fill: '#ffffff'
      }).setOrigin(0.5);

      btnContainer.add([startBtn, startTxt]);

      // なめらかな上下浮遊 ＆ パルス拡大縮小 Tween
      this.tweens.add({
        targets: btnContainer,
        y: 627,
        scaleX: 1.06,
        scaleY: 1.06,
        duration: 750,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
      });

      startBtn.on('pointerdown', () => {
        SoundFX.play('tap');
        SoundFX.startBGM();
        this.scene.start('SceneGame');
      });
    }

    createHeaderUI(w) {
      // MENUに戻るピル
      const menuBg = this.add.rectangle(80, 42, 130, 32, 0x1e293b, 0.9)
        .setStrokeStyle(1, 0xf472b6, 0.5)
        .setInteractive({ useHandCursor: true });
      this.add.text(80, 42, currentLang === 'ja' ? '🏠 MENUに戻る' : '🏠 MENU', {
        fontSize: '12px', fontStyle: 'bold', fill: '#cbd5e1'
      }).setOrigin(0.5);

      menuBg.on('pointerdown', () => {
        SoundFX.play('tap');
        window.open('../index.html', '_self');
      });

      // サウンド切替ピル
      const sfxBg = this.add.rectangle(240, 42, 110, 32, soundEnabled ? 0x831843 : 0x1e293b, 0.9)
        .setStrokeStyle(1, soundEnabled ? 0xf472b6 : 0x475569)
        .setInteractive({ useHandCursor: true });
      this.add.text(240, 42, soundEnabled ? '🔊 SFX ON' : '🔇 OFF', {
        fontSize: '12px', fontStyle: 'bold', fill: '#fff'
      }).setOrigin(0.5);

      sfxBg.on('pointerdown', () => {
        soundEnabled = !soundEnabled;
        localStorage.setItem('shigege_game_sfx', soundEnabled ? 'true' : 'false');
        SoundFX.play('tap');
        this.scene.restart();
      });

      // 言語切替ピル
      const langBg = this.add.rectangle(w - 80, 42, 130, 32, 0x1e293b, 0.9)
        .setStrokeStyle(1, 0xf472b6, 0.5)
        .setInteractive({ useHandCursor: true });
      this.add.text(w - 80, 42, currentLang === 'ja' ? '🇯🇵 日本語' : '🇺🇸 English', {
        fontSize: '12px', fontStyle: 'bold', fill: '#f472b6'
      }).setOrigin(0.5);

      langBg.on('pointerdown', () => {
        currentLang = currentLang === 'ja' ? 'en' : 'ja';

  // ==========================================
  // 6. メインゲームシーン (SceneGame)
  // ==========================================
  class SceneGame extends Phaser.Scene {
    constructor() { super('SceneGame'); }

    create() {
      const { width, height } = this.scale;

      // ゲームステート
      this.score = 0;
      this.lives = 3;
      this.combo = 0;
      this.isGameOver = false;
      this.isFever = false;
      this.feverTimer = 0;
      this.isInvincible = false;
      this.catState = 'normal';

      // スポーン・難易度
      this.baseSpeed = 220;
      this.currentSpeed = 220;
      this.spawnDelay = 850;
      this.dangerRatio = 0.22;
      this.nextSpawnTime = this.time.now + 400;

      // 背景
      this.bgGraphics = this.add.graphics().setDepth(0);
      this.drawBackground(0x1B162C, 0x0F0C1B);

      // パーティクルエミッター
      this.starEmitter = this.add.particles(0, 0, 'particle_star', {
        lifespan: { min: 400, max: 700 },
        speed: { min: 100, max: 250 },
        scale: { start: 1, end: 0 },
        emitting: false
      }).setDepth(30);

      this.pawEmitter = this.add.particles(0, 0, 'particle_paw', {
        lifespan: { min: 500, max: 800 },
        speed: { min: 80, max: 200 },
        scale: { start: 1.2, end: 0.2 },
        emitting: false
      }).setDepth(30);

      // プレイヤー（ネコ＆カゴ）
      this.player = this.add.text(width / 2, height - 90, '😺', {
        fontSize: '64px',
        fontFamily: 'Segoe UI Emoji, Apple Color Emoji, sans-serif'
      }).setOrigin(0.5).setDepth(20);

      this.physics.add.existing(this.player);
      this.player.body.setCircle(28, 6, 6);
      this.player.body.setImmovable(true);

      // 落下物グループ
      this.itemsGroup = this.add.group();
      this.physics.add.overlap(this.player, this.itemsGroup, this.handleItemCatch, null, this);

      // 操作設定（相対ドラッグ＆タッチ追従）
      this.setupControls();

      // UI構築
      this.createUI();

      SoundFX.startBGM();
    }

    drawBackground(topColor, bottomColor) {
      const { width, height } = this.scale;
      this.bgGraphics.clear();
      this.bgGraphics.fillGradientStyle(topColor, topColor, bottomColor, bottomColor, 1);
      this.bgGraphics.fillRect(0, 0, width, height);
    }

    setupControls() {
      const { width } = this.scale;
      let isDragging = false;
      let lastPointerX = 0;

      this.input.on('pointerdown', (pointer) => {
        isDragging = true;
        lastPointerX = pointer.x;
      });

      this.input.on('pointermove', (pointer) => {
        if (this.isGameOver) return;
        if (isDragging) {
          const dx = pointer.x - lastPointerX;
          this.movePlayer(this.player.x + dx);
          lastPointerX = pointer.x;
        } else if (!pointer.isDown && pointer.wasTouch === false) {
          this.movePlayer(pointer.x);
        }
      });

      this.input.on('pointerup', () => { isDragging = false; });
    }

    movePlayer(targetX) {
      const { width } = this.scale;
      const clampedX = Phaser.Math.Clamp(targetX, 40, width - 40);
      this.player.x = clampedX;
    }

    createUI() {
      const { width } = this.scale;

      this.scoreText = this.add.text(24, 24, `SCORE: 0`, {
        fontSize: '24px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        fill: '#FFDF6D'
      }).setDepth(100);

      this.lifeText = this.add.text(width - 24, 24, '❤️❤️❤️', {
        fontSize: '22px'
      }).setOrigin(1, 0).setDepth(100);

      this.comboBanner = this.add.text(width / 2, 120, '', {
        fontSize: '26px',
        fontStyle: 'bold',
        fill: '#FF85A2',
        stroke: '#000',
        strokeThickness: 4
      }).setOrigin(0.5).setDepth(100).setAlpha(0);

      this.feverBar = this.add.graphics().setDepth(101).setAlpha(0);
    }

    update(time, delta) {
      if (this.isGameOver) return;

      // 難易度進行（時間経過で速度＆危険率アップ）
      this.currentSpeed = Math.min(480, this.baseSpeed + (this.score * 1.5));
      this.spawnDelay = Math.max(450, 850 - (this.score * 2.5));
      this.dangerRatio = Math.min(0.42, 0.22 + (this.score * 0.0015));

      // フィーバータイマー処理
      if (this.isFever) {
        this.feverTimer -= delta;
        this.updateFeverBar(this.feverTimer / 3500);
        if (this.feverTimer <= 0) {
          this.endFever();
        }
      }

      // アイテムスポーン
      if (time > this.nextSpawnTime) {
        this.spawnItem();
        this.nextSpawnTime = time + (this.isFever ? this.spawnDelay * 0.45 : this.spawnDelay);
      }

      // 画面外落下アイテムのクリーンアップ
      this.itemsGroup.getChildren().forEach(item => {
        if (item.y > this.scale.height + 40) {
          if (!item.itemData.isDanger && !this.isFever) {
            this.resetCombo();
          }
          item.destroy();
        }
      });
    }

    spawnItem() {
      const { width } = this.scale;
      const isDanger = !this.isFever && (Math.random() < this.dangerRatio);

      let itemData;
      if (isDanger) {
        itemData = Phaser.Utils.Array.GetRandom(DANGER_ITEMS);
      } else {
        itemData = this.isFever
          ? Phaser.Utils.Array.GetRandom(FOOD_ITEMS)
          : this.weightedRandom(FOOD_ITEMS);
      }

      const spawnX = Phaser.Math.Between(40, width - 40);
      const item = this.add.text(spawnX, -30, itemData.emoji, {
        fontSize: '44px',
        fontFamily: 'Segoe UI Emoji, Apple Color Emoji, sans-serif'
      }).setOrigin(0.5).setDepth(15);

      this.physics.add.existing(item);
      item.itemData = itemData;

      const speed = this.isFever ? this.currentSpeed * 1.25 : this.currentSpeed;
      item.body.setVelocityY(speed);

      this.itemsGroup.add(item);
    }

    weightedRandom(items) {
      const totalWeight = items.reduce((sum, i) => sum + i.weight, 0);
      let rand = Math.random() * totalWeight;
      for (const item of items) {
        if (rand < item.weight) return item;
        rand -= item.weight;
      }
      return items[0];
    }

    handleItemCatch(player, item) {
      if (!item.active || this.isGameOver) return;
      const data = item.itemData;
      item.destroy();

      if (data.isDanger) {
        if (!this.isInvincible && !this.isFever) {
          this.handleDamage(data);
        }
      } else {
        this.handleFoodCatch(data);
      }
    }

    handleFoodCatch(data) {
      this.combo++;
      const comboBonus = Math.min(20, this.combo * 2);
      const gainedScore = data.score + comboBonus;
      this.score += gainedScore;

      this.scoreText.setText(`SCORE: ${this.score}`);
      SoundFX.play('catch', this.combo);

      this.starEmitter.explode(8, this.player.x, this.player.y - 20);
      this.showFloatingText(this.player.x, this.player.y - 45, `+${gainedScore}`, '#FFD700');

      if (this.combo >= 3) {
        this.showComboBanner();
      }

      if (data.isFever && !this.isFever) {
        this.startFever();
      } else {
        this.setCatState('happy');
      }
    }

    handleDamage(data) {
      this.lives--;
      this.resetCombo();
      this.updateLifeDisplay();
      SoundFX.play('damage');
      this.setCatState('damage');
      this.cameras.main.shake(150, 0.015);

      const msg = (currentLang === 'ja')
        ? (data && data.msgJa ? data.msgJa : '💣 ダメージ！(-1)')
        : (data && data.msgEn ? data.msgEn : '💣 Damage! (-1)');

      this.showDamagePopup(this.player.x, this.player.y - 45, msg);

      if (this.lives <= 0) {
        this.triggerGameOver();
      } else {
        this.isInvincible = true;
        this.tweens.add({
          targets: this.player,
          alpha: 0.3,
          duration: 100,
          yoyo: true,
          repeat: 5,
          onComplete: () => {
            this.player.alpha = 1;
            this.isInvincible = false;
          }
        });
      }
    }

    showDamagePopup(x, y, message) {
      const text = this.add.text(x, y, message, {
        fontSize: '22px',
        fontFamily: 'system-ui, -apple-system, sans-serif',
        fontWeight: '900',
        fill: '#FF3366',
        stroke: '#000000',
        strokeThickness: 5,
        align: 'center'
      }).setOrigin(0.5).setDepth(80);

      this.tweens.add({
        targets: text,
        y: y - 75,
        alpha: { from: 1, to: 0 },
        scale: { from: 1.15, to: 0.95 },
        duration: 900,
        ease: 'Cubic.easeOut',
        onComplete: () => text.destroy()
      });
    }

    setCatState(state) {
      if (this.catState === 'fever' && state !== 'fever') return;
      this.catState = state;

      if (state === 'happy') {
        this.player.setText('😋');
        this.time.delayedCall(400, () => {
          if (!this.isGameOver && !this.isFever) {
            this.player.setText('😺');
            this.catState = 'normal';
          }
        });
      } else if (state === 'damage') {
        this.player.setText('🙀');
        this.time.delayedCall(700, () => {
          if (!this.isGameOver && !this.isFever) {
            this.player.setText('😺');
            this.catState = 'normal';
          }
        });
      } else if (state === 'fever') {
        this.player.setText('😻');
      }
    }

    startFever() {
      this.isFever = true;
      this.feverTimer = 3500;
      this.setCatState('fever');
      SoundFX.play('fever');

      const t = I18N[currentLang];
      this.showFloatingText(this.scale.width / 2, 340, t.feverText, '#FF007F', 600, 26);
      this.feverBar.setAlpha(1);
    }

    endFever() {
      this.isFever = false;
      this.feverBar.setAlpha(0);
      this.drawBackground(0x1B162C, 0x0F0C1B);
      this.player.setText('😺');
      this.catState = 'normal';
    }

    updateFeverBar(ratio) {
      const { width } = this.scale;
      this.feverBar.clear();
      this.feverBar.fillStyle(0xFF007F, 0.85);
      this.feverBar.fillRect(0, 0, width * ratio, 6);
    }

    showComboBanner() {
      const t = I18N[currentLang];
      this.comboBanner.setText(`${this.combo} ${t.comboText} 🔥`);
      this.comboBanner.setAlpha(1).setScale(1.2);
      this.tweens.killTweensOf(this.comboBanner);
      this.tweens.add({
        targets: this.comboBanner,
        scale: 1,
        alpha: { from: 1, to: 0 },
        duration: 900,
        ease: 'Power2'
      });
    }

    resetCombo() {
      this.combo = 0;
    }

    updateLifeDisplay() {
      let hearts = '';
      for (let i = 0; i < 3; i++) {
        hearts += i < this.lives ? '❤️' : '🖤';
      }
      this.lifeText.setText(hearts);
    }

    showFloatingText(x, y, message, color = '#FFFFFF', duration = 800, fontSize = 20) {
      const text = this.add.text(x, y, message, {
        fontSize: `${fontSize}px`,
        fontWeight: '900',
        fill: color,
        stroke: '#000000',
        strokeThickness: 4,
        align: 'center'
      }).setOrigin(0.5).setDepth(60);

      this.tweens.add({
        targets: text,
        y: y - 50,
        alpha: { from: 1, to: 0 },
        scale: { from: 1.1, to: 0.9 },
        duration: duration,
        ease: 'Power1',
        onComplete: () => text.destroy()
      });
    }

    triggerGameOver() {
      this.isGameOver = true;
      this.player.setText('😿');
      SoundFX.stopBGM();
      SoundFX.play('gameover');

      this.time.delayedCall(700, () => {
        this.scene.start('SceneResult', { score: this.score });
      });
    }
  }

  // ==========================================
  // 7. 共通リザルトシーン (SceneResult)
  // ==========================================
  class SceneResult extends Phaser.Scene {
    constructor() { super('SceneResult'); }
    init(data) { this.finalScore = data.score || 0; }

    create() {
      const { width, height } = this.scale;
      const cx = width / 2;
      const cy = height / 2;
      const t = I18N[currentLang];

      SoundFX.stopBGM();

      // GA4 tracking
      if (typeof window.gtag === 'function') {
        window.gtag('event', 'game_over', { 'score': this.finalScore });
      }

      // ベストスコア更新判定
      let best = parseInt(localStorage.getItem('cat_catch_highscore') || '0', 10);
      const isNew = this.finalScore > best;
      if (isNew) {
        best = this.finalScore;
        localStorage.setItem('cat_catch_highscore', best);
      }

      // ランク判定
      let rank = t.rankC;
      if (this.finalScore >= 1500) rank = t.rankS;
      else if (this.finalScore >= 800) rank = t.rankA;
      else if (this.finalScore >= 300) rank = t.rankB;

      // 背景オーバーレイ & 中央カードパネル
      this.add.rectangle(cx, cy, width, height, 0x06070d, 0.94).setScrollFactor(0);
      this.add.rectangle(cx, cy, 420, 520, 0x0f1424, 0.96)
        .setStrokeStyle(2, 0xff007f, 0.65)
        .setScrollFactor(0);

      // 1. 終了タイトル
      this.add.text(cx, cy - 195, t.gameOver, {
        fontSize: '34px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        fill: '#FF6B8B',
        stroke: '#000000',
        strokeThickness: 5
      }).setOrigin(0.5).setScrollFactor(0);

      // 2. 今回スコア: 「SCORE: {スコア}」
      this.add.text(cx, cy - 125, `SCORE: ${this.finalScore}`, {
        fontSize: '36px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        fill: '#ffffff'
      }).setOrigin(0.5).setScrollFactor(0);

      // 3. ランク／称号: 「ランク: 【 {ランク・称号} 】」
      this.add.text(cx, cy - 65, `ランク: 【 ${rank} 】`, {
        fontSize: '17px',
        fontStyle: 'bold',
        fill: '#fde047',
        align: 'center',
        wordWrap: { width: 380 }
      }).setOrigin(0.5).setScrollFactor(0);

      // 4. ベストスコア: 「🏆 BEST SCORE: {ベストスコア}」
      this.add.text(cx, cy - 15, `🏆 BEST SCORE: ${best}${isNew ? ' 🔥 NEW!' : ''}`, {
        fontSize: '18px',
        fontStyle: 'bold',
        fill: '#FFD700'
      }).setOrigin(0.5).setScrollFactor(0);

      // 上段ボタン（横幅いっぱい）: 🔄 もう一回 / 🔄 RETRY
      const retryBtn = this.add.rectangle(cx, cy + 60, 360, 52, 0x10b981)
        .setStrokeStyle(1.5, 0x6ee7b7, 0.8)
        .setScrollFactor(0)
        .setInteractive({ useHandCursor: true });
      this.add.text(cx, cy + 60, currentLang === 'ja' ? '🔄 もう一回' : '🔄 RETRY', {
        fontSize: '18px',
        fontStyle: 'bold',
        fill: '#ffffff'
      }).setOrigin(0.5).setScrollFactor(0);
      retryBtn.on('pointerdown', () => {
        SoundFX.play('tap');
        this.scene.start('SceneGame');
      });

      // 中段ボタン（横幅いっぱい）: 𝕏 でポスト / 𝕏 POST TO X
      const shareBtn = this.add.rectangle(cx, cy + 126, 360, 52, 0x0284c7)
        .setStrokeStyle(1.5, 0x7dd3fc, 0.8)
        .setScrollFactor(0)
        .setInteractive({ useHandCursor: true });
      this.add.text(cx, cy + 126, currentLang === 'ja' ? '𝕏 でポスト' : '𝕏 POST TO X', {
        fontSize: '18px',
        fontStyle: 'bold',
        fill: '#ffffff'
      }).setOrigin(0.5).setScrollFactor(0);
      shareBtn.on('pointerdown', () => {
        SoundFX.play('tap');
        const text = encodeURIComponent(t.shareText.replace('{score}', this.finalScore).replace('{rank}', rank));
        const url = encodeURIComponent(window.location.href);
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
      });

      // 下段ボタン（左右2分割で横並び配置）
      const halfW = 172;
      const gap = 16;
      const leftX = cx - (halfW / 2 + gap / 2);
      const rightX = cx + (halfW / 2 + gap / 2);
      const bottomY = cy + 192;

      // 左ボタン: 🏠 タイトルへ / 🏠 TITLE
      const titleBtn = this.add.rectangle(leftX, bottomY, halfW, 48, 0x334155)
        .setStrokeStyle(1.5, 0x94a3b8, 0.6)
        .setScrollFactor(0)
        .setInteractive({ useHandCursor: true });
      this.add.text(leftX, bottomY, currentLang === 'ja' ? '🏠 タイトルへ' : '🏠 TITLE', {
        fontSize: '15px',
        fontStyle: 'bold',
        fill: '#e2e8f0'
      }).setOrigin(0.5).setScrollFactor(0);
      titleBtn.on('pointerdown', () => {
        SoundFX.play('tap');
        this.scene.start('SceneTitle');
      });

      // 右ボタン: 🌐 MENUに戻る / 🌐 MENU
      const portalBtn = this.add.rectangle(rightX, bottomY, halfW, 48, 0x475569)
        .setStrokeStyle(1.5, 0x94a3b8, 0.6)
        .setScrollFactor(0)
        .setInteractive({ useHandCursor: true });
      this.add.text(rightX, bottomY, currentLang === 'ja' ? '🌐 MENUに戻る' : '🌐 MENU', {
        fontSize: '15px',
        fontStyle: 'bold',
        fill: '#e2e8f0'
      }).setOrigin(0.5).setScrollFactor(0);
      portalBtn.on('pointerdown', () => {
        SoundFX.play('tap');
        window.open('../index.html', '_self');
      });
    }
  }

  // ==========================================
  // 8. Phaser ゲーム起動設定
  // ==========================================
  const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    width: 480,
    height: 800,
    backgroundColor: '#121019',
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
      default: 'arcade',
      arcade: { gravity: { y: 0 }, debug: false }
    },
    scene: [SceneTitle, SceneGame, SceneResult]
  };

  window.addEventListener('DOMContentLoaded', () => {
    new Phaser.Game(config);
  });

})();
</script>
