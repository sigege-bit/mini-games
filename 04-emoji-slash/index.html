  // ==========================================
  // 2. Web Audio API サウンドマネージャー
  // ==========================================
  class SoundManager {
    static ctx = null;
    static bgmTimer = null;
    static bgmStep = 0;
    static isBgmPlaying = false;
    static scale = [220, 246.94, 261.63, 329.63, 349.23, 440, 493.88, 523.25, 659.25, 698.46, 880];

    static init() {
      if (!this.ctx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) this.ctx = new AudioContextClass();
      }
    }

    static resume() {
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    static playSwish(speedFactor = 1.0) {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      try {
        const t = this.ctx.currentTime;
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.08);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.setValueAtTime(3.0, t);
        const startFreq = 400 * Math.min(speedFactor, 2.5);
        filter.frequency.setValueAtTime(startFreq, t);
        filter.frequency.exponentialRampToValueAtTime(1400 * Math.min(speedFactor, 2.5), t + 0.04);
        filter.frequency.exponentialRampToValueAtTime(300, t + 0.08);

        const gain = this.ctx.createGain();
        const vol = Math.min(0.25 * speedFactor, 0.4);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        noise.start(t);
        noise.stop(t + 0.08);
      } catch (e) {}
    }

    static playSlice(pitchMod = 1.0) {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      try {
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(850 * pitchMod, t);
        osc.frequency.exponentialRampToValueAtTime(120 * pitchMod, t + 0.12);

        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);

        const mod = this.ctx.createOscillator();
        const modGain = this.ctx.createGain();
        mod.type = 'sine';
        mod.frequency.setValueAtTime(1200 * pitchMod, t);
        modGain.gain.setValueAtTime(600 * pitchMod, t);
        modGain.gain.exponentialRampToValueAtTime(10, t + 0.1);

        mod.connect(osc.frequency);
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        mod.start(t);
        osc.start(t);
        mod.stop(t + 0.12);
        osc.stop(t + 0.12);
      } catch (e) {}
    }

    static playCombo(comboCount) {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      try {
        const t = this.ctx.currentTime;
        const hyoshigi = this.ctx.createOscillator();
        const hyoGain = this.ctx.createGain();
        hyoshigi.type = 'sine';
        const freq = 1400 + Math.min(comboCount * 120, 1000);
        hyoshigi.frequency.setValueAtTime(freq, t);
        hyoshigi.frequency.exponentialRampToValueAtTime(freq * 0.8, t + 0.08);

        hyoGain.gain.setValueAtTime(0.4, t);
        hyoGain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

        hyoshigi.connect(hyoGain);
        hyoGain.connect(this.ctx.destination);
        hyoshigi.start(t);
        hyoshigi.stop(t + 0.14);

        const taiko = this.ctx.createOscillator();
        const taiGain = this.ctx.createGain();
        taiko.type = 'triangle';
        taiko.frequency.setValueAtTime(160, t);
        taiko.frequency.exponentialRampToValueAtTime(35, t + 0.25);

        taiGain.gain.setValueAtTime(0.45, t);
        taiGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);

        taiko.connect(taiGain);
        taiGain.connect(this.ctx.destination);
        taiko.start(t);
        taiko.stop(t + 0.25);
      } catch (e) {}
    }

    static playBomb() {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      try {
        const t = this.ctx.currentTime;
        const bufferSize = Math.floor(this.ctx.sampleRate * 0.7);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.22));
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(450, t);
        filter.frequency.exponentialRampToValueAtTime(40, t + 0.7);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.65, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);

        const sub = this.ctx.createOscillator();
        const subGain = this.ctx.createGain();
        sub.type = 'sine';
        sub.frequency.setValueAtTime(90, t);
        sub.frequency.exponentialRampToValueAtTime(20, t + 0.6);
        subGain.gain.setValueAtTime(0.7, t);
        subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);

        sub.connect(subGain);
        subGain.connect(this.ctx.destination);

        noise.start(t);
        sub.start(t);
        noise.stop(t + 0.7);
        sub.stop(t + 0.7);
      } catch (e) {}
    }

    static playDragon() {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      try {
        const t = this.ctx.currentTime;
        [220, 330, 440, 550, 660].forEach((f, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, t + idx * 0.04);
          g.gain.setValueAtTime(0.25 / (idx + 1), t + idx * 0.04);
          g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start(t + idx * 0.04);
          osc.stop(t + 1.2);
        });
      } catch (e) {}
    }

    static playMiss() {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      try {
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.setValueAtTime(110, t + 0.1);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.2);
      } catch (e) {}
    }

    static playTap() {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    }

    static startBgm() {
      if (this.isBgmPlaying || !soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.isBgmPlaying = true;
      this.bgmStep = 0;
      const melodyPattern = [0, 2, 4, 3, 2, 0, 1, 0, 4, 3, 5, 4, 2, 1, 2, 0];
      const tempo = 135;
      const stepTime = (60 / tempo) / 2;

      this.bgmTimer = setInterval(() => {
        if (!soundEnabled || !this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const noteIndex = melodyPattern[this.bgmStep % melodyPattern.length];
          const freq = this.scale[noteIndex + 3];

          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.05, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + stepTime * 1.5);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + stepTime * 1.5);

          if (this.bgmStep % 4 === 0) {
            const drum = this.ctx.createOscillator();
            const dGain = this.ctx.createGain();
            drum.type = 'sine';
            drum.frequency.setValueAtTime(110, t);
            drum.frequency.exponentialRampToValueAtTime(30, t + 0.2);
            dGain.gain.setValueAtTime(0.1, t);
            dGain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
            drum.connect(dGain);
            dGain.connect(this.ctx.destination);
            drum.start(t);
            drum.stop(t + 0.2);
          }

          this.bgmStep++;
        } catch (e) {}
      }, stepTime * 1000);
    }

    static stopBgm() {
      if (this.bgmTimer) {
        clearInterval(this.bgmTimer);
        this.bgmTimer = null;
      }
      this.isBgmPlaying = false;
    }
  }

  // ==========================================
  // 3. ターゲット定義 & テクスチャ生成
  // ==========================================
  const TARGET_TYPES = {
    FOOD: [
      { emoji: '🍉', color: 0xff3344, splashColor: '#ff2a4b', name: '西瓜', points: 10 },
      { emoji: '🍣', color: 0xff7733, splashColor: '#ff8844', name: '寿司', points: 15 },
      { emoji: '🍎', color: 0xff2222, splashColor: '#ff1133', name: '林檎', points: 10 },
      { emoji: '🍕', color: 0xffbb22, splashColor: '#ffcc00', name: '披薩', points: 15 },
      { emoji: '🍖', color: 0xaa5522, splashColor: '#cc6633', name: '肉',   points: 20 },
      { emoji: '🍙', color: 0xeeeeee, splashColor: '#ffffff', name: '飯魂', points: 10 },
      { emoji: '🍰', color: 0xff66aa, splashColor: '#ff77bb', name: '菓子', points: 20 },
      { emoji: '🍇', color: 0x9933ff, splashColor: '#aa44ff', name: '葡萄', points: 15 },
      { emoji: '🍌', color: 0xffdd00, splashColor: '#ffee22', name: '香蕉', points: 10 },
      { emoji: '🥑', color: 0x44aa22, splashColor: '#55cc33', name: '鰐梨', points: 15 }
    ],
    BOMB: { emoji: '💣', color: 0x222222, splashColor: '#ff3300', name: '爆弾' },
    DRAGON: { emoji: '🐉', color: 0xffd700, splashColor: '#ffd700', name: '金龍', points: 200 }
  };

  function initAllTextures(scene) {
    if (scene.textures.exists('particle_sakura')) return;

    const renderEmoji = (key, emoji, size = 96) => {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.font = `${Math.floor(size * 0.72)}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, size / 2, size / 2 + size * 0.05);
      scene.textures.addCanvas(key, canvas);
    };

    TARGET_TYPES.FOOD.forEach((f, i) => renderEmoji(`emoji_food_${i}`, f.emoji));
    renderEmoji('emoji_bomb', TARGET_TYPES.BOMB.emoji);
    renderEmoji('emoji_dragon', TARGET_TYPES.DRAGON.emoji, 110);

    // 桜の花びらパーティクル
    const sakuraCanvas = document.createElement('canvas');
    sakuraCanvas.width = 24;
    sakuraCanvas.height = 24;
    const sCtx = sakuraCanvas.getContext('2d');
    sCtx.fillStyle = '#ffb7c5';
    sCtx.beginPath();
    sCtx.ellipse(12, 12, 10, 5, Math.PI / 4, 0, Math.PI * 2);
    sCtx.fill();
    scene.textures.addCanvas('particle_sakura', sakuraCanvas);

    // スパーク
    const sparkCanvas = document.createElement('canvas');
    sparkCanvas.width = 16;
    sparkCanvas.height = 16;
    const spCtx = sparkCanvas.getContext('2d');
    const grad = spCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, '#ffdd44');
    grad.addColorStop(1, 'rgba(255, 60, 0, 0)');
    spCtx.fillStyle = grad;
    spCtx.beginPath();
    spCtx.arc(8, 8, 8, 0, Math.PI * 2);
    spCtx.fill();
    scene.textures.addCanvas('particle_spark', sparkCanvas);
  }

  // ==========================================
  // 4. 共通タイトルシーン (SceneTitle)
  // ==========================================
  class SceneTitle extends Phaser.Scene {
    constructor() { super('SceneTitle'); }

    create() {
      initAllTextures(this);
      const { width, height } = this.scale;
      const t = I18N[currentLang];
      const highScore = localStorage.getItem('touken_ranbu_highscore') || localStorage.getItem('slash_samurai_highscore') || 0;

      SoundManager.stopBgm();

      // 背景
      const bg = this.add.graphics();
      bg.fillGradientStyle(0x1F1428, 0x1F1428, 0x08060D, 0x08060D, 1);
      bg.fillRect(0, 0, width, height);

      // --- トップバー (UIトグル) ---
      this.createHeaderUI(width);

      // タイトルロゴ
      this.add.text(width / 2, 175, t.title, {
        fontSize: '38px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        fill: '#ffd700',
        stroke: '#881100',
        strokeThickness: 7
      }).setOrigin(0.5);

      this.add.text(width / 2, 218, t.subTitle, {
        fontSize: '13px',
        fill: '#fca5a5'
      }).setOrigin(0.5);

      // メイン犬アイコンアニメーション
      const demoDog = this.add.text(width / 2, 288, '🐶', { fontSize: '72px' }).setOrigin(0.5);
      this.tweens.add({
        targets: demoDog,
        scale: 1.15,
        yoyo: true,
        repeat: -1,
        duration: 800,
        ease: 'Sine.easeInOut'
      });

      // 遊び方カード
      const card = this.add.graphics();
      card.fillStyle(0x1a0f24, 0.9);
      card.lineStyle(1, 0xef4444, 0.5);
      card.strokeRoundedRect(28, 355, width - 56, 175, 16);
      card.fillRoundedRect(28, 355, width - 56, 175, 16);

      this.add.text(width / 2, 380, t.howToPlay, { fontSize: '15px', fontStyle: 'bold', fill: '#fbbf24' }).setOrigin(0.5);
      this.add.text(width / 2, 420, t.rule1, { fontSize: '13px', fill: '#f1f5f9' }).setOrigin(0.5);
      this.add.text(width / 2, 455, t.rule2, { fontSize: '13px', fill: '#fde047' }).setOrigin(0.5);
      this.add.text(width / 2, 490, t.rule3, { fontSize: '13px', fill: '#f87171' }).setOrigin(0.5);

      // ハイスコア表示
      this.add.text(width / 2, 560, `🏆 ${t.bestScore}: ${highScore} 閃`, {
        fontSize: '16px',
        fontStyle: 'bold',
        fill: '#ffd700'
      }).setOrigin(0.5);

      // スタートボタン（ふわふわ浮遊＆パルスアニメーション）
      const btnContainer = this.add.container(width / 2, 635);

      const startBtn = this.add.rectangle(0, 0, width - 80, 54, 0xdc2626)
        .setStrokeStyle(2, 0xfde047, 0.9)
        .setInteractive({ useHandCursor: true });
      const startTxt = this.add.text(0, 0, t.startBtn, {
        fontSize: '18px',
        fontStyle: 'bold',
        fill: '#ffffff'
      }).setOrigin(0.5);

      btnContainer.add([startBtn, startTxt]);

      this.tweens.add({
        targets: btnContainer,
        y: 627,
        scaleX: 1.05,
        scaleY: 1.05,
        duration: 750,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
      });

      startBtn.on('pointerdown', () => {
        SoundManager.playTap();
        SoundManager.playSlice();
        SoundManager.startBgm();
        this.scene.start('SceneGame');
      });
    }

    createHeaderUI(w) {
      // サウンド切替ピル
      const sfxBg = this.add.rectangle(80, 42, 110, 32, soundEnabled ? 0x991b1b : 0x1e293b, 0.9)
        .setStrokeStyle(1, soundEnabled ? 0xf87171 : 0x475569)
        .setInteractive({ useHandCursor: true });
      this.add.text(80, 42, soundEnabled ? '🔊 SFX ON' : '🔇 OFF', {
        fontSize: '12px', fontStyle: 'bold', fill: '#fff'
      }).setOrigin(0.5);

      sfxBg.on('pointerdown', () => {
        soundEnabled = !soundEnabled;
        localStorage.setItem('shigege_game_sfx', soundEnabled ? 'true' : 'false');
        SoundManager.playTap();
        this.scene.restart();
      });

      // 言語切替ピル
      const langBg = this.add.rectangle(w - 80, 42, 110, 32, 0x1e293b, 0.9)
        .setStrokeStyle(1, 0xef4444, 0.5)
        .setInteractive({ useHandCursor: true });
      this.add.text(w - 80, 42, currentLang === 'ja' ? '🇯🇵 日本語' : '🇺🇸 English', {
        fontSize: '12px', fontStyle: 'bold', fill: '#f87171'
      }).setOrigin(0.5);

      langBg.on('pointerdown', () => {
        currentLang = currentLang === 'ja' ? 'en' : 'ja';
        localStorage.setItem('shigege_game_lang', currentLang);
        SoundManager.playTap();
        this.scene.restart();
      });
    }
  }

  // ==========================================
  // 5. メインゲームシーン (SceneGame)
  // ==========================================
  class SceneGame extends Phaser.Scene {
    constructor() { super('SceneGame'); }

    create() {
      const { width, height } = this.scale;

      this.score = 0;
      this.misses = 0;
      this.maxMisses = 3;
      this.isGameOver = false;
      this.gameTime = 0;
      this.spawnTimer = 0;
      this.dragonSpawnTimer = Phaser.Math.Between(15, 25);

      this.bladePoints = [];
      this.bladeGraphics = this.add.graphics().setDepth(200);

      // 背景
      const bg = this.add.graphics().setDepth(0);
      bg.fillGradientStyle(0x1F1428, 0x1F1428, 0x08060D, 0x08060D, 1);
      bg.fillRect(0, 0, width, height);

      // 桜吹雪パーティクル
      this.sakuraEmitter = this.add.particles(0, 0, 'particle_sakura', {
        x: { min: 0, max: width },
        y: -20,
        lifespan: 5000,
        speedY: { min: 60, max: 130 },
        speedX: { min: -40, max: 40 },
        rotation: { min: 0, max: 360 },
        rotate: { min: 0, max: 360 },
        scale: { start: 0.8, end: 0.3 },
        alpha: { start: 0.7, end: 0 },
        frequency: 300
      }).setDepth(5);

      // グループ (Phaser 3の物理グループによるsetVelocityリセットを防ぐため通常グループを使用)
      this.targets = this.add.group();
      this.slicedPieces = this.add.group();

      this.createUI();

      // 入力イベント（スワイプ・ドラッグ軌跡）
      this.input.on('pointerdown', this.onPointerDown, this);
      this.input.on('pointermove', this.onPointerMove, this);
      this.input.on('pointerup', this.onPointerUp, this);

      SoundManager.startBgm();
    }

    createUI() {
      const { width } = this.scale;

      this.scoreText = this.add.text(20, 20, `SCORE: 0 閃`, {
        fontSize: '22px',
        fontFamily: 'system-ui, sans-serif',
        fontWeight: 'bold',
        color: '#ffd700'
      }).setDepth(100);

      this.missText = this.add.text(width - 20, 20, '⚔️ ⚔️ ⚔️', {
        fontSize: '22px'
      }).setOrigin(1, 0).setDepth(100);
    }

    onPointerDown(pointer) {
      if (this.isGameOver) return;
      this.bladePoints = [{ x: pointer.x, y: pointer.y, time: Date.now() }];
    }

    onPointerMove(pointer) {
      if (this.isGameOver || !pointer.isDown) return;

      const now = Date.now();
      const prevPoint = this.bladePoints[this.bladePoints.length - 1];

      if (prevPoint) {
        const dist = Phaser.Math.Distance.Between(prevPoint.x, prevPoint.y, pointer.x, pointer.y);
        if (dist > 8) {
          const speed = dist / Math.max(now - prevPoint.time, 1);
          SoundManager.playSwish(speed);
          this.checkSlice(prevPoint, pointer);
        }
      }

      this.bladePoints.push({ x: pointer.x, y: pointer.y, time: now });
    }

    onPointerUp() {
      this.bladePoints = [];
    }

    checkSlice(p1, p2) {
      const line = new Phaser.Geom.Line(p1.x, p1.y, p2.x, p2.y);
      let hitCount = 0;

      this.targets.getChildren().forEach(target => {
        if (!target.active || target.isSliced) return;

        const circle = new Phaser.Geom.Circle(target.x, target.y, target.hitRadius || 40);
        if (Phaser.Geom.Intersects.LineToCircle(line, circle)) {
          this.sliceTarget(target, p1, p2);
          hitCount++;
        }
      });

      if (hitCount >= 2) {
        SoundManager.playCombo(hitCount);
        this.showComboEffect(p2.x, p2.y, hitCount);
      }
    }

    sliceTarget(target, p1, p2) {
      target.isSliced = true;

      if (target.targetType === 'BOMB') {
        SoundManager.playBomb();
        this.cameras.main.shake(400, 0.03);
        this.createExplosionEffect(target.x, target.y);
        this.triggerGameOver('💣 爆弾に触れてしまった！');
        target.destroy();
        return;
      }

      if (target.targetType === 'DRAGON') {
        SoundManager.playDragon();
        this.score += 200;
        this.scoreText.setText(`SCORE: ${this.score} 閃`);
        this.cameras.main.shake(250, 0.02);
        this.showFloatingScore(target.x, target.y, '+200 閃 (金龍討伐!)', '#ffd700');
        this.createDragonExplosion(target.x, target.y);
        target.destroy();
        return;
      }

      // 通常食材
      SoundManager.playSlice();
      const points = (target.foodData && target.foodData.points) || 10;
      this.score += points;
      this.scoreText.setText(`SCORE: ${this.score} 閃`);

      this.showFloatingScore(target.x, target.y, `+${points}`, '#fde047');
      this.splitFoodTarget(target, p1, p2);
    }

    splitFoodTarget(target, p1, p2) {
      const angle = Phaser.Math.Angle.Between(p1.x, p1.y, p2.x, p2.y);
      const perpAngle = angle + Math.PI / 2;

      // 2つのピースに分割して回転飛散
      for (let i = -1; i <= 1; i += 2) {
        const piece = this.physics.add.sprite(target.x + Math.cos(perpAngle) * i * 12, target.y, target.texture.key);
        piece.setScale(0.85);
        piece.setGravityY(750);
        piece.setVelocity(
          target.body.velocity.x * 0.5 + Math.cos(perpAngle) * i * 220,
          target.body.velocity.y * 0.5 + Math.sin(perpAngle) * i * 180 - 100
        );
        piece.setAngularVelocity(i * 320);
        this.slicedPieces.add(piece);

        this.tweens.add({
          targets: piece,
          alpha: 0,
          duration: 900,
          ease: 'Power2',
          onComplete: () => piece.destroy()
        });
      }

      target.destroy();
    }

    showComboEffect(x, y, count) {
      const text = this.add.text(x, y - 30, `⚡ ${count} 一閃 COMBO!`, {
        fontSize: '24px',
        fontWeight: '900',
        color: '#fde047',
        stroke: '#991b1b',
        strokeThickness: 5
      }).setOrigin(0.5).setDepth(150);

      this.tweens.add({
        targets: text,
        y: y - 80,
        alpha: 0,
        scale: { from: 1.3, to: 0.9 },
        duration: 800,
        ease: 'Cubic.easeOut',
        onComplete: () => text.destroy()
      });
    }

    showFloatingScore(x, y, textStr, color = '#fde047') {
      const text = this.add.text(x, y, textStr, {
        fontSize: '20px',
        fontWeight: 'bold',
        color: color,
        stroke: '#000',
        strokeThickness: 4
      }).setOrigin(0.5).setDepth(120);

      this.tweens.add({
        targets: text,
        y: y - 50,
        alpha: 0,
        duration: 700,
        ease: 'Quad.easeOut',
        onComplete: () => text.destroy()
      });
    }

    createExplosionEffect(x, y) {
      for (let i = 0; i < 20; i++) {
        const spark = this.add.image(x, y, 'particle_spark');
        const angle = Math.random() * Math.PI * 2;
        const speed = Phaser.Math.Between(100, 300);
        this.tweens.add({
          targets: spark,
          x: x + Math.cos(angle) * speed,
          y: y + Math.sin(angle) * speed,
          alpha: 0,
          scale: 0,
          duration: 600,
          onComplete: () => spark.destroy()
        });
      }
    }

    createDragonExplosion(x, y) {
      for (let i = 0; i < 30; i++) {
        const spark = this.add.image(x, y, 'particle_spark').setScale(1.5);
        const angle = Math.random() * Math.PI * 2;
        const dist = Phaser.Math.Between(80, 260);
        this.tweens.add({
          targets: spark,
          x: x + Math.cos(angle) * dist,
          y: y + Math.sin(angle) * dist,
          alpha: 0,
          scale: 0,
          duration: 800,
          ease: 'Cubic.easeOut',
          onComplete: () => spark.destroy()
        });
      }
    }

    update(time, delta) {
      const dt = delta / 1000;
      this.gameTime += dt;

      // 刀筋の描画更新
      const now = Date.now();
      this.bladePoints = this.bladePoints.filter(p => now - p.time < 160);
      this.bladeGraphics.clear();

      if (this.bladePoints.length > 1) {
        for (let i = 1; i < this.bladePoints.length; i++) {
          const p1 = this.bladePoints[i - 1];
          const p2 = this.bladePoints[i];
          const ratio = i / this.bladePoints.length;

          this.bladeGraphics.lineStyle(14 * ratio, 0xef4444, ratio * 0.85);
          this.bladeGraphics.lineBetween(p1.x, p1.y, p2.x, p2.y);

          this.bladeGraphics.lineStyle(5 * ratio, 0xffffff, ratio * 1.0);
          this.bladeGraphics.lineBetween(p1.x, p1.y, p2.x, p2.y);
        }
      }

      if (this.isGameOver) return;

      // スポーン
      this.spawnTimer += dt;
      const currentInterval = Math.max(1.8 - this.gameTime * 0.01, 0.9);
      if (this.spawnTimer >= currentInterval) {
        this.spawnTimer = 0;
        const count = Phaser.Math.Between(1, this.gameTime > 25 ? 3 : 2);
        for (let i = 0; i < count; i++) {
          this.time.delayedCall(i * 150, () => {
            if (!this.isGameOver) this.spawnTarget();
          });
        }
      }

      // 金の龍スポーン
      this.dragonSpawnTimer -= dt;
      if (this.dragonSpawnTimer <= 0) {
        this.spawnDragon();
        this.dragonSpawnTimer = Phaser.Math.Between(18, 30);
      }

      // 画面外落下判定
      const { height } = this.scale;
      this.targets.getChildren().forEach(target => {
        if (!target.active) return;
        // 一度画面内（y < height - 100）に入ったフラグ
        if (target.y < height - 100) {
          target.hasEnteredScreen = true;
        }
        // 上昇後に画面下（y > height + 50）へ落下してきたら見逃し処理
        if (target.hasEnteredScreen && target.y > height + 50 && target.body.velocity.y > 0) {
          if (target.targetType === 'FOOD' && !target.isSliced) {
            this.onMissTarget(target);
          }
          target.destroy();
        }
      });
    }

    spawnTarget() {
      const { width, height } = this.scale;
      const x = Phaser.Math.Between(60, width - 60);
      const y = height + 30;

      const isBomb = Math.random() < Math.min(0.12 + this.gameTime * 0.002, 0.28);
      let targetSprite;

      if (isBomb) {
        targetSprite = this.physics.add.sprite(x, y, 'emoji_bomb');
        targetSprite.targetType = 'BOMB';
        targetSprite.hitRadius = 40;
      } else {
        const foodIdx = Phaser.Math.Between(0, TARGET_TYPES.FOOD.length - 1);
        targetSprite = this.physics.add.sprite(x, y, `emoji_food_${foodIdx}`);
        targetSprite.targetType = 'FOOD';
        targetSprite.foodData = TARGET_TYPES.FOOD[foodIdx];
        targetSprite.hitRadius = 44;
      }

      targetSprite.isSliced = false;
      targetSprite.hasEnteredScreen = false;

      // 修正後の物理パラメーター（画面中央〜やや上でふんわりターンする放物線）
      const targetX = width / 2 + Phaser.Math.Between(-120, 120);
      const vx = (targetX - x) * Phaser.Math.FloatBetween(0.4, 0.7);
      const vy = Phaser.Math.Between(-720, -820);

      targetSprite.setVelocity(vx, vy);
      targetSprite.setAngularVelocity(Phaser.Math.Between(-100, 100));
      targetSprite.setGravityY(420);

      this.targets.add(targetSprite);
    }

    spawnDragon() {
      const { width, height } = this.scale;
      const fromLeft = Math.random() > 0.5;
      const startX = fromLeft ? -50 : width + 50;
      const startY = Phaser.Math.Between(height * 0.25, height * 0.45);

      const dragon = this.physics.add.sprite(startX, startY, 'emoji_dragon');
      dragon.targetType = 'DRAGON';
      dragon.hitRadius = 50;
      dragon.isSliced = false;

      const vx = fromLeft ? Phaser.Math.Between(350, 520) : Phaser.Math.Between(-520, -350);
      const vy = Phaser.Math.Between(-30, 30);

      dragon.setVelocity(vx, vy);
      dragon.setGravityY(35);
      dragon.setAngularVelocity(fromLeft ? 80 : -80);

      this.targets.add(dragon);
    }

    onMissTarget(target) {
      if (this.isGameOver) return;
      this.misses++;
      SoundManager.playMiss();

      let missIcons = '';
      for (let i = 0; i < this.maxMisses; i++) {
        missIcons += i < (this.maxMisses - this.misses) ? '⚔️ ' : '❌ ';
      }
      this.missText.setText(missIcons.trim());

      const t = I18N[currentLang];
      const missAlert = this.add.text(target.x, this.scale.height - 40, t.missText, {
        fontSize: '20px',
        fontWeight: 'bold',
        color: '#ef4444',
        stroke: '#000',
        strokeThickness: 4
      }).setOrigin(0.5);

      this.tweens.add({
        targets: missAlert,
        y: missAlert.y - 40,
        alpha: 0,
        duration: 600,
        onComplete: () => missAlert.destroy()
      });

      if (this.misses >= this.maxMisses) {
        this.triggerGameOver('食材を3回見逃してしまった！');
      }
    }

    triggerGameOver(reason = '無念！') {
      if (this.isGameOver) return;
      this.isGameOver = true;
      SoundManager.stopBgm();

      this.cameras.main.shake(300, 0.02);
      this.time.delayedCall(700, () => {
        this.scene.start('SceneResult', {
          score: this.score,
          reason: reason
        });
      });
    }
  }

  // ==========================================
  // 6. 共通リザルトシーン (SceneResult)
  // ==========================================
  class SceneResult extends Phaser.Scene {
    constructor() { super('SceneResult'); }

    init(data) {
      this.finalScore = data.score || 0;
      this.reason = data.reason || '';
    }

    create() {
      const { width, height } = this.scale;
      const t = I18N[currentLang];

      SoundManager.stopBgm();

      if (typeof window.gtag === 'function') {
        window.gtag('event', 'game_over', { 'score': this.finalScore });
      }

      let best = parseInt(localStorage.getItem('touken_ranbu_highscore') || localStorage.getItem('slash_samurai_highscore') || '0', 10);
      const isNew = this.finalScore > best;
      if (isNew) {
        best = this.finalScore;
        localStorage.setItem('touken_ranbu_highscore', best);
        localStorage.setItem('slash_samurai_highscore', best);
      }

      // 称号判定
      let rank = t.rank1;
      if (this.finalScore >= 1200) rank = t.rank6;
      else if (this.finalScore >= 700) rank = t.rank5;
      else if (this.finalScore >= 350) rank = t.rank4;
      else if (this.finalScore >= 120) rank = t.rank3;
      else if (this.finalScore >= 40) rank = t.rank2;

      this.add.rectangle(0, 0, width, height, 0x08060d, 0.96).setOrigin(0);

      // GAMEOVER ロゴ
      this.add.text(width / 2, 135, t.gameOver, {
        fontSize: '34px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        fill: '#ef4444',
        stroke: '#000',
        strokeThickness: 5
      }).setOrigin(0.5);

      // スコア表示
      this.add.text(width / 2, 210, `${t.score}: ${this.finalScore} 閃`, {
        fontSize: '36px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        fill: '#ffd700'
      }).setOrigin(0.5);

      this.add.text(width / 2, 255, `🥋 ${t.rank}: 【 ${rank} 】`, {
        fontSize: '17px',
        fontStyle: 'bold',
        fill: '#fde047'
      }).setOrigin(0.5);

      this.add.text(width / 2, 290, `🏆 ${t.bestScore}: ${best} 閃 ${isNew ? '🔥 NEW!' : ''}`, {
        fontSize: '16px',
        fontStyle: 'bold',
        fill: '#f87171'
      }).setOrigin(0.5);

      // 1. もう一回 (RETRY)
      const retryBtn = this.add.rectangle(width / 2, 370, width - 80, 52, 0xdc2626).setInteractive({ useHandCursor: true });
      this.add.text(width / 2, 370, t.retryBtn, { fontSize: '18px', fontStyle: 'bold', fill: '#fff' }).setOrigin(0.5);
      retryBtn.on('pointerdown', () => {
        SoundManager.playTap();
        this.scene.start('SceneGame');
      });

      // 2. Xにポスト (SHARE)
      const shareBtn = this.add.rectangle(width / 2, 440, width - 80, 52, 0x0284c7).setInteractive({ useHandCursor: true });
      this.add.text(width / 2, 440, t.shareBtn, { fontSize: '18px', fontStyle: 'bold', fill: '#fff' }).setOrigin(0.5);
      shareBtn.on('pointerdown', () => {
        SoundManager.playTap();
        const text = encodeURIComponent(t.shareText.replace('{score}', this.finalScore).replace('{rank}', rank));
        const url = encodeURIComponent(window.location.href);
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
      });

      // 3. タイトルへ (TITLE)
      const titleBtn = this.add.rectangle(width / 2 - 95, 520, 160, 46, 0x334155).setInteractive({ useHandCursor: true });
      this.add.text(width / 2 - 95, 520, t.titleBtn, { fontSize: '14px', fontStyle: 'bold', fill: '#cbd5e1' }).setOrigin(0.5);
      titleBtn.on('pointerdown', () => {
        SoundManager.playTap();
        this.scene.start('SceneTitle');
      });

      // 4. ポータルへ (MORE GAMES)
      const portalBtn = this.add.rectangle(width / 2 + 95, 520, 160, 46, 0x475569).setInteractive({ useHandCursor: true });
      this.add.text(width / 2 + 95, 520, t.portalBtn, { fontSize: '14px', fontStyle: 'bold', fill: '#cbd5e1' }).setOrigin(0.5);
      portalBtn.on('pointerdown', () => {
        SoundManager.playTap();
        window.open('../index.html', '_self');
      });
    }
  }

  // ==========================================
  // 7. Phaser ゲーム設定・起動
  // ==========================================
  const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    width: 480,
    height: 800,
    backgroundColor: '#0d0a14',
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
      default: 'arcade',
      arcade: {
        gravity: { y: 0 },
        debug: false
      }
    },
    scene: [SceneTitle, SceneGame, SceneResult]
  };

  window.addEventListener('DOMContentLoaded', () => {
    new Phaser.Game(config);
  });

})();
</script>
