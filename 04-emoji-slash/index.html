<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>闘犬乱舞</title>
  <!-- Google Fonts: 和風フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&family=Zen+Antique+Soft&family=Zen+Old+Mincho:wght@700;900&display=swap" rel="stylesheet">
  <!-- Phaser 3.80.1 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #08080c;
      font-family: 'Zen Antique Soft', 'Zen Old Mincho', 'Yuji Boku', serif;
      touch-action: none;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1b162b 0%, #08070d 100%);
    }
    canvas {
      box-shadow: 0 0 35px rgba(255, 60, 0, 0.25), 0 0 80px rgba(0, 0, 0, 0.9);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    /* ==========================================================================
       SoundManager: Web Audio API プロシージャル和風サウンドエンジン
       ========================================================================== */
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.isMuted = false;
        this.bgmTimer = null;
        this.bgmStep = 0;
        this.isBgmPlaying = false;
        // 和風 都節・陽音階 (ラ, シ, ド, ミ, ファ / A, B, C, E, F)
        this.scale = [220, 246.94, 261.63, 329.63, 349.23, 440, 493.88, 523.25, 659.25, 698.46, 880];
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.isMuted) {
          this.stopBgm();
        } else {
          this.startBgm();
        }
        return this.isMuted;
      }

      // スワイプ風切り音 (Swish)
      playSwish(speedFactor = 1.0) {
        if (this.isMuted || !this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const bufferSize = Math.floor(this.ctx.sampleRate * 0.09);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.Q.setValueAtTime(3.0, t);
          const startFreq = 400 * Math.min(speedFactor, 2.5);
          filter.frequency.setValueAtTime(startFreq, t);
          filter.frequency.exponentialRampToValueAtTime(1400 * Math.min(speedFactor, 2.5), t + 0.05);
          filter.frequency.exponentialRampToValueAtTime(300, t + 0.09);

          const gain = this.ctx.createGain();
          const vol = Math.min(0.28 * speedFactor, 0.45);
          gain.gain.setValueAtTime(vol, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start(t);
          noise.stop(t + 0.09);
        } catch (e) {}
      }

      // 鋭い斬撃音 (金属音 + FM変調)
      playSlice(pitchMod = 1.0) {
        if (this.isMuted || !this.ctx) return;
        try {
          const t = this.ctx.currentTime;

          // キャリア
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(850 * pitchMod, t);
          osc.frequency.exponentialRampToValueAtTime(120 * pitchMod, t + 0.12);

          gain.gain.setValueAtTime(0.35, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);

          // モジュレータ
          const mod = this.ctx.createOscillator();
          const modGain = this.ctx.createGain();
          mod.type = 'sine';
          mod.frequency.setValueAtTime(1200 * pitchMod, t);
          modGain.gain.setValueAtTime(600 * pitchMod, t);
          modGain.gain.exponentialRampToValueAtTime(10, t + 0.1);

          mod.connect(osc.frequency);
          osc.connect(gain);
          gain.connect(this.ctx.destination);

          mod.start(t);
          osc.start(t);
          mod.stop(t + 0.12);
          osc.stop(t + 0.12);
        } catch (e) {}
      }

      // 破裂・果汁飛散音
      playSplat() {
        if (this.isMuted || !this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, t);
          osc.frequency.exponentialRampToValueAtTime(60, t + 0.15);

          gain.gain.setValueAtTime(0.3, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.15);
        } catch (e) {}
      }

      // 拍子木・和太鼓コンボ音
      playCombo(comboCount) {
        if (this.isMuted || !this.ctx) return;
        try {
          const t = this.ctx.currentTime;

          // 拍子木 (カァン！)
          const hyoshigi = this.ctx.createOscillator();
          const hyoGain = this.ctx.createGain();
          hyoshigi.type = 'sine';
          const freq = 1400 + Math.min(comboCount * 120, 1000);
          hyoshigi.frequency.setValueAtTime(freq, t);
          hyoshigi.frequency.exponentialRampToValueAtTime(freq * 0.8, t + 0.08);

          hyoGain.gain.setValueAtTime(0.45, t);
          hyoGain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

          hyoshigi.connect(hyoGain);
          hyoGain.connect(this.ctx.destination);
          hyoshigi.start(t);
          hyoshigi.stop(t + 0.14);

          // 和太鼓 (ドン！)
          const taiko = this.ctx.createOscillator();
          const taiGain = this.ctx.createGain();
          taiko.type = 'triangle';
          taiko.frequency.setValueAtTime(160, t);
          taiko.frequency.exponentialRampToValueAtTime(35, t + 0.25);

          taiGain.gain.setValueAtTime(0.5, t);
          taiGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);

          taiko.connect(taiGain);
          taiGain.connect(this.ctx.destination);
          taiko.start(t);
          taiko.stop(t + 0.25);
        } catch (e) {}
      }

      // 爆弾爆発音
      playBomb() {
        if (this.isMuted || !this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const bufferSize = Math.floor(this.ctx.sampleRate * 0.8);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.25));
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(450, t);
          filter.frequency.exponentialRampToValueAtTime(40, t + 0.8);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.7, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);

          // 重低音サブベース
          const sub = this.ctx.createOscillator();
          const subGain = this.ctx.createGain();
          sub.type = 'sine';
          sub.frequency.setValueAtTime(90, t);
          sub.frequency.exponentialRampToValueAtTime(20, t + 0.7);
          subGain.gain.setValueAtTime(0.8, t);
          subGain.gain.exponentialRampToValueAtTime(0.001, t + 0.7);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          sub.connect(subGain);
          subGain.connect(this.ctx.destination);

          noise.start(t);
          sub.start(t);
          noise.stop(t + 0.8);
          sub.stop(t + 0.8);
        } catch (e) {}
      }

      // 金の龍撃破音 (神聖な銅鑼 + 琴の響き)
      playDragon() {
        if (this.isMuted || !this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          // 和風ゴング
          [220, 330, 440, 550, 660].forEach((f, idx) => {
            const osc = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, t + idx * 0.04);
            g.gain.setValueAtTime(0.3 / (idx + 1), t + idx * 0.04);
            g.gain.exponentialRampToValueAtTime(0.001, t + 1.2);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(t + idx * 0.04);
            osc.stop(t + 1.2);
          });
        } catch (e) {}
      }

      // 見逃しミス音
      playMiss() {
        if (this.isMuted || !this.ctx) return;
        try {
          const t = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, t);
          osc.frequency.setValueAtTime(110, t + 0.1);
          g.gain.setValueAtTime(0.2, t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
          osc.connect(g);
          g.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.22);
        } catch (e) {}
      }

      // 和風BGMループ (琴風ペンタトニックアルペジオ + 和太鼓ビート)
      startBgm() {
        if (this.isMuted || !this.ctx || this.isBgmPlaying) return;
        this.isBgmPlaying = true;
        this.bgmStep = 0;
        const melodyPattern = [0, 2, 4, 3, 2, 0, 1, 0, 4, 3, 5, 4, 2, 1, 2, 0];
        const tempo = 135; // BPM
        const stepTime = (60 / tempo) / 2; // 8分音符

        this.bgmTimer = setInterval(() => {
          if (this.isMuted || !this.ctx) return;
          const t = this.ctx.currentTime;
          const noteIndex = melodyPattern[this.bgmStep % melodyPattern.length];
          const freq = this.scale[noteIndex + 3];

          // 琴風プラック音
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);

          gain.gain.setValueAtTime(0.06, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + stepTime * 1.5);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + stepTime * 1.5);

          // 4拍ごとに太鼓の低音
          if (this.bgmStep % 4 === 0) {
            const drum = this.ctx.createOscillator();
            const dGain = this.ctx.createGain();
            drum.type = 'sine';
            drum.frequency.setValueAtTime(110, t);
            drum.frequency.exponentialRampToValueAtTime(30, t + 0.2);
            dGain.gain.setValueAtTime(0.12, t);
            dGain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
            drum.connect(dGain);
            dGain.connect(this.ctx.destination);
            drum.start(t);
            drum.stop(t + 0.2);
          }

          this.bgmStep++;
        }, stepTime * 1000);
      }

      stopBgm() {
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
        this.isBgmPlaying = false;
      }
    }

    const sound = new SoundManager();

    /* ==========================================================================
       ターゲット定義 & 定数
       ========================================================================== */
    const TARGET_TYPES = {
      FOOD: [
        { emoji: '🍉', color: 0xff3344, splashColor: '#ff2a4b', name: '西瓜', points: 10 },
        { emoji: '🍣', color: 0xff7733, splashColor: '#ff8844', name: '寿司', points: 15 },
        { emoji: '🍎', color: 0xff2222, splashColor: '#ff1133', name: '林檎', points: 10 },
        { emoji: '🍕', color: 0xffbb22, splashColor: '#ffcc00', name: '披薩', points: 15 },
        { emoji: '🍖', color: 0xaa5522, splashColor: '#cc6633', name: '肉',   points: 20 },
        { emoji: '🍙', color: 0xeeeeee, splashColor: '#ffffff', name: '飯魂', points: 10 },
        { emoji: '🍰', color: 0xff66aa, splashColor: '#ff77bb', name: '菓子', points: 20 },
        { emoji: '🍇', color: 0x9933ff, splashColor: '#aa44ff', name: '葡萄', points: 15 },
        { emoji: '🍌', color: 0xffdd00, splashColor: '#ffee22', name: '香蕉', points: 10 },
        { emoji: '🥑', color: 0x44aa22, splashColor: '#55cc33', name: '鰐梨', points: 15 }
      ],
      BOMB: { emoji: '💣', color: 0x222222, splashColor: '#ff3300', name: '爆弾' },
      DRAGON: { emoji: '🐉', color: 0xffd700, splashColor: '#ffd700', name: '金龍', points: 200 }
    };

    /* ==========================================================================
       BootScene: テクスチャ生成 & プリロード
       ========================================================================== */
    class BootScene extends Phaser.Scene {
      constructor() {
        super({ key: 'BootScene' });
      }

      create() {
        // 絵文字テクスチャをCanvasで高解像度レンダリングしてキャッシュ
        const renderEmoji = (key, emoji, size = 110) => {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.font = `${Math.floor(size * 0.72)}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(emoji, size / 2, size / 2 + size * 0.05);
          this.textures.addCanvas(key, canvas);
        };

        // 全食材絵文字
        TARGET_TYPES.FOOD.forEach((f, i) => {
          renderEmoji(`emoji_food_${i}`, f.emoji);
        });
        // 爆弾 & 金の龍
        renderEmoji('emoji_bomb', TARGET_TYPES.BOMB.emoji);
        renderEmoji('emoji_dragon', TARGET_TYPES.DRAGON.emoji, 130);

        // 桜の花びらパーティクル用テクスチャ
        const sakuraCanvas = document.createElement('canvas');
        sakuraCanvas.width = 24;
        sakuraCanvas.height = 24;
        const sCtx = sakuraCanvas.getContext('2d');
        sCtx.fillStyle = '#ffb7c5';
        sCtx.beginPath();
        sCtx.ellipse(12, 12, 10, 5, Math.PI / 4, 0, Math.PI * 2);
        sCtx.fill();
        this.textures.addCanvas('particle_sakura', sakuraCanvas);

        // スパーク用テクスチャ
        const sparkCanvas = document.createElement('canvas');
        sparkCanvas.width = 16;
        sparkCanvas.height = 16;
        const spCtx = sparkCanvas.getContext('2d');
        const grad = spCtx.createRadialGradient(8, 8, 0, 8, 8, 8);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.4, '#ffdd44');
        grad.addColorStop(1, 'rgba(255, 60, 0, 0)');
        spCtx.fillStyle = grad;
        spCtx.beginPath();
        spCtx.arc(8, 8, 8, 0, Math.PI * 2);
        spCtx.fill();
        this.textures.addCanvas('particle_spark', sparkCanvas);

        this.scene.start('TitleScene');
      }
    }

    /* ==========================================================================
       TitleScene: 和風タイトル画面
       ========================================================================== */
    class TitleScene extends Phaser.Scene {
      constructor() {
        super({ key: 'TitleScene' });
      }

      create() {
        const { width, height } = this.scale;

        // 背景和風グラフィック
        const bgGfx = this.add.graphics();
        bgGfx.fillGradientStyle(0x181224, 0x181224, 0x08060c, 0x08060c, 1);
        bgGfx.fillRect(0, 0, width, height);

        // 家紋風の円形バックグラウンド装飾
        const crest = this.add.graphics();
        crest.lineStyle(3, 0xff3300, 0.25);
        crest.strokeCircle(width / 2, height * 0.38, 220);
        crest.lineStyle(1.5, 0xffaa00, 0.2);
        crest.strokeCircle(width / 2, height * 0.38, 250);

        // 舞い散る桜吹雪エフェクト
        this.sakuraEmitter = this.add.particles(0, 0, 'particle_sakura', {
          x: { min: 0, max: width },
          y: -20,
          lifespan: 5000,
          speedY: { min: 80, max: 180 },
          speedX: { min: -40, max: 40 },
          rotation: { min: 0, max: 360 },
          rotate: { start: 0, end: 360 },
          scale: { min: 0.6, max: 1.3 },
          alpha: { start: 0.8, end: 0 },
          frequency: 250
        });

        // タイトルロゴ
        const mainTitle = this.add.text(width / 2, height * 0.28, '一閃爽快！', {
          fontSize: '44px',
          fontFamily: '"Zen Old Mincho", "Yuji Boku", serif',
          fontWeight: '900',
          color: '#ff4422',
          stroke: '#000000',
          strokeThickness: 8,
          shadow: { offsetX: 0, offsetY: 6, color: '#ff2200', blur: 15, fill: true }
        }).setOrigin(0.5);

        const subTitle = this.add.text(width / 2, height * 0.38, '闘犬乱舞', {
          fontSize: '84px',
          fontFamily: '"Zen Old Mincho", "Yuji Boku", serif',
          fontWeight: '900',
          color: '#ffd700',
          stroke: '#220000',
          strokeThickness: 12,
          shadow: { offsetX: 0, offsetY: 8, color: '#ff8800', blur: 25, fill: true }
        }).setOrigin(0.5);

        this.tweens.add({
          targets: [mainTitle, subTitle],
          scale: { from: 0.96, to: 1.04 },
          duration: 1800,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });

        // 遊び方説明
        const guideBox = this.add.graphics();
        guideBox.fillStyle(0x000000, 0.6);
        guideBox.fillRoundedRect(width / 2 - 270, height * 0.52, 540, 240, 16);
        guideBox.lineStyle(2, 0xaa7733, 0.6);
        guideBox.strokeRoundedRect(width / 2 - 270, height * 0.52, 540, 240, 16);

        this.add.text(width / 2, height * 0.55, '【 乱舞心得 】', {
          fontSize: '28px',
          color: '#ffd700',
          fontWeight: 'bold'
        }).setOrigin(0.5);

        const guideText = [
          '● 画面を素早くスワイプして食材を両断せよ！',
          '● 3回見逃し（🐶）で敗北 / 💣爆弾を切ると即死！',
          '● 一筆で複数両断で「一閃」「神速」コンボ！',
          '● 稀に出現する 🐉金龍 で「無双フィーバー」！'
        ].join('\n\n');

        this.add.text(width / 2, height * 0.64, guideText, {
          fontSize: '20px',
          color: '#dddddd',
          align: 'center',
          lineSpacing: 4
        }).setOrigin(0.5);

        // ハイスコア表示 (旧キーもフォールバック)
        const highScore = localStorage.getItem('touken_ranbu_highscore') || localStorage.getItem('slash_samurai_highscore') || 0;
        this.add.text(width / 2, height * 0.77, `最高記録：${highScore} 閃`, {
          fontSize: '28px',
          color: '#ffcc44',
          fontWeight: 'bold'
        }).setOrigin(0.5);

        // スタート促進ボタン / スワイプ開始メッセージ
        const startBanner = this.add.container(width / 2, height * 0.86);
        const btnBg = this.add.graphics();
        btnBg.fillStyle(0xcc2200, 0.9);
        btnBg.fillRoundedRect(-220, -38, 440, 76, 38);
        btnBg.lineStyle(3, 0xffd700, 0.9);
        btnBg.strokeRoundedRect(-220, -38, 440, 76, 38);

        const btnTxt = this.add.text(0, 0, '⚔️ スワイプして開戦 ⚔️', {
          fontSize: '32px',
          fontWeight: 'bold',
          color: '#ffffff'
        }).setOrigin(0.5);

        startBanner.add([btnBg, btnTxt]);

        this.tweens.add({
          targets: startBanner,
          scale: { from: 0.93, to: 1.07 },
          alpha: { from: 0.85, to: 1.0 },
          duration: 900,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });

        // 刀筋トレイル体験用
        this.bladePoints = [];
        this.bladeGraphics = this.add.graphics();

        this.input.on('pointerdown', (pointer) => {
          sound.init();
          sound.startBgm();
          this.bladePoints = [{ x: pointer.x, y: pointer.y, time: Date.now() }];
        });

        this.input.on('pointermove', (pointer) => {
          if (!pointer.isDown) return;
          const now = Date.now();
          this.bladePoints.push({ x: pointer.x, y: pointer.y, time: now });
          if (this.bladePoints.length > 2) {
            const p1 = this.bladePoints[this.bladePoints.length - 2];
            const p2 = this.bladePoints[this.bladePoints.length - 1];
            const dist = Phaser.Math.Distance.Between(p1.x, p1.y, p2.x, p2.y);
            const dt = (p2.time - p1.time) / 1000 || 0.016;
            if (dist / dt > 160) {
              sound.playSlice(1.2);
              this.cameras.main.flash(300, 255, 255, 255);
              this.scene.start('GameScene');
            }
          }
        });
      }

      update() {
        const now = Date.now();
        this.bladePoints = this.bladePoints.filter(p => now - p.time < 120);
        this.bladeGraphics.clear();
        if (this.bladePoints.length > 1) {
          for (let i = 1; i < this.bladePoints.length; i++) {
            const p1 = this.bladePoints[i - 1];
            const p2 = this.bladePoints[i];
            const alpha = i / this.bladePoints.length;
            this.bladeGraphics.lineStyle(12 * alpha, 0xff3300, alpha * 0.8);
            this.bladeGraphics.lineBetween(p1.x, p1.y, p2.x, p2.y);
            this.bladeGraphics.lineStyle(4 * alpha, 0xffffff, alpha);
            this.bladeGraphics.lineBetween(p1.x, p1.y, p2.x, p2.y);
          }
        }
      }
    }

    /* ==========================================================================
       GameScene: メインゲームループ
       ========================================================================== */
    class GameScene extends Phaser.Scene {
      constructor() {
        super({ key: 'GameScene' });
      }

      create() {
        sound.init();
        sound.startBgm();

        const { width, height } = this.scale;

        // ゲーム状態変数
        this.score = 0;
        this.lives = 3;
        this.isGameOver = false;
        this.isFever = false;
        this.feverTimer = 0;
        this.gameTime = 0;
        this.spawnTimer = 0;
        this.dragonSpawnTimer = 18; // 18秒後に出現チャンス

        // 1ストローク管理（コンボ判定用）
        this.currentStrokeSlices = [];
        this.lastSliceTime = 0;

        // グループ管理
        this.targets = this.add.group();
        this.slicedPieces = this.add.group();

        // 背景
        this.bgGfx = this.add.graphics();
        this.drawBackground(0x120d1c);

        // 桜吹雪パーティクル
        this.sakuraEmitter = this.add.particles(0, 0, 'particle_sakura', {
          x: { min: 0, max: width },
          y: -20,
          lifespan: 5000,
          speedY: { min: 60, max: 140 },
          speedX: { min: -30, max: 30 },
          rotation: { min: 0, max: 360 },
          rotate: { start: 0, end: 360 },
          scale: { min: 0.5, max: 1.1 },
          alpha: { start: 0.7, end: 0 },
          frequency: 350
        });

        // 刀筋グラフィックス
        this.bladeGraphics = this.add.graphics();
        this.bladePoints = [];
        this.lastSwishTime = 0;

        // HUD構築
        this.createHUD();

        // 入力イベント
        this.input.on('pointerdown', (p) => this.onPointerDown(p));
        this.input.on('pointermove', (p) => this.onPointerMove(p));
        this.input.on('pointerup', () => this.onPointerUp());
      }

      drawBackground(baseColor) {
        const { width, height } = this.scale;
        this.bgGfx.clear();
        this.bgGfx.fillGradientStyle(baseColor, baseColor, 0x050408, 0x050408, 1);
        this.bgGfx.fillRect(0, 0, width, height);

        // 竹林・墨絵風の背景シルエット装飾
        this.bgGfx.fillStyle(0x000000, 0.35);
        for (let i = 0; i < 6; i++) {
          const bx = i * 140 + 30;
          this.bgGfx.fillRect(bx, 0, 18, height);
          for (let j = 0; j < 8; j++) {
            this.bgGfx.fillCircle(bx + 9, j * 160 + 50, 12);
          }
        }
      }

      createHUD() {
        const { width } = this.scale;

        // ライフ表示 (左上に 3匹の闘犬 🐶)
        this.lifeIcons = [];
        for (let i = 0; i < 3; i++) {
          const icon = this.add.text(45 + i * 55, 48, '🐶', {
            fontSize: '40px'
          }).setOrigin(0.5);
          this.lifeIcons.push(icon);
        }

        // スコア表示
        this.scoreLabel = this.add.text(40, 85, '斬数', {
          fontSize: '20px',
          color: '#aa8855',
          fontFamily: '"Zen Old Mincho", serif'
        });

        this.scoreText = this.add.text(40, 115, '0', {
          fontSize: '48px',
          fontWeight: '900',
          color: '#ffd700',
          stroke: '#000000',
          strokeThickness: 6,
          fontFamily: '"Zen Old Mincho", serif'
        });

        // フィーバーバナー
        this.feverContainer = this.add.container(width / 2, 170).setVisible(false);
        const feverBg = this.add.graphics();
        feverBg.fillStyle(0xffaa00, 0.9);
        feverBg.fillRoundedRect(-180, -25, 360, 50, 25);
        feverBg.lineStyle(3, 0xffffff, 1);
        feverBg.strokeRoundedRect(-180, -25, 360, 50, 25);

        const feverTxt = this.add.text(0, 0, '⚡ 無双乱舞フィーバー中 ⚡', {
          fontSize: '24px',
          fontWeight: 'bold',
          color: '#000000',
          fontFamily: '"Zen Old Mincho", serif'
        }).setOrigin(0.5);
        this.feverContainer.add([feverBg, feverTxt]);

        // ミュートボタン
        this.muteBtn = this.add.text(width - 50, 125, '🔊', {
          fontSize: '32px'
        }).setOrigin(0.5).setInteractive();

        this.muteBtn.on('pointerdown', () => {
          const isMuted = sound.toggleMute();
          this.muteBtn.setText(isMuted ? '🔇' : '🔊');
        });
      }

      onPointerDown(pointer) {
        if (this.isGameOver) return;
        this.bladePoints = [{ x: pointer.x, y: pointer.y, time: Date.now() }];
        this.currentStrokeSlices = [];
      }

      onPointerMove(pointer) {
        if (this.isGameOver || !pointer.isDown) return;
        const now = Date.now();
        const p2 = { x: pointer.x, y: pointer.y, time: now };
        this.bladePoints.push(p2);

        if (this.bladePoints.length < 2) return;

        const p1 = this.bladePoints[this.bladePoints.length - 2];
        const dist = Phaser.Math.Distance.Between(p1.x, p1.y, p2.x, p2.y);
        const dt = (p2.time - p1.time) / 1000 || 0.016;
        const speed = dist / dt; // px/sec

        // 一定速度（180px/s）以上のスワイプで刃が立ちスライス判定（PCマウスでも快適）
        if (speed > 180) {
          if (now - this.lastSwishTime > 150) {
            sound.playSwish(Math.max(speed / 600, 0.6));
            this.lastSwishTime = now;
          }

          // 線分とターゲットの交差判定
          this.checkSliceCollisions(p1, p2);
        }
      }

      onPointerUp() {
        if (this.isGameOver) return;
        this.evaluateCombo();
      }

      checkSliceCollisions(p1, p2) {
        const activeTargets = this.targets.getChildren().filter(t => t.active && !t.isSliced);

        activeTargets.forEach(target => {
          const radius = target.hitRadius || 45;
          const circle = new Phaser.Geom.Circle(target.x, target.y, radius);
          const line = new Phaser.Geom.Line(p1.x, p1.y, p2.x, p2.y);

          if (Phaser.Geom.Intersects.LineToCircle(line, circle)) {
            this.sliceTarget(target, p1, p2);
          }
        });
      }

      sliceTarget(target, p1, p2) {
        target.isSliced = true;
        const angle = Phaser.Math.Angle.Between(p1.x, p1.y, p2.x, p2.y);

        // 💣 爆弾を斬った場合 -> 即座に大爆発ゲームオーバー
        if (target.targetType === 'BOMB') {
          this.triggerBombExplosion(target);
          return;
        }

        // 🐉 金の龍を斬った場合 -> 無双フィーバー
        if (target.targetType === 'DRAGON') {
          this.triggerDragonSlashed(target, angle);
          return;
        }

        // 通常食材のスライス
        const foodData = target.foodData;
        this.score += (this.isFever ? foodData.points * 2 : foodData.points);
        this.scoreText.setText(this.score.toString());

        // スケールポップアニメーション
        this.tweens.add({
          targets: this.scoreText,
          scale: { from: 1.3, to: 1.0 },
          duration: 180,
          ease: 'Back.easeOut'
        });

        // サウンド
        sound.playSlice(Phaser.Math.FloatBetween(0.9, 1.25));
        sound.playSplat();

        // 画面シェイク (微小)
        this.cameras.main.shake(120, 0.007);

        // Canvas動的クリッピングで左右真っ二つに分割
        this.createSlicedPieces(target, angle);

        // パーティクル放出 (果汁 + スパーク + 桜)
        this.emitSliceParticles(target.x, target.y, foodData.splashColor);

        // 閃光一閃ライン
        this.drawFlashSlash(p1, p2);

        // ストローク内のスライス数を記録
        this.currentStrokeSlices.push(foodData);
        this.lastSliceTime = Date.now();

        // 元のターゲット消滅
        target.destroy();
      }

      // Canvas動的クリッピング切断処理
      createSlicedPieces(target, angle) {
        const size = 110;
        const halfSize = size / 2;

        // 角度 angle に沿って元テクスチャを上下(左右)半分に描画した2つの動的Canvasを生成
        const createHalfCanvas = (isTopSide) => {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');

          ctx.save();
          // 中心へ移動してスライス角度だけ回転
          ctx.translate(halfSize, halfSize);
          ctx.rotate(-angle);

          // 半分だけクリッピング
          ctx.beginPath();
          if (isTopSide) {
            ctx.rect(-halfSize, -halfSize, size, halfSize);
          } else {
            ctx.rect(-halfSize, 0, size, halfSize);
          }
          ctx.clip();

          // 回転を戻して絵文字を描画
          ctx.rotate(angle);
          ctx.font = `${Math.floor(size * 0.72)}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(target.foodData.emoji, 0, size * 0.05);

          ctx.restore();
          return canvas;
        };

        const canvasA = createHalfCanvas(true);
        const canvasB = createHalfCanvas(false);

        const texKeyA = `cut_${Date.now()}_${Math.random()}_a`;
        const texKeyB = `cut_${Date.now()}_${Math.random()}_b`;
        this.textures.addCanvas(texKeyA, canvasA);
        this.textures.addCanvas(texKeyB, canvasB);

        // 法線ベクトル (切断線に対して左右外向きに飛ばす)
        const normalAngle1 = angle + Math.PI / 2;
        const normalAngle2 = angle - Math.PI / 2;
        const pushSpeed = Phaser.Math.Between(220, 360);

        // Piece A
        const pieceA = this.physics.add.sprite(target.x, target.y, texKeyA);
        pieceA.setVelocity(
          Math.cos(normalAngle1) * pushSpeed + target.body.velocity.x * 0.4,
          Math.sin(normalAngle1) * pushSpeed + target.body.velocity.y * 0.4
        );
        pieceA.setAngularVelocity(Phaser.Math.Between(180, 400));
        pieceA.texKey = texKeyA;
        this.slicedPieces.add(pieceA);

        // Piece B
        const pieceB = this.physics.add.sprite(target.x, target.y, texKeyB);
        pieceB.setVelocity(
          Math.cos(normalAngle2) * pushSpeed + target.body.velocity.x * 0.4,
          Math.sin(normalAngle2) * pushSpeed + target.body.velocity.y * 0.4
        );
        pieceB.setAngularVelocity(Phaser.Math.Between(-400, -180));
        pieceB.texKey = texKeyB;
        this.slicedPieces.add(pieceB);
      }

      // パーティクル演出
      emitSliceParticles(x, y, splashColor) {
        // 果汁スプラッシュ (丸いパーティクル)
        for (let i = 0; i < 14; i++) {
          const spark = this.add.graphics();
          spark.fillStyle(Phaser.Display.Color.HexStringToColor(splashColor).color, 1);
          spark.fillCircle(0, 0, Phaser.Math.Between(3, 8));
          spark.setPosition(x, y);

          const rad = Phaser.Math.FloatBetween(0, Math.PI * 2);
          const spd = Phaser.Math.Between(100, 350);
          const vx = Math.cos(rad) * spd;
          const vy = Math.sin(rad) * spd;

          this.tweens.add({
            targets: spark,
            x: x + vx * 0.4,
            y: y + vy * 0.4 + 60,
            scale: 0,
            alpha: 0,
            duration: Phaser.Math.Between(300, 550),
            onComplete: () => spark.destroy()
          });
        }

        // 金の火花スパーク
        for (let i = 0; i < 8; i++) {
          const sp = this.add.image(x, y, 'particle_spark');
          sp.setScale(Phaser.Math.FloatBetween(0.8, 1.6));
          const rad = Phaser.Math.FloatBetween(0, Math.PI * 2);
          const dist = Phaser.Math.Between(40, 160);

          this.tweens.add({
            targets: sp,
            x: x + Math.cos(rad) * dist,
            y: y + Math.sin(rad) * dist,
            alpha: 0,
            scale: 0,
            duration: 350,
            onComplete: () => sp.destroy()
          });
        }
      }

      // 閃光一閃ライン
      drawFlashSlash(p1, p2) {
        const flashGfx = this.add.graphics();
        flashGfx.lineStyle(6, 0xffffff, 1);
        flashGfx.lineBetween(p1.x, p1.y, p2.x, p2.y);
        flashGfx.lineStyle(14, 0xffd700, 0.7);
        flashGfx.lineBetween(p1.x, p1.y, p2.x, p2.y);

        this.tweens.add({
          targets: flashGfx,
          alpha: 0,
          duration: 160,
          onComplete: () => flashGfx.destroy()
        });
      }

      // コンボ判定
      evaluateCombo() {
        const count = this.currentStrokeSlices.length;
        if (count >= 2) {
          let bonus = 0;
          let title = '';
          let color = '#ffd700';

          if (count === 2) {
            title = '二連斬！';
            bonus = 20;
            color = '#33ccff';
          } else if (count === 3) {
            title = '一閃！';
            bonus = 50;
            color = '#ffbb00';
          } else if (count === 4) {
            title = '神速！';
            bonus = 100;
            color = '#ff4400';
          } else {
            title = '天下無双！';
            bonus = 200;
            color = '#ff0055';
          }

          this.score += bonus;
          this.scoreText.setText(this.score.toString());

          sound.playCombo(count);
          this.showComboCutIn(title, `+${bonus}`, color);
          this.cameras.main.shake(180, 0.015);
        }
        this.currentStrokeSlices = [];
      }

      showComboCutIn(title, bonusStr, color) {
        const { width, height } = this.scale;
        const container = this.add.container(width / 2, height * 0.45);

        const txt = this.add.text(0, 0, title, {
          fontSize: '64px',
          fontWeight: '900',
          fontFamily: '"Zen Old Mincho", "Yuji Boku", serif',
          color: color,
          stroke: '#000000',
          strokeThickness: 8,
          shadow: { offsetX: 0, offsetY: 6, color: color, blur: 20, fill: true }
        }).setOrigin(0.5);

        const sub = this.add.text(0, 55, bonusStr, {
          fontSize: '36px',
          fontWeight: 'bold',
          color: '#ffffff',
          stroke: '#000000',
          strokeThickness: 5
        }).setOrigin(0.5);

        container.add([txt, sub]);
        container.setScale(0.2);

        this.tweens.add({
          targets: container,
          scale: 1.2,
          duration: 200,
          ease: 'Back.easeOut',
          onComplete: () => {
            this.tweens.add({
              targets: container,
              scale: 1.4,
              alpha: 0,
              y: height * 0.4,
              duration: 400,
              delay: 300,
              onComplete: () => container.destroy()
            });
          }
        });
      }

      // 🐉 金の龍スライス時演出
      triggerDragonSlashed(target, angle) {
        sound.playDragon();
        this.score += TARGET_TYPES.DRAGON.points;
        this.scoreText.setText(this.score.toString());

        this.cameras.main.flash(400, 255, 215, 0);
        this.cameras.main.shake(300, 0.025);

        this.emitSliceParticles(target.x, target.y, '#ffd700');
        this.showComboCutIn('無双乱舞！', '+200 & フィーバー！', '#ffd700');

        target.destroy();
        this.startFever();
      }

      startFever() {
        this.isFever = true;
        this.feverTimer = 5.0; // 5秒間
        this.feverContainer.setVisible(true);
        this.drawBackground(0x2a1a05);

        // 物理スローモーション
        this.physics.world.timeScale = 0.5;

        // 大量食材噴出シャワー
        for (let i = 0; i < 16; i++) {
          this.time.delayedCall(i * 200, () => {
            if (this.isGameOver) return;
            this.spawnTarget(true); // 食材のみ強制
          });
        }
      }

      endFever() {
        this.isFever = false;
        this.feverContainer.setVisible(false);
        this.drawBackground(0x120d1c);
        this.physics.world.timeScale = 1.0;
      }

      // 💣 爆弾爆発
      triggerBombExplosion(target) {
        sound.playBomb();
        this.isGameOver = true;

        this.cameras.main.flash(600, 255, 50, 0);
        this.cameras.main.shake(600, 0.04);

        // 爆破パーティクル
        for (let i = 0; i < 30; i++) {
          const p = this.add.graphics();
          p.fillStyle(Phaser.Math.RND.pick([0xff3300, 0xffbb00, 0x222222]), 1);
          p.fillCircle(0, 0, Phaser.Math.Between(6, 18));
          p.setPosition(target.x, target.y);

          const rad = Phaser.Math.FloatBetween(0, Math.PI * 2);
          const spd = Phaser.Math.Between(150, 600);
          this.tweens.add({
            targets: p,
            x: target.x + Math.cos(rad) * spd,
            y: target.y + Math.sin(rad) * spd,
            alpha: 0,
            scale: 0,
            duration: 600,
            onComplete: () => p.destroy()
          });
        }

        target.destroy();
        this.time.delayedCall(800, () => this.gameOver('爆弾被弾！'));
      }

      // 食材見逃し落下処理
      onMissTarget(target) {
        if (this.isGameOver || this.isFever) return;

        this.lives--;
        sound.playMiss();

        // ライフアイコン更新 (🐶 -> 💀)
        if (this.lives >= 0 && this.lives < 3) {
          const icon = this.lifeIcons[this.lives];
          icon.setText('💀');
          this.tweens.add({
            targets: icon,
            scale: { from: 1.8, to: 1.0 },
            duration: 250,
            ease: 'Back.easeOut'
          });
        }

        // 赤い画面フラッシュ
        this.cameras.main.flash(200, 200, 0, 0);

        if (this.lives <= 0) {
          this.isGameOver = true;
          this.time.delayedCall(400, () => this.gameOver('食材見逃し！'));
        }
      }

      gameOver(reason) {
        this.scene.start('GameOverScene', { score: this.score, reason: reason });
      }

      // スポーンロジック
      spawnTarget(forceFood = false) {
        const { width, height } = this.scale;
        const x = Phaser.Math.Between(120, width - 120);
        const y = height + 40;

        let targetSprite;
        const roll = Math.random();

        if (!forceFood && roll < 0.16) {
          // 💣 爆弾 (16%)
          targetSprite = this.physics.add.sprite(x, y, 'emoji_bomb');
          targetSprite.targetType = 'BOMB';
          targetSprite.hitRadius = 45;

          // 導火線の火花エフェクト
          targetSprite.fuseTimer = this.time.addEvent({
            delay: 100,
            loop: true,
            callback: () => {
              if (targetSprite && targetSprite.active) {
                const sp = this.add.image(targetSprite.x + 20, targetSprite.y - 25, 'particle_spark');
                sp.setScale(0.6);
                this.tweens.add({
                  targets: sp,
                  y: sp.y - 15,
                  alpha: 0,
                  duration: 200,
                  onComplete: () => sp.destroy()
                });
              }
            }
          });
        } else {
          // 通常食材
          const foodIdx = Phaser.Math.Between(0, TARGET_TYPES.FOOD.length - 1);
          const foodData = TARGET_TYPES.FOOD[foodIdx];
          targetSprite = this.physics.add.sprite(x, y, `emoji_food_${foodIdx}`);
          targetSprite.targetType = 'FOOD';
          targetSprite.foodData = foodData;
          targetSprite.hitRadius = 48;
        }

        targetSprite.isSliced = false;

        // 画面上部までフワッと高く滞空する打ち上げ物理速度（初速+15% & 重力480）
        const targetX = width / 2 + Phaser.Math.Between(-180, 180);
        const vx = (targetX - x) * Phaser.Math.FloatBetween(0.5, 0.95);
        const vy = Phaser.Math.Between(-1240, -1440);

        targetSprite.setVelocity(vx, vy);
        targetSprite.setAngularVelocity(Phaser.Math.Between(-140, 140));
        targetSprite.setGravityY(480);

        this.targets.add(targetSprite);
      }

      // 金の龍 🐉 スポーン (高速横切り)
      spawnDragon() {
        const { width, height } = this.scale;
        const fromLeft = Math.random() > 0.5;
        const startX = fromLeft ? -60 : width + 60;
        const startY = Phaser.Math.Between(height * 0.22, height * 0.40);

        const dragon = this.physics.add.sprite(startX, startY, 'emoji_dragon');
        dragon.targetType = 'DRAGON';
        dragon.hitRadius = 55;
        dragon.isSliced = false;

        const vx = fromLeft ? Phaser.Math.Between(550, 750) : Phaser.Math.Between(-750, -550);
        const vy = Phaser.Math.Between(-60, 60);

        dragon.setVelocity(vx, vy);
        dragon.setGravityY(60); // 直線に近い安定軌道
        dragon.setAngularVelocity(fromLeft ? 90 : -90);

        // 黄金オーラ追従エフェクト
        dragon.auraEvent = this.time.addEvent({
          delay: 60,
          loop: true,
          callback: () => {
            if (dragon && dragon.active) {
              const sp = this.add.image(dragon.x, dragon.y, 'particle_spark');
              sp.setScale(1.4);
              this.tweens.add({
                targets: sp,
                scale: 0,
                alpha: 0,
                duration: 300,
                onComplete: () => sp.destroy()
              });
            }
          }
        });

        this.targets.add(dragon);
      }

      update(time, delta) {
        const dt = delta / 1000;
        this.gameTime += dt;

        // 刀筋の描画更新 (170ms保持で滑らかに)
        const now = Date.now();
        this.bladePoints = this.bladePoints.filter(p => now - p.time < 170);
        this.bladeGraphics.clear();

        if (this.bladePoints.length > 1) {
          for (let i = 1; i < this.bladePoints.length; i++) {
            const p1 = this.bladePoints[i - 1];
            const p2 = this.bladePoints[i];
            const ratio = i / this.bladePoints.length;

            // 筆跡風トレイル (朱色外郭 + 純白・黄金コア)
            this.bladeGraphics.lineStyle(16 * ratio, 0xee3300, ratio * 0.85);
            this.bladeGraphics.lineBetween(p1.x, p1.y, p2.x, p2.y);

            this.bladeGraphics.lineStyle(6 * ratio, 0xffffff, ratio * 1.0);
            this.bladeGraphics.lineBetween(p1.x, p1.y, p2.x, p2.y);
          }
        }

        // フィーバータイマー管理
        if (this.isFever) {
          this.feverTimer -= dt;
          if (this.feverTimer <= 0) {
            this.endFever();
          }
        }

        if (this.isGameOver) return;

        // スポーン周期タイマー (山なりに気持ちよくポンポン出現)
        this.spawnTimer += dt;
        const currentInterval = Math.max(2.1 - this.gameTime * 0.012, 1.1);
        if (this.spawnTimer >= currentInterval && !this.isFever) {
          this.spawnTimer = 0;
          const count = Phaser.Math.Between(1, this.gameTime > 35 ? 3 : 2);
          for (let i = 0; i < count; i++) {
            this.time.delayedCall(i * 180, () => {
              if (!this.isGameOver) this.spawnTarget();
            });
          }
        }

        // 🐉 金の龍 出現管理
        this.dragonSpawnTimer -= dt;
        if (this.dragonSpawnTimer <= 0) {
          this.spawnDragon();
          this.dragonSpawnTimer = Phaser.Math.Between(22, 35);
        }

        // 画面外落下判定 & クリーンアップ
        const { height } = this.scale;
        this.targets.getChildren().forEach(target => {
          if (target.y > height + 80 && target.body.velocity.y > 0) {
            if (target.targetType === 'FOOD' && !target.isSliced) {
              this.onMissTarget(target);
            }
            if (target.fuseTimer) target.fuseTimer.remove();
            if (target.auraEvent) target.auraEvent.remove();
            target.destroy();
          }
        });

        // 分割されたピースのクリーンアップ & テクスチャ解放
        this.slicedPieces.getChildren().forEach(piece => {
          if (piece.y > height + 100) {
            if (piece.texKey && this.textures.exists(piece.texKey)) {
              this.textures.remove(piece.texKey);
            }
            piece.destroy();
          }
        });
      }
    }

    /* ==========================================================================
       GameOverScene: リザルト画面 & Xシェア
       ========================================================================== */
    class GameOverScene extends Phaser.Scene {
      constructor() {
        super({ key: 'GameOverScene' });
      }

      init(data) {
        this.finalScore = data.score || 0;
        this.reason = data.reason || '無念！';
      }

      create() {
        const { width, height } = this.scale;

        // ハイスコア更新チェック
        const currentHigh = parseInt(localStorage.getItem('touken_ranbu_highscore') || localStorage.getItem('slash_samurai_highscore') || '0', 10);
        let isNewHigh = false;
        if (this.finalScore > currentHigh) {
          localStorage.setItem('touken_ranbu_highscore', this.finalScore.toString());
          isNewHigh = true;
        }

        // 称号判定
        let rankTitle = '門下生';
        if (this.finalScore >= 1500) rankTitle = '天下無双・闘犬王';
        else if (this.finalScore >= 800) rankTitle = '神速の犬使い';
        else if (this.finalScore >= 400) rankTitle = '凄腕闘犬士';
        else if (this.finalScore >= 150) rankTitle = '一人前闘犬士';
        else if (this.finalScore >= 50) rankTitle = '見習い闘犬士';

        // 背景
        const bgGfx = this.add.graphics();
        bgGfx.fillGradientStyle(0x220505, 0x220505, 0x0a0305, 0x0a0305, 1);
        bgGfx.fillRect(0, 0, width, height);

        // 「無念」大文字
        this.add.text(width / 2, height * 0.18, '無念…！', {
          fontSize: '68px',
          fontWeight: '900',
          color: '#ff2200',
          fontFamily: '"Zen Old Mincho", "Yuji Boku", serif',
          stroke: '#000000',
          strokeThickness: 8
        }).setOrigin(0.5);

        this.add.text(width / 2, height * 0.25, `（${this.reason}）`, {
          fontSize: '22px',
          color: '#aa7777'
        }).setOrigin(0.5);

        // リザルトボード
        const board = this.add.graphics();
        board.fillStyle(0x000000, 0.7);
        board.fillRoundedRect(width / 2 - 270, height * 0.31, 540, 310, 20);
        board.lineStyle(2, 0xcc4422, 0.8);
        board.strokeRoundedRect(width / 2 - 270, height * 0.31, 540, 310, 20);

        this.add.text(width / 2, height * 0.36, '【 乱舞戦果 】', {
          fontSize: '26px',
          color: '#ffcc44',
          fontWeight: 'bold'
        }).setOrigin(0.5);

        this.add.text(width / 2, height * 0.44, `${this.finalScore} 閃`, {
          fontSize: '64px',
          fontWeight: '900',
          color: '#ffd700',
          stroke: '#000000',
          strokeThickness: 6
        }).setOrigin(0.5);

        if (isNewHigh) {
          const newBadge = this.add.text(width / 2, height * 0.51, '★ 最高記録更新！ ★', {
            fontSize: '24px',
            fontWeight: 'bold',
            color: '#ff4400'
          }).setOrigin(0.5);

          this.tweens.add({
            targets: newBadge,
            scale: { from: 0.9, to: 1.1 },
            duration: 600,
            yoyo: true,
            repeat: -1
          });
        } else {
          const best = Math.max(this.finalScore, currentHigh);
          this.add.text(width / 2, height * 0.51, `最高記録：${best} 閃`, {
            fontSize: '22px',
            color: '#aa9977'
          }).setOrigin(0.5);
        }

        this.add.text(width / 2, height * 0.58, ` 闘犬称号：【 ${rankTitle} 】`, {
          fontSize: '28px',
          fontWeight: 'bold',
          color: '#ffffff'
        }).setOrigin(0.5);

        // X（Twitter）シェアボタン
        const shareBtn = this.add.container(width / 2, height * 0.69);
        const sBg = this.add.graphics();
        sBg.fillStyle(0x1d9bf0, 1);
        sBg.fillRoundedRect(-200, -32, 400, 64, 32);
        const sTxt = this.add.text(0, 0, '𝕏 成果を文政に放つ (ポスト)', {
          fontSize: '22px',
          fontWeight: 'bold',
          color: '#ffffff'
        }).setOrigin(0.5);
        shareBtn.add([sBg, sTxt]);
        shareBtn.setSize(400, 64).setInteractive({ useHandCursor: true });

        shareBtn.on('pointerdown', () => {
          const text = `『闘犬乱舞』で【${this.finalScore}閃】（称号: ${rankTitle}）を達成！\n指一本で両断する快感がたまらない！\n#闘犬乱舞 #Phaser3 #WebGame`;
          const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
          window.open(url, '_blank');
        });

        // 再戦（リトライ）ボタン
        const retryBtn = this.add.container(width / 2, height * 0.81);
        const rBg = this.add.graphics();
        rBg.fillStyle(0xcc2200, 1);
        rBg.fillRoundedRect(-200, -36, 400, 72, 36);
        rBg.lineStyle(3, 0xffd700, 1);
        rBg.strokeRoundedRect(-200, -36, 400, 72, 36);

        const rTxt = this.add.text(0, 0, '⚔️ 再び刀を抜く ⚔️', {
          fontSize: '28px',
          fontWeight: 'bold',
          color: '#ffffff'
        }).setOrigin(0.5);
        retryBtn.add([rBg, rTxt]);
        retryBtn.setSize(400, 72).setInteractive({ useHandCursor: true });

        retryBtn.on('pointerdown', () => {
          this.scene.start('GameScene');
        });

        // タイトルへ戻る
        const titleBtn = this.add.text(width / 2, height * 0.91, 'タイトル画面へ戻る', {
          fontSize: '22px',
          color: '#aa8877',
          underline: true
        }).setOrigin(0.5).setInteractive({ useHandCursor: true });

        titleBtn.on('pointerdown', () => {
          this.scene.start('TitleScene');
        });
      }
    }

    /* ==========================================================================
       Phaser ゲーム初期化
       ========================================================================== */
    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: 720,
      height: 1280,
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 480 },
          debug: false
        }
      },
      scene: [BootScene, TitleScene, GameScene, GameOverScene]
    };

    window.addEventListener('load', () => {
      const unlockAudio = () => {
        sound.init();
        window.removeEventListener('pointerdown', unlockAudio);
        window.removeEventListener('touchstart', unlockAudio);
      };
      window.addEventListener('pointerdown', unlockAudio);
      window.addEventListener('touchstart', unlockAudio);

      new Phaser.Game(config);
    });
  </script>
</body>
</html>
