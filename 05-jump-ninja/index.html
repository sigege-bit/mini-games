/* ==========================================================================
   Web Audio API - プロシージャル・シンセサイザー (原音完全温存)
   ========================================================================== */
class SoundManager {
  constructor() {
    this.ctx = null;
    this.chargeOsc = null;
    this.chargeGain = null;
  }

  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  toggle() {
    soundEnabled = !soundEnabled;
    localStorage.setItem('sg_sound', soundEnabled.toString());
    if (!soundEnabled && this.chargeOsc) {
      this.stopCharge();
    }
    return soundEnabled;
  }

  startCharge() {
    if (!soundEnabled || !this.ctx) return;
    this.stopCharge();

    const now = this.ctx.currentTime;
    this.chargeOsc = this.ctx.createOscillator();
    this.chargeGain = this.ctx.createGain();
    
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(680, now);

    this.chargeOsc.type = 'sawtooth';
    this.chargeOsc.frequency.setValueAtTime(140, now);

    this.chargeGain.gain.setValueAtTime(0.01, now);
    this.chargeGain.gain.linearRampToValueAtTime(0.2, now + 0.08);

    this.chargeOsc.connect(filter);
    filter.connect(this.chargeGain);
    this.chargeGain.connect(this.ctx.destination);

    this.chargeOsc.start(now);
  }

  updateCharge(ratio) {
    if (!soundEnabled || !this.ctx || !this.chargeOsc) return;
    const now = this.ctx.currentTime;
    const targetFreq = 140 + ratio * 600;
    this.chargeOsc.frequency.setValueAtTime(targetFreq, now);
  }

  stopCharge() {
    if (this.chargeOsc) {
      try {
        const now = this.ctx.currentTime;
        this.chargeGain.gain.linearRampToValueAtTime(0.001, now + 0.05);
        this.chargeOsc.stop(now + 0.05);
      } catch (e) {}
      this.chargeOsc = null;
      this.chargeGain = null;
    }
  }

  playJump(powerRatio) {
    if (!soundEnabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    const startFreq = 300 + powerRatio * 180;
    osc.frequency.setValueAtTime(startFreq, now);
    osc.frequency.exponentialRampToValueAtTime(720 + powerRatio * 350, now + 0.14);
    osc.frequency.exponentialRampToValueAtTime(340, now + 0.32);

    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);

    osc.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    osc.stop(now + 0.32);
  }

  playLand() {
    if (!soundEnabled || !this.ctx) return;
    const now = this.ctx.currentTime;

    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(180, now);
    osc.frequency.exponentialRampToValueAtTime(45, now + 0.14);

    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.14);

    this.playNoise(0.08, 0.15, 420);
  }

  playAssist() {
    if (!soundEnabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.exponentialRampToValueAtTime(880, now + 0.18);

    gain.gain.setValueAtTime(0.2, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + 0.18);
    this.playNoise(0.06, 0.1, 800);
  }

  playPerfect(combo) {
    if (!soundEnabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    
    const strikeOsc = this.ctx.createOscillator();
    const strikeGain = this.ctx.createGain();
    strikeOsc.type = 'triangle';
    strikeOsc.frequency.setValueAtTime(1800, now);
    strikeOsc.frequency.exponentialRampToValueAtTime(2600, now + 0.08);
    strikeGain.gain.setValueAtTime(0.3, now);
    strikeGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    strikeOsc.connect(strikeGain);
    strikeGain.connect(this.ctx.destination);
    strikeOsc.start(now);
    strikeOsc.stop(now + 0.12);

    const notes = [659.25, 783.99, 1046.50, 1318.51, 1567.98, 2093.00];
    const baseIndex = Math.min(combo - 1, 3);

    [0, 1, 2, 4].forEach((offset, i) => {
      const freq = notes[Math.min(baseIndex + offset, notes.length - 1)];
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now + i * 0.035);

      gain.gain.setValueAtTime(0.24, now + i * 0.035);
      gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.035 + 0.5);

      osc.connect(gain);
      gain.connect(this.ctx.destination);

      osc.start(now + i * 0.035);
      osc.stop(now + i * 0.035 + 0.5);
    });
  }

  playFall() {
    if (!soundEnabled || !this.ctx) return;
    const now = this.ctx.currentTime;

    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(480, now);
    osc.frequency.exponentialRampToValueAtTime(70, now + 0.55);

    gain.gain.setValueAtTime(0.28, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

    osc.connect(gain);
    gain.connect(this.ctx.destination);

    osc.start(now);
    osc.stop(now + 0.55);

    setTimeout(() => {
      this.playNoise(0.38, 0.45, 300);
    }, 450);
  }

  playNoise(duration, volume, cutoff) {
    if (!soundEnabled || !this.ctx) return;
    const bufferSize = this.ctx.sampleRate * duration;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(cutoff, this.ctx.currentTime);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(volume, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);

    noise.start();
  }
}

/* ==========================================================================
   共通UIヘルパー関数群
   ========================================================================== */
function createPillButton(scene, x, y, width, height, text, onClick) {
  const btnContainer = scene.add.container(x, y);

  const bg = scene.add.graphics();
  bg.fillStyle(0x121834, 0.85);
  bg.fillRoundedRect(-width / 2, -height / 2, width, height, height / 2);
  bg.lineStyle(2, 0xffffff, 0.35);
  bg.strokeRoundedRect(-width / 2, -height / 2, width, height, height / 2);
  btnContainer.add(bg);

  const label = scene.add.text(0, 0, text, {
    fontFamily: "'M PLUS Rounded 1c', sans-serif",
    fontSize: '22px',
    fontWeight: '900',
    color: '#ffffff'
  }).setOrigin(0.5);
  btnContainer.add(label);

  const hitArea = scene.add.rectangle(0, 0, width, height, 0x000000, 0)
    .setInteractive({ useHandCursor: true });
  btnContainer.add(hitArea);

  hitArea.on('pointerdown', () => {
    audio.init();
    btnContainer.setScale(0.95);
  });
  hitArea.on('pointerup', () => {
    btnContainer.setScale(1.0);
    onClick();
  });
  hitArea.on('pointerout', () => btnContainer.setScale(1.0));

  btnContainer.updateText = (newText) => {
    label.setText(newText);
  };

  return btnContainer;
}

function createActionButton(scene, x, y, width, height, text, bgColors, onClick) {
  const btnContainer = scene.add.container(x, y);

  const bg = scene.add.graphics();
  bg.fillGradientStyle(bgColors[0], bgColors[0], bgColors[1], bgColors[1], 1);
  bg.fillRoundedRect(-width / 2, -height / 2, width, height, 22);
  bg.lineStyle(2, 0xffffff, 0.4);
  bg.strokeRoundedRect(-width / 2, -height / 2, width, height, 22);
  btnContainer.add(bg);

  const label = scene.add.text(0, 0, text, {
    fontFamily: "'M PLUS Rounded 1c', sans-serif",
    fontSize: '28px',
    fontWeight: '900',
    color: '#ffffff'
  }).setOrigin(0.5);
  btnContainer.add(label);

  const hitArea = scene.add.rectangle(0, 0, width, height, 0x000000, 0)
    .setInteractive({ useHandCursor: true });
  btnContainer.add(hitArea);

  hitArea.on('pointerdown', () => {
    audio.init();
    btnContainer.setScale(0.95);
  });
  hitArea.on('pointerup', () => {
    btnContainer.setScale(1.0);
    onClick();
  });
  hitArea.on('pointerout', () => btnContainer.setScale(1.0));

  return btnContainer;
}

      fontSize: '44px',

    // あそびかたカード（3行ルール）

    cardBg.fillRoundedRect(CONFIG.width / 2 - 290, 485, 580, 240, 24);
    cardBg.lineStyle(2, 0xff2a8d, 0.4);
    cardBg.strokeRoundedRect(CONFIG.width / 2 - 290, 485, 580, 240, 24);

    const rules = [t.rule1, t.rule2, t.rule3];

      this.add.text(CONFIG.width / 2 - 260, 520 + idx * 68, rule, {
        fontFamily: "'M PLUS Rounded 1c', sans-serif",
        fontSize: '20px',
        fontWeight: '900',
        color: '#ffffff'

    });

    // BEST スコアバッジ
    const bestContainer = this.add.container(CONFIG.width / 2, 790);
    const bestBg = this.add.graphics();
    bestBg.fillStyle(0x121834, 0.9);
    bestBg.fillRoundedRect(-140, -25, 280, 50, 25);
    bestBg.lineStyle(2, 0xffd700, 0.7);
    bestBg.strokeRoundedRect(-140, -25, 280, 50, 25);
    bestContainer.add(bestBg);

    const bestText = this.add.text(0, 0, `${t.best}${bestScore}`, {
      fontFamily: "'Orbitron', sans-serif",
      fontSize: '22px',
      fontWeight: '900',

    // ふわふわ浮遊スタートボタン

          '🌸',
          { fontSize: `${Phaser.Math.Between(18, 30)}px` }

        p.setAlpha(Phaser.Math.FloatBetween(0.4, 0.8));

        this.tweens.add({
          targets: p,
          x: p.x + Phaser.Math.Between(80, 250),
          y: CONFIG.height + 40,
          angle: Phaser.Math.Between(180, 540),
          alpha: 0,
          duration: Phaser.Math.Between(4000, 6500),
          ease: 'Sine.easeInOut',
          onComplete: () => p.destroy()
        });
      },
      loop: true
    });
  }
}

/* ==========================================================================
   MainScene: 元コードの完全ゲーム挙動・物理Tween・カメラ・パーティクル
   ========================================================================== */
class MainScene extends Phaser.Scene {
  constructor() {
    super('MainScene');
  }

  preload() {
    this.createNinjaTexture();
    this.createSmokeParticle();
    this.createSparkParticle();
    this.createSakuraParticle();
    this.createTargetMark();
  }

  create() {
    this.score = 0;
    this.combo = 0;
    this.maxCombo = 0;
    this.bestScore = parseInt(localStorage.getItem('jump_pyon_best') || '0', 10);
    this.state = 'IDLE';
    this.chargeStartTime = 0;
    this.chargeRatio = 0;

    this.platforms = [];
    this.currentPlatformIndex = 0;

    this.bgLayer = this.add.container(0, 0);
    this.worldLayer = this.add.container(0, 0);
    this.fxLayer = this.add.container(0, 0);

    this.createBackground();
    this.setupInitialPlatforms();
    this.createPlayer();
    this.setupInput();

    // HUDの生成（Phaserオブジェクト化）
    this.createHUD();

    // 桜の花びらアンビエント放出
    this.time.addEvent({
      delay: 200,
      callback: this.spawnAmbientSakura,
      callbackScope: this,
      loop: true
    });

    // カメラ設定: 忍者を画面中央よりやや下寄りに配置
    this.cameras.main.startFollow(this.playerShadow, false, 0.08, 0.08, 0, 140);
  }

  /* ------------------------------------------------------------------------
     動的テクスチャ生成
     ------------------------------------------------------------------------ */
  createNinjaTexture() {
    if (this.textures.exists('ninja_sprite')) return;
    const canvas = document.createElement('canvas');
    canvas.width = 110;
    canvas.height = 130;
    const ctx = canvas.getContext('2d');

    ctx.font = '84px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255, 42, 141, 0.9)';
    ctx.shadowBlur = 18;
    ctx.fillText('🥷', 55, 65);

    this.textures.addCanvas('ninja_sprite', canvas);
  }

  createSmokeParticle() {
    if (this.textures.exists('smoke_particle')) return;
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 2, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
    grad.addColorStop(0.5, 'rgba(255, 200, 230, 0.5)');
    grad.addColorStop(1, 'rgba(255, 200, 230, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(16, 16, 16, 0, Math.PI * 2);
    ctx.fill();

    this.textures.addCanvas('smoke_particle', canvas);
  }

  createSparkParticle() {
    if (this.textures.exists('spark_particle')) return;
    const canvas = document.createElement('canvas');
    canvas.width = 24;
    canvas.height = 24;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.arc(12, 12, 10, 0, Math.PI * 2);
    ctx.fill();

    this.textures.addCanvas('spark_particle', canvas);
  }

  createSakuraParticle() {
    if (this.textures.exists('sakura_particle')) return;
    const canvas = document.createElement('canvas');
    canvas.width = 32;
    canvas.height = 32;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#ff75a0';
    ctx.beginPath();
    ctx.moveTo(16, 4);
    ctx.bezierCurveTo(8, 4, 4, 12, 6, 20);
    ctx.bezierCurveTo(8, 28, 16, 30, 16, 30);
    ctx.bezierCurveTo(16, 30, 24, 28, 26, 20);
    ctx.bezierCurveTo(28, 12, 24, 4, 16, 4);
    ctx.fill();

    ctx.fillStyle = '#ff2a8d';
    ctx.beginPath();
    ctx.arc(16, 6, 2.5, 0, Math.PI * 2);
    ctx.fill();

    this.textures.addCanvas('sakura_particle', canvas);
  }

  createTargetMark() {
    if (this.textures.exists('target_mark')) return;
    const canvas = document.createElement('canvas');
    canvas.width = 72;
    canvas.height = 36;
    const ctx = canvas.getContext('2d');
    
    ctx.save();
    ctx.scale(1, 0.5);
    ctx.fillStyle = 'rgba(255, 20, 147, 0.95)';
    ctx.beginPath();
    ctx.arc(36, 36, 28, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(36, 36, 17, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 20, 147, 1)';
    ctx.beginPath();
    ctx.arc(36, 36, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    this.textures.addCanvas('target_mark', canvas);
  }

  createBackground() {
    const bgGraphics = this.add.graphics().setScrollFactor(0);
    bgGraphics.fillGradientStyle(0x050614, 0x0a0c24, 0x16133a, 0x221338, 1);
    bgGraphics.fillRect(0, 0, CONFIG.width, CONFIG.height);
    this.bgLayer.add(bgGraphics);

    // 満月
    const moon = this.add.graphics().setScrollFactor(0.02);
    moon.fillStyle(0xffe0ec, 0.15);
    moon.fillCircle(CONFIG.width * 0.78, 260, 100);
    moon.fillStyle(0xffe6f0, 0.4);
    moon.fillCircle(CONFIG.width * 0.78, 260, 72);
    moon.fillStyle(0xffffff, 0.95);
    moon.fillCircle(CONFIG.width * 0.78, 260, 52);
    this.bgLayer.add(moon);

    // 星々
    for (let i = 0; i < 48; i++) {
      const x = Phaser.Math.Between(20, CONFIG.width - 20);
      const y = Phaser.Math.Between(30, CONFIG.height * 0.65);
      const star = this.add.circle(x, y, Phaser.Math.FloatBetween(1, 2.5), 0xffffff, Phaser.Math.FloatBetween(0.3, 0.9));
      star.setScrollFactor(0.04);
      this.bgLayer.add(star);

      this.tweens.add({

        duration: Phaser.Math.Between(1000, 2500),
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'

    // 遠景ビル群

      const bh = Phaser.Math.Between(160, 440);
      city.fillRect(bx, CONFIG.height - bh, 65, bh);
      for (let wy = CONFIG.height - bh + 20; wy < CONFIG.height - 30; wy += 35) {
        if (Math.random() > 0.4) {
          city.fillStyle(0xff75a0, 0.35);
          city.fillRect(bx + 12, wy, 10, 16);

  /* ------------------------------------------------------------------------
     足場（2.5Dアイソメトリックブロック）生成
     ------------------------------------------------------------------------ */
  createPlatform(x, y, width, depth, height, colorTheme, isCylinder = false) {
    const container = this.add.container(x, y);
    container.pWidth = width;
    container.pDepth = depth;
    container.pHeight = height;
    container.isCylinder = isCylinder;
    container.colorTheme = colorTheme;
    container.origY = y;

    const g = this.add.graphics();
    const halfW = width / 2;
    const halfD = depth / 2;

    if (isCylinder) {
      g.fillStyle(colorTheme.side1, 1);
      g.fillRect(-halfW, 0, width, height);

      g.fillStyle(0xffffff, 0.18);
      g.fillRect(-halfW + 10, 14, width - 20, 6);
      g.fillRect(-halfW + 10, 32, width - 20, 6);

      g.fillStyle(colorTheme.side2, 1);
      g.fillEllipse(0, height, width, depth);

      g.fillStyle(colorTheme.top, 1);
      g.fillEllipse(0, 0, width, depth);
      g.lineStyle(3, 0xffffff, 0.85);
      g.strokeEllipse(0, 0, width, depth);
    } else {
      g.fillStyle(colorTheme.side2, 1);
      g.beginPath();
      g.moveTo(-halfW, 0);
      g.lineTo(0, halfD);
      g.lineTo(0, halfD + height);
      g.lineTo(-halfW, height);
      g.closePath();
      g.fill();

      g.fillStyle(colorTheme.side1, 1);
      g.beginPath();
      g.moveTo(0, halfD);
      g.lineTo(halfW, 0);
      g.lineTo(halfW, height);
      g.lineTo(0, halfD + height);
      g.closePath();
      g.fill();

      g.fillStyle(0xffffff, 0.22);
      g.fillRoundedRect(-halfW + 14, 16, halfW - 22, 12, 2);
      g.fillRoundedRect(10, 16, halfW - 22, 12, 2);
      g.fillRoundedRect(-halfW + 14, 38, halfW - 22, 12, 2);
      g.fillRoundedRect(10, 38, halfW - 22, 12, 2);

      g.fillStyle(colorTheme.top, 1);
      g.beginPath();
      g.moveTo(0, -halfD);
      g.lineTo(halfW, 0);
      g.lineTo(0, halfD);
      g.lineTo(-halfW, 0);
      g.closePath();
      g.fill();
      g.lineStyle(3.5, 0xffffff, 0.9);
      g.strokePath();
    }

    container.add(g);

    const target = this.add.image(0, 0, 'target_mark');
    const scale = (width / 180) * 0.85;
    target.setScale(scale);
    container.add(target);
    container.targetMark = target;

    this.tweens.add({
      targets: target,
      scaleX: scale * 1.18,
      scaleY: scale * 1.18,
      duration: 750,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut'
    });

    this.worldLayer.add(container);
    return container;
  }

  setupInitialPlatforms() {
    const p1 = this.createPlatform(CONFIG.width * 0.36, CONFIG.height * 0.65, 205, 110, 120, CONFIG.colors[0], false);
    this.platforms.push(p1);
    this.spawnNextPlatform(p1, 1);
  }

  spawnNextPlatform(prevPlatform, forcedDirection = 0) {
    let dir = forcedDirection;
    if (dir === 0) {
      if (prevPlatform.x < CONFIG.width * 0.32) {
        dir = 1;
      } else if (prevPlatform.x > CONFIG.width * 0.68) {
        dir = -1;
      } else {
        dir = Math.random() > 0.5 ? 1 : -1;
      }
    }

    const distance = Phaser.Math.Between(220, 400);
    const angleRad = dir === 1 ? -Phaser.Math.DegToRad(30) : -Phaser.Math.DegToRad(150);

    const nx = prevPlatform.x + Math.cos(angleRad) * distance;
    const ny = prevPlatform.y + Math.sin(angleRad) * distance;

    const difficultyMod = Math.min(this.score * 1.0, 35);
    const width = Phaser.Math.Between(170 - difficultyMod, 215 - difficultyMod);
    const depth = width * 0.55;
    const height = Phaser.Math.Between(100, 140);
    const isCylinder = Math.random() > 0.45;
    const color = Phaser.Utils.Array.GetRandom(CONFIG.colors);

    const nextPlatform = this.createPlatform(nx, ny, width, depth, height, color, isCylinder);
    nextPlatform.directionFromPrev = dir;
    nextPlatform.targetDistance = distance;

    nextPlatform.y -= 150;
    nextPlatform.alpha = 0;
    this.tweens.add({
      targets: nextPlatform,
      y: ny,
      alpha: 1,
      duration: 350,
      ease: 'Back.easeOut'
    });

    this.platforms.push(nextPlatform);
  }

  /* ------------------------------------------------------------------------
     プレイヤー（忍者）生成
     ------------------------------------------------------------------------ */
  createPlayer() {
    const curP = this.platforms[0];

    this.playerShadow = this.add.ellipse(curP.x, curP.y, 52, 26, 0x000000, 0.45);
    this.worldLayer.add(this.playerShadow);

    this.ninja = this.add.image(curP.x, curP.y - 38, 'ninja_sprite');
    this.ninja.setOrigin(0.5, 0.85);
    this.ninja.setScale(0.85);
    this.worldLayer.add(this.ninja);

    this.playerBaseX = curP.x;
    this.playerBaseY = curP.y;
    this.playerAltitude = 0;

    this.chargeGfx = this.add.graphics();
    this.fxLayer.add(this.chargeGfx);

    this.time.addEvent({
      delay: 70,
      callback: this.emitComboAura,
      callbackScope: this,
      loop: true
    });
  }

  emitComboAura() {
    if (this.combo < 2 || this.state === 'FALLING' || this.state === 'GAMEOVER') return;
    
    const auraColors = [0xff2a8d, 0xffd700, 0x00f0ff, 0xff75a0];
    const color = Phaser.Utils.Array.GetRandom(auraColors);
    const p = this.add.circle(
      this.ninja.x + Phaser.Math.Between(-25, 25),
      this.ninja.y - Phaser.Math.Between(10, 50),
      Phaser.Math.Between(3, 7),
      color,
      0.9
    );
    this.fxLayer.add(p);

    this.tweens.add({
      targets: p,
      y: p.y - Phaser.Math.Between(30, 60),
      alpha: 0,
      scale: 0.2,
      duration: Phaser.Math.Between(250, 450),
      ease: 'Quad.easeOut',
      onComplete: () => p.destroy()
    });
  }

  /* ------------------------------------------------------------------------
     入力処理
     ------------------------------------------------------------------------ */
  setupInput() {
    this.input.on('pointerdown', () => {
      if (this.state === 'IDLE') {
        this.startCharging();
      }
    });

    this.input.on('pointerup', () => {
      if (this.state === 'CHARGING') {
        this.executeJump();
      }
    });

    this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    this.spaceKey.on('down', () => {
      if (this.state === 'IDLE') this.startCharging();
    });
    this.spaceKey.on('up', () => {
      if (this.state === 'CHARGING') this.executeJump();
    });
  }

  startCharging() {
    audio.init();
    this.state = 'CHARGING';
    this.chargeStartTime = this.time.now;
    this.chargeRatio = 0;
    audio.startCharge();
  }

  update(time, delta) {
    if (this.state === 'CHARGING') {
      const elapsed = time - this.chargeStartTime;
      this.chargeRatio = Math.min(elapsed / CONFIG.maxChargeTime, 1.0);
      audio.updateCharge(this.chargeRatio);

      const squishY = 0.85 - this.chargeRatio * 0.35;
      const stretchX = 0.85 + this.chargeRatio * 0.25;
      this.ninja.setScale(stretchX, squishY);

      const shakeOffset = (Math.random() - 0.5) * (this.chargeRatio * 4.5);
      this.ninja.x = this.playerBaseX + shakeOffset;

      this.drawPowerGauge();
    } else {
      this.chargeGfx.clear();
    }
  }

  drawPowerGauge() {
    this.chargeGfx.clear();
    const nx = this.ninja.x;
    const ny = this.ninja.y - 82;

    this.chargeGfx.lineStyle(7, 0x141838, 0.85);
    this.chargeGfx.beginPath();
    this.chargeGfx.arc(nx, ny, 28, -Math.PI * 0.5, Math.PI * 1.5, false);
    this.chargeGfx.strokePath();

    let gaugeColor = 0x00f0ff;
    if (this.chargeRatio > 0.75) gaugeColor = 0xff2a8d;
    else if (this.chargeRatio > 0.45) gaugeColor = 0xffd700;

    this.chargeGfx.lineStyle(7, gaugeColor, 1);
    this.chargeGfx.beginPath();
    this.chargeGfx.arc(nx, ny, 28, -Math.PI * 0.5, -Math.PI * 0.5 + Math.PI * 2 * this.chargeRatio, false);
    this.chargeGfx.strokePath();

    const endAngle = -Math.PI * 0.5 + Math.PI * 2 * this.chargeRatio;
    const sparkX = nx + Math.cos(endAngle) * 28;
    const sparkY = ny + Math.sin(endAngle) * 28;
    this.chargeGfx.fillStyle(0xffffff, 1);
    this.chargeGfx.fillCircle(sparkX, sparkY, 4);
  }

  /* ------------------------------------------------------------------------
     ジャンプ実行 & 放物線物理Tween
     ------------------------------------------------------------------------ */
  executeJump() {
    this.state = 'JUMPING';
    audio.stopCharge();
    audio.playJump(this.chargeRatio);
    this.chargeGfx.clear();

    const curPlatform = this.platforms[this.currentPlatformIndex];
    const nextPlatform = this.platforms[this.currentPlatformIndex + 1];
    const dir = nextPlatform.directionFromPrev;

    const jumpDistance = CONFIG.minJumpDist + (CONFIG.maxJumpDist - CONFIG.minJumpDist) * this.chargeRatio;
    const angleRad = dir === 1 ? -Phaser.Math.DegToRad(30) : -Phaser.Math.DegToRad(150);

    const startX = this.playerBaseX;
    const startY = this.playerBaseY;
    const destX = startX + Math.cos(angleRad) * jumpDistance;
    const destY = startY + Math.sin(angleRad) * jumpDistance;

    const jumpDuration = 480 + (jumpDistance / CONFIG.maxJumpDist) * 220;
    const maxPeakHeight = 90 + jumpDistance * 0.42;

    this.emitSmoke(startX, startY);
    if (this.combo >= 2) this.emitSakuraBurst(startX, startY, 8);

    const rotateAngle = dir === 1 ? 360 : -360;

    this.tweens.add({
      targets: { progress: 0 },
      progress: 1,
      duration: jumpDuration,
      ease: 'Linear',
      onUpdate: (tween, target) => {
        const p = target.progress;
        
        this.playerBaseX = startX + (destX - startX) * p;
        this.playerBaseY = startY + (destY - startY) * p;

        this.playerAltitude = Math.sin(Math.PI * p) * maxPeakHeight;

        this.ninja.x = this.playerBaseX;
        this.ninja.y = this.playerBaseY - 38 - this.playerAltitude;

        this.playerShadow.x = this.playerBaseX;
        this.playerShadow.y = this.playerBaseY;
        const shadowScale = 1 - (this.playerAltitude / maxPeakHeight) * 0.45;
        this.playerShadow.setScale(shadowScale);
        this.playerShadow.setAlpha(0.45 * shadowScale);

        this.ninja.angle = p * rotateAngle;
      },
      onComplete: () => {
        this.ninja.angle = 0;
        this.checkLanding(destX, destY, nextPlatform, curPlatform);
      }
    });

    this.tweens.add({
      targets: this.ninja,
      scaleX: 0.85,
      scaleY: 0.85,
      duration: 150,
      ease: 'Back.easeOut'
    });
  }

  /* ------------------------------------------------------------------------
     着地判定（Safe / Assist / Perfect / Miss）
     ------------------------------------------------------------------------ */
  checkLanding(landX, landY, targetPlatform, prevPlatform) {
    const dx = landX - targetPlatform.x;
    const dy = landY - targetPlatform.y;
    const halfW = targetPlatform.pWidth / 2;
    const halfD = targetPlatform.pDepth / 2;

    const normalizedDistSq = Math.pow(dx / halfW, 2) + Math.pow(dy / halfD, 2);

    const prevDx = landX - prevPlatform.x;
    const prevDy = landY - prevPlatform.y;
    const prevHalfW = prevPlatform.pWidth / 2;
    const prevHalfD = prevPlatform.pDepth / 2;
    const prevNormalizedDistSq = Math.pow(prevDx / prevHalfW, 2) + Math.pow(prevDy / prevHalfD, 2);

    if (normalizedDistSq <= 1.0) {
      const isPerfect = normalizedDistSq <= Math.pow(CONFIG.perfectThresholdRatio, 2);
      this.handleSuccessfulLanding(targetPlatform, isPerfect, false, landX, landY);
    } else if (normalizedDistSq <= CONFIG.assistThresholdRatio) {
      this.handleSuccessfulLanding(targetPlatform, false, true, landX, landY);
    } else if (prevNormalizedDistSq <= 1.0) {
      this.handleStayOnPlatform(prevPlatform, landX, landY);
    } else {
      this.handleFall(landX, landY);
    }
  }

  handleSuccessfulLanding(platform, isPerfect, isAssist, landX, landY) {
    this.state = 'LANDING';
    this.currentPlatformIndex++;

    this.bouncePlatform(platform);

    this.tweens.add({
      targets: this.ninja,
      scaleX: 1.2,
      scaleY: 0.5,
      duration: 90,
      yoyo: true,
      ease: 'Quad.easeInOut'
    });

    const t = I18N[currentLang];

    if (isPerfect) {
      this.combo++;
      if (this.combo > this.maxCombo) this.maxCombo = this.combo;
      const addScore = Math.pow(2, Math.min(this.combo, 6));
      this.score += addScore;

      audio.playPerfect(this.combo);
      
      this.cameras.main.flash(200, 255, 180, 220, false);
      this.tweens.add({
        targets: this.cameras.main,
        zoom: 1.045,
        duration: 120,
        yoyo: true,
        ease: 'Quad.easeInOut'
      });

      this.emitFireworks(landX, landY);
      this.emitSakuraBurst(landX, landY, 35);
      this.showToast(t.perfect, `+${addScore} (x${Math.pow(2, Math.min(this.combo, 6))})`, true);
      this.cameras.main.shake(140, 0.009);
    } else if (isAssist) {
      this.combo = 0;
      this.score += 1;
      audio.playAssist();
      this.emitSmoke(landX, landY);
      this.emitSakuraBurst(landX, landY, 12);
      this.showToast(t.assist, '+1', false);

      this.tweens.add({
        targets: this.ninja,
        x: platform.x + (landX - platform.x) * 0.7,
        y: platform.y + (landY - platform.y) * 0.7 - 38,
        duration: 120,
        ease: 'Cubic.easeOut'
      });
    } else {
      this.combo = 0;
      this.score += 1;
      audio.playLand();
      this.emitSmoke(landX, landY);
      this.emitSakuraBurst(landX, landY, 8);
    }

    this.updateUI();
    this.spawnNextPlatform(platform);

    this.time.delayedCall(160, () => {
      this.panCameraToPlatform(platform);
    });
  }

  bouncePlatform(platform) {
    const initialY = platform.origY || platform.y;
    this.tweens.add({
      targets: platform,
      y: initialY + 12,
      duration: 70,
      yoyo: true,
      ease: 'Back.easeOut',
      onComplete: () => {
        platform.y = initialY;
      }
    });
  }

  handleStayOnPlatform(platform, landX, landY) {
    this.state = 'LANDING';
    audio.playLand();
    this.bouncePlatform(platform);
    this.emitSmoke(landX, landY);

    this.tweens.add({
      targets: this.ninja,
      scaleX: 1.15,
      scaleY: 0.6,
      duration: 80,
      yoyo: true,
      ease: 'Quad.easeInOut'
    });

    this.time.delayedCall(200, () => {
      this.state = 'IDLE';
    });
  }

  handleFall(landX, landY) {
    this.state = 'FALLING';
    audio.playFall();
    this.cameras.main.shake(240, 0.02);

    this.emitSakuraBurst(this.ninja.x, this.ninja.y, 25);

    this.tweens.add({
      targets: this.ninja,
      y: this.ninja.y + 650,
      angle: 720,
      alpha: 0,
      duration: 650,
      ease: 'Cubic.easeIn'
    });

    this.tweens.add({
      targets: this.playerShadow,
      alpha: 0,
      scaleX: 0.1,
      scaleY: 0.1,
      duration: 350
    });

    this.time.delayedCall(750, () => {
      this.scene.start('SceneResult', {
        score: this.score,
        maxCombo: this.maxCombo
      });
    });
  }

  panCameraToPlatform(platform) {
    this.playerBaseX = platform.x;
    this.playerBaseY = platform.y;
    this.ninja.x = platform.x;
    this.ninja.y = platform.y - 38;
    this.playerShadow.x = platform.x;
    this.playerShadow.y = platform.y;

    this.state = 'IDLE';

    if (this.platforms.length > 5) {
      const oldP = this.platforms.shift();
      this.currentPlatformIndex--;
      oldP.destroy();
    }
  }

  /* ------------------------------------------------------------------------
     パーティクル・Juice
     ------------------------------------------------------------------------ */
  emitSmoke(x, y) {
    for (let i = 0; i < 9; i++) {
      const p = this.add.image(x, y, 'smoke_particle');
      p.setScale(Phaser.Math.FloatBetween(0.5, 1.3));
      p.setAlpha(0.85);
      this.fxLayer.add(p);

      const vx = Phaser.Math.Between(-65, 65);
      const vy = Phaser.Math.Between(-35, 20);

      this.tweens.add({
        targets: p,
        x: x + vx,
        y: y + vy,
        alpha: 0,
        scale: 0.1,
        duration: Phaser.Math.Between(300, 500),
        ease: 'Cubic.easeOut',
        onComplete: () => p.destroy()
      });
    }
  }

  emitFireworks(x, y) {
    const colors = [0xffd700, 0xff2a8d, 0x00f0ff, 0xffa502, 0xff70a6];
    for (let i = 0; i < 32; i++) {
      const p = this.add.image(x, y - 20, 'spark_particle');
      p.setTint(Phaser.Utils.Array.GetRandom(colors));
      p.setScale(Phaser.Math.FloatBetween(0.7, 1.5));
      this.fxLayer.add(p);

      const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const speed = Phaser.Math.Between(90, 240);

      this.tweens.add({
        targets: p,
        x: x + Math.cos(angle) * speed,
        y: y - 20 + Math.sin(angle) * speed,
        alpha: 0,
        scale: 0,
        duration: Phaser.Math.Between(450, 800),
        ease: 'Cubic.easeOut',
        onComplete: () => p.destroy()
      });
    }
  }

  emitSakuraBurst(x, y, count = 20) {
    for (let i = 0; i < count; i++) {
      const p = this.add.image(x, y - 15, 'sakura_particle');
      p.setScale(Phaser.Math.FloatBetween(0.6, 1.2));
      p.setAlpha(1);
      p.angle = Phaser.Math.Between(0, 360);
      this.fxLayer.add(p);

      const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
      const speed = Phaser.Math.Between(70, 200);

      this.tweens.add({
        targets: p,
        x: x + Math.cos(angle) * speed,
        y: y - 15 + Math.sin(angle) * speed,
        angle: p.angle + Phaser.Math.Between(180, 540),
        alpha: 0,
        scale: 0.2,
        duration: Phaser.Math.Between(550, 950),
        ease: 'Cubic.easeOut',
        onComplete: () => p.destroy()
      });
    }
  }

  showToast(mainText, subText, isPerfect = true) {
    this.toastMain.setText(mainText);
    this.toastMain.setColor(isPerfect ? '#ffd700' : '#00f0ff');
    this.toastMain.setAlpha(1).setScale(1.2);

    this.toastSub.setText(subText);
    this.toastSub.setAlpha(1).setScale(1.2);

    this.tweens.add({
      targets: [this.toastMain, this.toastSub],
      scaleX: 1,
      scaleY: 1,
      alpha: 0,
      duration: 650,
      ease: 'Cubic.easeOut'
    });
  }

  updateUI() {
    this.scoreText.setText(this.score.toString());
    this.tweens.add({
      targets: this.scoreText,
      scaleX: 1.3,
      scaleY: 1.3,
      duration: 80,
      yoyo: true,
      ease: 'Quad.easeInOut'
    });

    if (this.combo >= 2) {
      this.comboText.setText(`COMBO x${this.combo} (${Math.pow(2, Math.min(this.combo, 6))}倍)`);
      this.comboText.setAlpha(1);
    } else {
      this.comboText.setAlpha(0);
    }

    this.bestScoreText.setText(`👑 BEST: ${Math.max(this.score, this.bestScore)}`);
  }
}

/* ==========================================================================
   SceneResult: 共通仕様準拠リザルト画面
   ========================================================================== */
class SceneResult extends Phaser.Scene {
  constructor() {
    super('SceneResult');
  }

  init(data) {
    this.finalScore = data.score || 0;
    this.finalCombo = data.maxCombo || 0;
  }

  create() {
    const t = I18N[currentLang];
    let bestScore = parseInt(localStorage.getItem('jump_pyon_best') || '0', 10);
    const isNewRecord = this.finalScore > bestScore;

    if (isNewRecord) {
      bestScore = this.finalScore;
      localStorage.setItem('jump_pyon_best', bestScore.toString());
    }

    let rank = t.rankC;
    if (this.finalScore >= 100) rank = t.rankS;
    else if (this.finalScore >= 50) rank = t.rankA;
    else if (this.finalScore >= 20) rank = t.rankB;

    const cx = CONFIG.width / 2;
    const cy = CONFIG.height / 2;

    // 半透明背景オーバーレイ
    this.add.rectangle(cx, cy, CONFIG.width, CONFIG.height, 0x040610, 0.94).setScrollFactor(0);

    // 中央パネル
    this.add.rectangle(cx, cy, 620, 780, 0x12142e, 0.96)
      .setStrokeStyle(3, 0xff2a8d, 0.65)
      .setScrollFactor(0);

    // 1. 終了タイトル
    this.add.text(cx, cy - 290, t.resultTitle, {
      fontFamily: "'M PLUS Rounded 1c', sans-serif",
      fontSize: '48px',
      fontWeight: '900',
      color: '#ff4757',
      stroke: '#000',
      strokeThickness: 6
    }).setOrigin(0.5).setScrollFactor(0);

    // 2. 今回スコア
    this.add.text(cx, cy - 185, `SCORE: ${this.finalScore}`, {
      fontFamily: "'Orbitron', 'M PLUS Rounded 1c', sans-serif",
      fontSize: '48px',
      fontWeight: '900',
      color: '#ffd700'
    }).setOrigin(0.5).setScrollFactor(0);

    // 3. ランク／称号
    this.add.text(cx, cy - 100, `ランク: 【 ${rank} 】`, {
      fontFamily: "'M PLUS Rounded 1c', sans-serif",
      fontSize: '28px',
      fontWeight: '800',
      color: '#ff758c',
      align: 'center',
      wordWrap: { width: 560 }
    }).setOrigin(0.5).setScrollFactor(0);

    // 4. ベストスコア
    this.add.text(cx, cy - 25, `🏆 BEST SCORE: ${bestScore}${isNewRecord ? ' 🔥 NEW!' : ''}`, {
      fontFamily: "'M PLUS Rounded 1c', sans-serif",
      fontSize: '26px',
      fontWeight: '800',
      color: '#38bdf8'
    }).setOrigin(0.5).setScrollFactor(0);

    // 上段ボタン: もう一回 / RETRY (横幅いっぱい)
    const fullW = 540;
    const retryBtn = this.add.rectangle(cx, cy + 85, fullW, 74, 0xff2a8d)
      .setStrokeStyle(2, 0xff758c)
      .setInteractive({ useHandCursor: true })
      .setScrollFactor(0);
    this.add.text(cx, cy + 85, t.retry, {
      fontFamily: "'M PLUS Rounded 1c', sans-serif",
      fontSize: '26px',
      fontWeight: '900',
      color: '#ffffff'
    }).setOrigin(0.5).setScrollFactor(0);
    retryBtn.on('pointerdown', () => {
      audio.init();
      this.scene.start('MainScene');
    });

    // 中段ボタン: 𝕏 でポスト / 𝕏 POST TO X (横幅いっぱい)
    const shareBtn = this.add.rectangle(cx, cy + 180, fullW, 74, 0x0284c7)
      .setStrokeStyle(2, 0x38bdf8)
      .setInteractive({ useHandCursor: true })
      .setScrollFactor(0);
    this.add.text(cx, cy + 180, t.share, {
      fontFamily: "'M PLUS Rounded 1c', sans-serif",
      fontSize: '26px',
      fontWeight: '900',
      color: '#ffffff'
    }).setOrigin(0.5).setScrollFactor(0);
    shareBtn.on('pointerdown', () => {
      const text = t.shareText(this.finalScore, rank);
      const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`;
      window.open(url, '_blank');
    });

    // 下段ボタン (左右2分割で横並び配置)
    const halfW = 258;
    const gap = 24;
    const bottomY = cy + 275;
    const leftX = cx - (halfW / 2 + gap / 2);
    const rightX = cx + (halfW / 2 + gap / 2);

    const titleBtn = this.add.rectangle(leftX, bottomY, halfW, 68, 0x334155)
      .setStrokeStyle(2, 0x64748b)
      .setInteractive({ useHandCursor: true })
      .setScrollFactor(0);
    this.add.text(leftX, bottomY, t.backTitle, {
      fontFamily: "'M PLUS Rounded 1c', sans-serif",
      fontSize: '22px',
      fontWeight: '800',
      color: '#f8fafc'
    }).setOrigin(0.5).setScrollFactor(0);
    titleBtn.on('pointerdown', () => {
      audio.init();
      this.scene.start('SceneTitle');
    });

    const moreBtn = this.add.rectangle(rightX, bottomY, halfW, 68, 0x475569)
      .setStrokeStyle(2, 0x94a3b8)
      .setInteractive({ useHandCursor: true })
      .setScrollFactor(0);
    this.add.text(rightX, bottomY, t.moreGames, {
      fontFamily: "'M PLUS Rounded 1c', sans-serif",
      fontSize: '22px',
      fontWeight: '800',
      color: '#f8fafc'
    }).setOrigin(0.5).setScrollFactor(0);
    moreBtn.on('pointerdown', () => {
      window.location.href = '../index.html';
    });
  }
}

/* ==========================================================================
   Phaser Game 初期化
   ========================================================================== */
const phaserConfig = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: CONFIG.width,
  height: CONFIG.height,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: [SceneTitle, MainScene, SceneResult],
  render: {
    pixelArt: false,
    antialias: true
  }
};

const game = new Phaser.Game(phaserConfig);
</script>
