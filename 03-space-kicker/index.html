  // ==========================================
  // 2. Web Audio API サウンド合成エンジン
  // ==========================================
  class SoundSynth {
    static ctx = null;

    static init() {
      if (!this.ctx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) this.ctx = new AudioContextClass();
      }
    }

    static resume() {
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    static playKick(type = 'NORMAL') {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      if (type === 'BOMB') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(30, t + 0.25);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
      } else if (type === 'FIRE') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(400, t);
        osc.frequency.exponentialRampToValueAtTime(800, t + 0.15);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
      } else if (type === 'THUNDER') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, t);
        osc.frequency.exponentialRampToValueAtTime(120, t + 0.15);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.12);
        gain.gain.setValueAtTime(0.35, t);
        gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
      }

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.3);
    }

    static playHit(combo = 1) {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66];
      const noteIndex = Math.min(combo - 1, scale.length - 1);
      const baseFreq = scale[noteIndex] || 440;

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(baseFreq, t);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, t + 0.08);

      gain.gain.setValueAtTime(0.28, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.12);
    }

    static playExplosion() {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      const t = this.ctx.currentTime;
      const bufferSize = this.ctx.sampleRate * 0.35;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(800, t);
      filter.frequency.linearRampToValueAtTime(50, t + 0.35);

      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(this.ctx.destination);

      noise.start(t);
      noise.stop(t + 0.4);
    }

    static playPowerUp() {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      const t = this.ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t + idx * 0.05);
        gain.gain.setValueAtTime(0.2, t + idx * 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.05 + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t + idx * 0.05);
        osc.stop(t + idx * 0.05 + 0.18);
      });
    }

    static playThunder() {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, t);
      osc.frequency.setValueAtTime(300, t + 0.04);
      osc.frequency.setValueAtTime(950, t + 0.08);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.16);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.18);
    }

    static playKill() {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(200, t);
      osc.frequency.exponentialRampToValueAtTime(60, t + 0.15);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.18);
    }

    static playWarning() {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(500, t);
      osc.frequency.linearRampToValueAtTime(300, t + 0.25);
      gain.gain.setValueAtTime(0.35, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + 0.28);
    }

    static playGameOver() {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      const t = this.ctx.currentTime;
      const notes = [440, 415, 392, 349];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, t + idx * 0.16);
        gain.gain.setValueAtTime(0.3, t + idx * 0.16);
        gain.gain.linearRampToValueAtTime(0.01, t + idx * 0.16 + 0.22);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t + idx * 0.16);
        osc.stop(t + idx * 0.16 + 0.25);
      });
    }

    static playTap() {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      this.resume();

      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.08);
    }
  }

  // ==========================================
  // 3. テクスチャ生成ユーティリティ (Canvas)
  // ==========================================
  function createEmojiTexture(scene, key, emoji, size = 48, glowColor = null) {
    if (scene.textures.exists(key)) return;
    const canvas = document.createElement('canvas');
    canvas.width = size * 1.5;
    canvas.height = size * 1.5;
    const ctx = canvas.getContext('2d');
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;

    if (glowColor) {
      ctx.save();
      ctx.shadowColor = glowColor;
      ctx.shadowBlur = 18;
      ctx.fillStyle = glowColor;
      ctx.beginPath();
      ctx.arc(cx, cy, size * 0.45, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.font = `${size}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, cx, cy + size * 0.08);

    scene.textures.addCanvas(key, canvas);
  }

  function createCircleTexture(scene, key, radius, color, glow = null) {
    if (scene.textures.exists(key)) return;
    const canvas = document.createElement('canvas');
    const d = (radius + (glow ? 12 : 2)) * 2;
    canvas.width = d;
    canvas.height = d;
    const ctx = canvas.getContext('2d');
    const cx = d / 2;
    const cy = d / 2;

    if (glow) {
      ctx.shadowColor = glow;
      ctx.shadowBlur = 12;
    }
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();

    scene.textures.addCanvas(key, canvas);
  }

  function initAllTextures(scene) {

    createCircleTexture(scene, 'spark_blue', 4, '#38bdf8', '#38bdf8');

      // --- トップバー (UIトグル) ---

      // タイトルロゴ
      this.add.text(width / 2, 175, t.title, {
        fontSize: '36px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        fill: '#ffffff',
        stroke: '#0284c7',
        strokeThickness: 6,
        shadow: { color: '#38bdf8', fill: true, blur: 20 }
      }).setOrigin(0.5);

      this.add.text(width / 2, 218, t.subTitle, {
        fontSize: '13px',
        fill: '#94a3b8'
      }).setOrigin(0.5);

      // メインボールアニメーション
      const demoBall = this.add.text(width / 2, 288, '⚽', { fontSize: '70px' }).setOrigin(0.5);
      this.tweens.add({

        scale: 1.15,
        rotation: Math.PI * 2,
        yoyo: true,

        duration: 1200,
        ease: 'Cubic.easeInOut'
      });

      // 遊び方カード
      const card = this.add.graphics();
      card.fillStyle(0x0f172a, 0.9);
      card.lineStyle(1, 0x38bdf8, 0.5);
      card.strokeRoundedRect(28, 355, width - 56, 175, 16);
      card.fillRoundedRect(28, 355, width - 56, 175, 16);

      this.add.text(width / 2, 380, t.howToPlay, { fontSize: '15px', fontStyle: 'bold', fill: '#facc15' }).setOrigin(0.5);
      this.add.text(width / 2, 420, t.rule1, { fontSize: '13px', fill: '#cbd5e1' }).setOrigin(0.5);
      this.add.text(width / 2, 455, t.rule2, { fontSize: '13px', fill: '#fbbf24' }).setOrigin(0.5);
      this.add.text(width / 2, 490, t.rule3, { fontSize: '13px', fill: '#f87171' }).setOrigin(0.5);

      // ハイスコア表示
      this.add.text(width / 2, 560, `🏆 ${t.bestScore}: ${highScore}`, {
        fontSize: '16px',
        fontStyle: 'bold',
        fill: '#38bdf8'
      }).setOrigin(0.5);

      // スタートボタン（ふわふわ浮遊＆パルスアニメーション）
      const btnContainer = this.add.container(width / 2, 635);

      const startBtn = this.add.rectangle(0, 0, width - 80, 54, 0x0284c7)
        .setStrokeStyle(2, 0x38bdf8, 0.9)
        .setInteractive({ useHandCursor: true });
      const startTxt = this.add.text(0, 0, t.startBtn, {
        fontSize: '18px',
        fontStyle: 'bold',
        fill: '#ffffff'
      }).setOrigin(0.5);

      btnContainer.add([startBtn, startTxt]);

      this.tweens.add({
        targets: btnContainer,
        y: 627,
        scaleX: 1.05,
        scaleY: 1.05,
        duration: 750,
        yoyo: true,
        repeat: -1,
        ease: 'Sine.easeInOut'
      });

      startBtn.on('pointerdown', () => {
        SoundSynth.playTap();
        SoundSynth.playKick('NORMAL');
        this.scene.start('SceneGame');
      });

    createHeaderUI(w) {

        .setStrokeStyle(1, 0x38bdf8, 0.5)

        .setStrokeStyle(1, 0x38bdf8, 0.5)

    }

    createStarfield() {
      const { width, height } = this.scale;
      const starGraphics = this.add.graphics();
      for (let i = 0; i < 50; i++) {
        const x = Phaser.Math.Between(0, width);
        const y = Phaser.Math.Between(0, height);
        const r = Phaser.Math.FloatBetween(0.6, 2.0);
        const a = Phaser.Math.FloatBetween(0.2, 0.8);
        starGraphics.fillStyle(0xffffff, a);
        starGraphics.fillCircle(x, y, r);
      }
    }
  }

  // ==========================================
  // 5. メインゲームシーン (SceneGame)
  // ==========================================
  class SceneGame extends Phaser.Scene {
    constructor() { super('SceneGame'); }

    create() {
      const { width, height } = this.scale;
      this.score = 0;
      this.highScore = parseInt(localStorage.getItem('choujin_soccer_highscore') || localStorage.getItem('space_kicker_highscore') || '0', 10);
      this.wave = 1;
      this.combo = 0;
      this.comboTimer = 0;
      this.isGameOver = false;

      this.powerUpStock = [];

      this.createSpaceBackground();

      // 防衛ゴールライン (y: height - 84)
      this.goalY = height - 84;
      this.createDefenseLine();

      // キッカー発射台
      this.kickerX = width / 2;
      this.kickerY = this.goalY + 20;
      this.kicker = this.add.sprite(this.kickerX, this.kickerY, 'kicker_pedestal').setScale(1.1);

      // グループ
      this.balls = this.physics.add.group();
      this.enemies = this.physics.add.group();
      this.items = this.physics.add.group();

      // 照準ガイドライン
      this.aimGraphics = this.add.graphics().setDepth(50);
      this.isAiming = false;
      this.aimStartPos = new Phaser.Math.Vector2();
      this.aimCurrentPos = new Phaser.Math.Vector2();

      this.createUI();

      this.input.on('pointerdown', this.onPointerDown, this);
      this.input.on('pointermove', this.onPointerMove, this);
      this.input.on('pointerup', this.onPointerUp, this);

      this.physics.world.setBounds(0, 0, width, height + 120);

      this.physics.add.overlap(this.balls, this.enemies, this.handleBallEnemyOverlap, null, this);
      this.physics.add.overlap(this.balls, this.items, this.handleBallItemOverlap, null, this);

      this.enemySpawnTimer = 0;
      this.spawnInterval = 2200;
      this.waveTimer = this.time.addEvent({
        delay: 15000,
        callback: this.nextWave,
        callbackScope: this,
        loop: true
      });
    }

    createSpaceBackground() {
      const { width, height } = this.scale;
      this.gridGraphics = this.add.graphics();
      this.gridGraphics.lineStyle(1, 0x1e293b, 0.4);
      for (let x = 0; x < width; x += 40) {
        this.gridGraphics.moveTo(x, 0);
        this.gridGraphics.lineTo(x, height);
      }
      for (let y = 0; y < height; y += 40) {
        this.gridGraphics.moveTo(0, y);
        this.gridGraphics.lineTo(width, y);
      }
      this.gridGraphics.strokePath();

      this.stars = [];
      for (let i = 0; i < 40; i++) {
        const star = this.add.circle(
          Phaser.Math.Between(0, width),
          Phaser.Math.Between(0, height),
          Phaser.Math.FloatBetween(0.6, 2.0),
          0x38bdf8,
          Phaser.Math.FloatBetween(0.2, 0.8)
        );
        this.stars.push({ obj: star, speed: Phaser.Math.FloatBetween(0.4, 1.8) });
      }
    }

    createDefenseLine() {
      const { width } = this.scale;
      const t = I18N[currentLang];
      this.defenseGraphics = this.add.graphics();
      this.defenseGraphics.lineStyle(3, 0xef4444, 0.9);
      this.defenseGraphics.moveTo(0, this.goalY);
      this.defenseGraphics.lineTo(width, this.goalY);
      this.defenseGraphics.strokePath();

      this.add.text(width / 2, this.goalY - 12, t.defenseLine, {
        fontSize: '11px',
        fontWeight: '800',
        color: '#f87171'
      }).setOrigin(0.5);
    }

    createUI() {
      const { width } = this.scale;
      const t = I18N[currentLang];

      const topBar = this.add.graphics();
      topBar.fillStyle(0x0f172a, 0.85);
      topBar.fillRect(0, 0, width, 52);
      topBar.lineStyle(1, 0x334155, 1);
      topBar.moveTo(0, 52);
      topBar.lineTo(width, 52);
      topBar.strokePath();

      this.scoreText = this.add.text(16, 12, `SCORE: 0`, {
        fontSize: '17px',
        fontWeight: '900',
        color: '#38bdf8'
      });

      this.waveText = this.add.text(width / 2, 12, `${t.wave} 1`, {
        fontSize: '17px',
        fontWeight: '900',
        color: '#facc15'
      }).setOrigin(0.5, 0);

      this.highScoreText = this.add.text(width - 16, 12, `HI: ${this.highScore}`, {
        fontSize: '17px',
        fontWeight: '900',
        color: '#f472b6'
      }).setOrigin(1, 0);

      this.stockText = this.add.text(16, 62, '', {
        fontSize: '14px',
        fontWeight: '800',
        color: '#ffffff'
      }).setDepth(100);

      this.comboText = this.add.text(width / 2, 100, '', {
        fontSize: '24px',
        fontWeight: '900',
        color: '#facc15',
        stroke: '#000000',
        strokeThickness: 4
      }).setOrigin(0.5).setDepth(100).setAlpha(0);
    }

    update(time, delta) {
      if (this.isGameOver) return;

      if (this.stars) {
        this.stars.forEach(s => {
          s.obj.y += s.speed;
          if (s.obj.y > this.scale.height) s.obj.y = 0;
        });
      }

      if (this.comboTimer > 0) {
        this.comboTimer -= delta;
        if (this.comboTimer <= 0) {
          this.combo = 0;
          this.tweens.add({ targets: this.comboText, alpha: 0, duration: 200 });
        }
      }

      this.enemySpawnTimer += delta;
      if (this.enemySpawnTimer >= this.spawnInterval) {
        this.enemySpawnTimer = 0;
        this.spawnEnemyWave();
      }

      this.balls.getChildren().forEach(ball => {
        if (!ball.active) return;
        if (ball.body.velocity.length() < 300) {
          ball.body.velocity.normalize().scale(550);
        }
        if (ball.y < 0 || ball.x < 0 || ball.x > this.scale.width || ball.y > this.scale.height + 40) {
          this.createBallVanishEffect(ball.x, ball.y, ball.ballType);
          ball.destroy();
        }
      });

      this.enemies.getChildren().forEach(enemy => {
        if (!enemy.active) return;
        if (enemy.y >= this.goalY - 20) {
          this.triggerGameOver();
        }
      });

      this.items.getChildren().forEach(item => {
        if (item.y > this.scale.height) item.destroy();
      });
    }

    onPointerDown(pointer) {
      if (this.isGameOver || pointer.y < 56) return;
      this.isAiming = true;
      this.aimStartPos.set(pointer.x, pointer.y);
      this.aimCurrentPos.set(pointer.x, pointer.y);
    }

    onPointerMove(pointer) {
      if (!this.isAiming) return;
      this.aimCurrentPos.set(pointer.x, pointer.y);
      this.drawAimLine();
    }

    onPointerUp(pointer) {
      if (!this.isAiming) return;
      this.isAiming = false;
      this.aimGraphics.clear();

      let dragVec = this.aimStartPos.clone().subtract(this.aimCurrentPos);
      let angle;

      if (dragVec.length() > 20) {
        angle = dragVec.angle();
        if (angle > 0 && angle < Math.PI) {
          angle = -angle;
        }
      } else {
        const kickVec = new Phaser.Math.Vector2(pointer.x - this.kickerX, pointer.y - this.kickerY);
        angle = kickVec.angle();
        if (angle > -0.1 && angle < Math.PI + 0.1) {
          angle = -Math.PI / 2;
        }
      }

      angle = Phaser.Math.Clamp(angle, -Math.PI + 0.25, -0.25);
      this.shootBall(angle);
    }

    drawAimLine() {
      this.aimGraphics.clear();
      let dragVec = this.aimStartPos.clone().subtract(this.aimCurrentPos);
      let angle;

      if (dragVec.length() > 20) {
        angle = dragVec.angle();
        if (angle > 0 && angle < Math.PI) angle = -angle;
      } else {
        const kickVec = new Phaser.Math.Vector2(this.aimCurrentPos.x - this.kickerX, this.aimCurrentPos.y - this.kickerY);
        angle = kickVec.angle();
        if (angle > -0.1 && angle < Math.PI + 0.1) angle = -Math.PI / 2;
      }

      angle = Phaser.Math.Clamp(angle, -Math.PI + 0.25, -0.25);

      const len = 140;
      const targetX = this.kickerX + Math.cos(angle) * len;
      const targetY = this.kickerY + Math.sin(angle) * len;

      this.aimGraphics.lineStyle(3, 0x38bdf8, 0.85);
      this.aimGraphics.strokePoints([
        new Phaser.Geom.Point(this.kickerX, this.kickerY),
        new Phaser.Geom.Point(targetX, targetY)
      ]);
    }

    shootBall(angle, typeOverride = null, spawnPos = null) {
      let ballType = typeOverride || 'NORMAL';
      if (!typeOverride && this.powerUpStock.length > 0) {
        const item = this.powerUpStock[0];
        ballType = item.type;
        item.count--;
        if (item.count <= 0) this.powerUpStock.shift();
        this.updateStockUI();
      }

      const x = spawnPos ? spawnPos.x : this.kickerX;
      const y = spawnPos ? spawnPos.y : this.kickerY - 10;
      const speed = 750;

      let textureKey = 'ball_normal';
      if (ballType === 'BOMB') textureKey = 'ball_bomb';
      if (ballType === 'FIRE') textureKey = 'ball_fire';
      if (ballType === 'THUNDER') textureKey = 'ball_thunder';

      const ball = this.balls.create(x, y, textureKey);
      ball.ballType = ballType;
      ball.body.setCollideWorldBounds(true);
      ball.body.setBounce(1, 1);
      ball.body.setCircle(14, 4, 4);

      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;
      ball.body.setVelocity(vx, vy);

      SoundSynth.playKick(ballType);

      this.tweens.add({
        targets: this.kicker,
        scaleX: 1.35,
        scaleY: 1.35,
        duration: 80,
        yoyo: true
      });
    }

    handleBallEnemyOverlap(ball, enemy) {
      if (!ball.active || !enemy.active) return;

      this.combo++;
      this.comboTimer = 2200;
      this.showComboUI(this.combo);
      SoundSynth.playHit(this.combo);

      const damage = (ball.ballType === 'FIRE') ? 3 : (ball.ballType === 'BOMB') ? 5 : 1;
      this.damageEnemy(enemy, damage, ball);

      if (ball.ballType === 'BOMB') {
        SoundSynth.playExplosion();
        this.cameras.main.shake(200, 0.015);
        this.createExplosionParticles(enemy.x, enemy.y, 25);
        this.splashDamage(enemy.x, enemy.y, 110, 4);
        this.createBallVanishEffect(ball.x, ball.y, 'BOMB');
        ball.destroy();
        return;
      }

      if (ball.ballType === 'THUNDER' && !ball.hasSplit) {
        ball.hasSplit = true;
        SoundSynth.playThunder();
        const curAngle = ball.body.velocity.angle();
        this.shootBall(curAngle + 0.35, 'NORMAL', { x: ball.x, y: ball.y });
        this.shootBall(curAngle - 0.35, 'NORMAL', { x: ball.x, y: ball.y });
      }

      if (ball.ballType !== 'FIRE') {
        const dx = ball.x - enemy.x;
        const dy = ball.y - enemy.y;
        const normal = new Phaser.Math.Vector2(dx, dy).normalize();
        const currentVel = ball.body.velocity.clone();
        const dot = currentVel.dot(normal);
        const reflectVel = currentVel.subtract(normal.scale(2 * dot));
        ball.body.setVelocity(reflectVel.x, reflectVel.y);
      }
    }

    damageEnemy(enemy, amount, sourceBall) {
      enemy.hp -= amount;
      this.showDamageText(enemy.x, enemy.y, `-${amount}`, amount > 1 ? '#f97316' : '#ffffff');

      this.tweens.add({
        targets: enemy,
        tint: 0xff0000,
        duration: 80,
        yoyo: true,
        onComplete: () => enemy.clearTint()
      });

      if (enemy.hp <= 0) {
        this.killEnemy(enemy);
      }
    }

    splashDamage(cx, cy, radius, damage) {
      this.enemies.getChildren().forEach(enemy => {
        if (!enemy.active) return;
        const dist = Phaser.Math.Distance.Between(cx, cy, enemy.x, enemy.y);
        if (dist <= radius) {
          this.damageEnemy(enemy, damage, null);
        }
      });
    }

    killEnemy(enemy) {
      SoundSynth.playKill();
      const points = (enemy.enemyType === 'boss') ? 500 : (enemy.enemyType === 'giant') ? 150 : 50;
      this.score += points + (this.combo * 5);
      this.scoreText.setText(`SCORE: ${this.score}`);

      this.createExplosionParticles(enemy.x, enemy.y, 16);

      if (Math.random() < 0.28) {
        this.spawnItem(enemy.x, enemy.y);
      }

      enemy.destroy();
    }

    spawnItem(x, y) {
      const types = ['BOMB', 'FIRE', 'THUNDER'];
      const type = Phaser.Utils.Array.GetRandom(types);
      let key = 'item_bomb';
      if (type === 'FIRE') key = 'item_fire';
      if (type === 'THUNDER') key = 'item_thunder';

      const item = this.items.create(x, y, key);
      item.itemType = type;
      item.body.setVelocityY(90);
      item.body.setCircle(14, 2, 2);

      this.tweens.add({
        targets: item,
        scaleX: 1.2,
        scaleY: 1.2,
        duration: 400,
        yoyo: true,
        repeat: -1
      });
    }

    handleBallItemOverlap(ball, item) {
      if (!item.active) return;
      SoundSynth.playPowerUp();

      const existing = this.powerUpStock.find(p => p.type === item.itemType);
      if (existing) {
        existing.count += 3;
      } else {
        this.powerUpStock.push({ type: item.itemType, count: 3 });
      }

      this.showDamageText(item.x, item.y, `GET ${item.itemType}!`, '#38bdf8');
      this.createSparkEffect(item.x, item.y, 12, 'spark_yellow');
      this.updateStockUI();
      item.destroy();
    }

    updateStockUI() {
      if (this.powerUpStock.length === 0) {
        this.stockText.setText('');
      } else {
        const list = this.powerUpStock.map(p => {
          const icon = (p.type === 'BOMB') ? '💣' : (p.type === 'FIRE') ? '🔥' : '⚡';
          return `${icon} x${p.count}`;
        }).join('  ');
        this.stockText.setText(`NEXT: ${list}`);
      }
    }

    showComboUI(combo) {
      if (combo < 2) return;
      this.comboText.setText(`${combo} COMBO! 🔥`);
      this.comboText.setAlpha(1).setScale(1.3);
      this.tweens.killTweensOf(this.comboText);
      this.tweens.add({
        targets: this.comboText,
        scaleX: 1.0,
        scaleY: 1.0,
        duration: 180,
        ease: 'Back.easeOut'
      });
    }

    nextWave() {
      if (this.isGameOver) return;
      this.wave++;
      const t = I18N[currentLang];
      this.waveText.setText(`${t.wave} ${this.wave}`);
      this.spawnInterval = Math.max(1200, 2200 - (this.wave * 120));

      if (this.wave % 5 === 0) {
        SoundSynth.playWarning();
        this.cameras.main.shake(300, 0.02);
        this.spawnBoss();
      }
    }

    spawnEnemyWave() {
      const { width } = this.scale;
      const count = Phaser.Math.Between(2, Math.min(5, 2 + Math.floor(this.wave / 2)));
      for (let i = 0; i < count; i++) {
        const x = Phaser.Math.Between(40, width - 40);
        const y = Phaser.Math.Between(60, 160);
        this.spawnEnemy(x, y);
      }
    }

    spawnEnemy(x, y) {
      const r = Math.random();
      let type = 'zako';
      let hp = 1;
      let speed = 40 + this.wave * 4;

      if (r < 0.25) {
        type = 'speed';
        hp = 1;
        speed = 85 + this.wave * 6;
      } else if (r < 0.45) {
        type = 'ufo';
        hp = 2;
        speed = 50 + this.wave * 4;
      } else if (r < 0.60 && this.wave >= 2) {
        type = 'giant';
        hp = 5;
        speed = 30 + this.wave * 3;
      }

      const enemy = this.enemies.create(x, y, `enemy_${type}`);
      enemy.enemyType = type;
      enemy.hp = hp;
      enemy.maxHp = hp;
      enemy.body.setVelocityY(speed);
      enemy.body.setCircle(18, 4, 4);
    }

    spawnBoss() {
      const { width } = this.scale;
      const enemy = this.enemies.create(width / 2, 90, 'enemy_boss');
      enemy.enemyType = 'boss';
      enemy.hp = 25 + this.wave * 5;
      enemy.maxHp = enemy.hp;
      enemy.body.setVelocityY(22);
      enemy.body.setCircle(32, 6, 6);
    }

    showDamageText(x, y, text, color = '#ffffff') {
      const t = this.add.text(x, y, text, {
        fontSize: '16px',
        fontWeight: '900',
        color: color,
        stroke: '#000000',
        strokeThickness: 3
      }).setOrigin(0.5);

      this.tweens.add({
        targets: t,
        y: y - 30,
        alpha: 0,
        scale: 1.2,
        duration: 600,
        onComplete: () => t.destroy()
      });
    }

    createSparkEffect(x, y, count, texture) {
      for (let i = 0; i < count; i++) {
        const spark = this.add.sprite(x, y, texture);
        const angle = Math.random() * Math.PI * 2;
        const speed = Phaser.Math.Between(40, 160);
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;

        this.tweens.add({
          targets: spark,
          x: x + vx * 0.4,
          y: y + vy * 0.4,
          alpha: 0,
          scale: 0.2,
          duration: Phaser.Math.Between(250, 450),
          onComplete: () => spark.destroy()
        });
      }
    }

    createExplosionParticles(x, y, count) {
      const textures = ['spark_red', 'spark_orange', 'spark_yellow', 'spark_white'];
      for (let i = 0; i < count; i++) {
        const tex = Phaser.Utils.Array.GetRandom(textures);
        const p = this.add.sprite(x, y, tex);
        const angle = Math.random() * Math.PI * 2;
        const dist = Phaser.Math.Between(30, 120);

        this.tweens.add({
          targets: p,
          x: x + Math.cos(angle) * dist,
          y: y + Math.sin(angle) * dist,
          alpha: 0,
          scale: Phaser.Math.FloatBetween(0.1, 0.4),
          duration: Phaser.Math.Between(350, 650),
          ease: 'Cubic.easeOut',
          onComplete: () => p.destroy()
        });
      }
    }

    createBallVanishEffect(x, y, type) {
      let tex = 'spark_blue';
      if (type === 'BOMB') tex = 'spark_red';
      if (type === 'FIRE') tex = 'spark_orange';
      if (type === 'THUNDER') tex = 'spark_yellow';
      this.createSparkEffect(x, y, 6, tex);
    }

    triggerGameOver() {
      if (this.isGameOver) return;
      this.isGameOver = true;
      SoundSynth.playGameOver();

      this.cameras.main.shake(500, 0.035);
      this.time.delayedCall(700, () => {
        this.scene.start('SceneResult', {
          score: this.score,
          wave: this.wave
        });
      });
    }
  }

  // ==========================================
  // 6. 共通リザルトシーン (SceneResult)
  // ==========================================
  class SceneResult extends Phaser.Scene {
    constructor() { super('SceneResult'); }
    init(data) {
      this.finalScore = data.score || 0;
      this.wave = data.wave || 1;
    }

    create() {
      const { width, height } = this.scale;
      const cx = width / 2;
      const cy = height / 2;
      const t = I18N[currentLang];

      if (typeof window.gtag === 'function') {
        window.gtag('event', 'game_over', { 'score': this.finalScore, 'wave': this.wave });
      }

      let best = parseInt(localStorage.getItem('choujin_soccer_highscore') || localStorage.getItem('space_kicker_highscore') || '0', 10);
      const isNew = this.finalScore > best;
      if (isNew) {
        best = this.finalScore;
        localStorage.setItem('choujin_soccer_highscore', best);
        localStorage.setItem('space_kicker_highscore', best);
      }

      // ランク判定
      let rank = t.rankC;
      if (this.finalScore >= 3000) rank = t.rankS;
      else if (this.finalScore >= 1500) rank = t.rankA;
      else if (this.finalScore >= 500) rank = t.rankB;

      // 背景オーバーレイ & 中央カードパネル
      this.add.rectangle(cx, cy, width, height, 0x06070d, 0.94).setScrollFactor(0);
      this.add.rectangle(cx, cy, 420, 520, 0x0f1424, 0.96)
        .setStrokeStyle(2, 0xff9f1c, 0.65)
        .setScrollFactor(0);

      // 1. 終了タイトル
      this.add.text(cx, cy - 195, t.gameOver, {
        fontSize: '34px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        fill: '#ef4444',
        stroke: '#000000',
        strokeThickness: 5
      }).setOrigin(0.5).setScrollFactor(0);

      // 2. 今回スコア: 「SCORE: {スコア}」
      this.add.text(cx, cy - 125, `SCORE: ${this.finalScore}`, {
        fontSize: '36px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        fill: '#38bdf8'
      }).setOrigin(0.5).setScrollFactor(0);

      // 3. ランク／称号: 「ランク: 【 {ランク・称号} 】」
      this.add.text(cx, cy - 65, `ランク: 【 ${rank} 】`, {
        fontSize: '17px',
        fontStyle: 'bold',
        fill: '#facc15',
        align: 'center',
        wordWrap: { width: 380 }
      }).setOrigin(0.5).setScrollFactor(0);

      // 4. ベストスコア: 「🏆 BEST SCORE: {ベストスコア}」
      this.add.text(cx, cy - 15, `🏆 BEST SCORE: ${best}${isNew ? ' 🔥 NEW!' : ''}`, {
        fontSize: '18px',
        fontStyle: 'bold',
        fill: '#f472b6'
      }).setOrigin(0.5).setScrollFactor(0);

      // 上段ボタン（横幅いっぱい）: 🔄 もう一回 / 🔄 RETRY
      const retryBtn = this.add.rectangle(cx, cy + 60, 360, 52, 0x10b981)
        .setStrokeStyle(1.5, 0x6ee7b7, 0.8)
        .setScrollFactor(0)
        .setInteractive({ useHandCursor: true });
      this.add.text(cx, cy + 60, currentLang === 'ja' ? '🔄 もう一回' : '🔄 RETRY', {
        fontSize: '18px',
        fontStyle: 'bold',
        fill: '#ffffff'
      }).setOrigin(0.5).setScrollFactor(0);
      retryBtn.on('pointerdown', () => {
        SoundSynth.playTap();
        this.scene.start('SceneGame');
      });

      // 中段ボタン（横幅いっぱい）: 𝕏 でポスト / 𝕏 POST TO X
      const shareBtn = this.add.rectangle(cx, cy + 126, 360, 52, 0x0284c7)
        .setStrokeStyle(1.5, 0x7dd3fc, 0.8)
        .setScrollFactor(0)
        .setInteractive({ useHandCursor: true });
      this.add.text(cx, cy + 126, currentLang === 'ja' ? '𝕏 でポスト' : '𝕏 POST TO X', {
        fontSize: '18px',
        fontStyle: 'bold',
        fill: '#ffffff'
      }).setOrigin(0.5).setScrollFactor(0);
      shareBtn.on('pointerdown', () => {
        SoundSynth.playTap();
        const text = encodeURIComponent(t.shareText.replace('{score}', this.finalScore).replace('{rank}', rank).replace('{wave}', this.wave));
        const url = encodeURIComponent(window.location.href);
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
      });

      // 下段ボタン（左右2分割で横並び配置）
      const halfW = 172;
      const gap = 16;
      const leftX = cx - (halfW / 2 + gap / 2);
      const rightX = cx + (halfW / 2 + gap / 2);
      const bottomY = cy + 192;

      // 左ボタン: 🏠 タイトルへ / 🏠 TITLE
      const titleBtn = this.add.rectangle(leftX, bottomY, halfW, 48, 0x334155)
        .setStrokeStyle(1.5, 0x94a3b8, 0.6)
        .setScrollFactor(0)
        .setInteractive({ useHandCursor: true });
      this.add.text(leftX, bottomY, currentLang === 'ja' ? '🏠 タイトルへ' : '🏠 TITLE', {
        fontSize: '15px',
        fontStyle: 'bold',
        fill: '#e2e8f0'
      }).setOrigin(0.5).setScrollFactor(0);
      titleBtn.on('pointerdown', () => {
        SoundSynth.playTap();
        this.scene.start('SceneTitle');
      });

      // 右ボタン: 🌐 MENUに戻る / 🌐 MENU
      const portalBtn = this.add.rectangle(rightX, bottomY, halfW, 48, 0x475569)
        .setStrokeStyle(1.5, 0x94a3b8, 0.6)
        .setScrollFactor(0)
        .setInteractive({ useHandCursor: true });
      this.add.text(rightX, bottomY, currentLang === 'ja' ? '🌐 MENUに戻る' : '🌐 MENU', {
        fontSize: '15px',
        fontStyle: 'bold',
        fill: '#e2e8f0'
      }).setOrigin(0.5).setScrollFactor(0);
      portalBtn.on('pointerdown', () => {
        SoundSynth.playTap();
        window.open('../index.html', '_self');
      });
    }
  }

  // ==========================================
  // 7. Phaser ゲーム設定・起動
  // ==========================================
  const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    width: 480,
    height: 800,
    backgroundColor: '#020617',
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
      default: 'arcade',
      arcade: {
        gravity: { y: 0 },
        fps: 120,
        fixedStep: true,
        debug: false
      }
    },
    scene: [SceneTitle, SceneGame, SceneResult]
  };

  window.addEventListener('DOMContentLoaded', () => {
    new Phaser.Game(config);
  });

})();
</script>
</body>
</html>
