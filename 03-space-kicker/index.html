<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>超人サッカー</title>
  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      color: #f8fafc;
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 480px;
      max-height: 854px;
      box-shadow: 0 0 40px rgba(56, 189, 248, 0.25), 0 0 100px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>

<div id="game-container"></div>

<script>
/**
 * 超人サッカー (Choujin Soccer)
 * Google Antigravity 2.0 × Phaser 3
 * ゼロアセット構成 (Canvas動的テクスチャ + Web Audio API)
 */

// ==========================================
// 1. Web Audio API サウンド合成エンジン
// ==========================================
class SoundSynth {
  constructor() {
    this.ctx = null;
    this.isMuted = false;
  }

  init() {
    if (!this.ctx) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioContext();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  // キック/発射音
  playKick(type = 'NORMAL') {
    if (!this.ctx || this.isMuted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    if (type === 'BOMB') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.exponentialRampToValueAtTime(30, t + 0.25);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
    } else if (type === 'FIRE') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(400, t);
      osc.frequency.exponentialRampToValueAtTime(800, t + 0.15);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
    } else if (type === 'THUNDER') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(600, t);
      osc.frequency.exponentialRampToValueAtTime(120, t + 0.15);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
    } else {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(260, t);
      osc.frequency.exponentialRampToValueAtTime(80, t + 0.12);
      gain.gain.setValueAtTime(0.35, t);
      gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
    }

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.3);
  }

  // ヒット音（コンボ数に応じてピッチ上昇）
  playHit(combo = 1) {
    if (!this.ctx || this.isMuted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    // ペンタトニック音階の周波数テーブル (C調)
    const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66];
    const noteIndex = Math.min(combo - 1, scale.length - 1);
    const baseFreq = scale[noteIndex] || 440;

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(baseFreq, t);
    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.5, t + 0.08);

    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);

    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.12);
  }

  // ボム爆発音
  playExplosion() {
    if (!this.ctx || this.isMuted) return;
    const t = this.ctx.currentTime;
    
    // ノイズバッファ生成
    const bufferSize = this.ctx.sampleRate * 0.4;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = Math.random() * 2 - 1;
    }

    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(800, t);
    filter.frequency.linearRampToValueAtTime(50, t + 0.4);

    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.6, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.4);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);

    noise.start(t);
    noise.stop(t + 0.45);
  }

  // パワーアップ取得音
  playPowerUp() {
    if (!this.ctx || this.isMuted) return;
    const t = this.ctx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.50]; // C, E, G, High C
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t + idx * 0.05);
      gain.gain.setValueAtTime(0.25, t + idx * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.05 + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t + idx * 0.05);
      osc.stop(t + idx * 0.05 + 0.18);
    });
  }

  // サンダー分裂音
  playThunder() {
    if (!this.ctx || this.isMuted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.setValueAtTime(300, t + 0.04);
    osc.frequency.setValueAtTime(950, t + 0.08);
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.exponentialRampToValueAtTime(0.01, t + 0.16);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.18);
  }

  // 敵撃破音
  playKill() {
    if (!this.ctx || this.isMuted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(200, t);
    osc.frequency.exponentialRampToValueAtTime(60, t + 0.15);
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.18);
  }

  // ボス出現アラート音
  playWarning() {
    if (!this.ctx || this.isMuted) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(500, t);
    osc.frequency.linearRampToValueAtTime(300, t + 0.25);
    gain.gain.setValueAtTime(0.4, t);
    gain.gain.linearRampToValueAtTime(0.01, t + 0.25);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + 0.28);
  }

  // ゲームオーバー音
  playGameOver() {
    if (!this.ctx || this.isMuted) return;
    const t = this.ctx.currentTime;
    const notes = [440, 415, 392, 349];
    notes.forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t + idx * 0.18);
      gain.gain.setValueAtTime(0.35, t + idx * 0.18);
      gain.gain.linearRampToValueAtTime(0.01, t + idx * 0.18 + 0.25);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t + idx * 0.18);
      osc.stop(t + idx * 0.18 + 0.28);
    });
  }
}

const sounds = new SoundSynth();

// ==========================================
// 2. テクスチャ生成ユーティリティ (Canvas)
// ==========================================
function createEmojiTexture(scene, key, emoji, size = 48, glowColor = null) {
  const canvas = document.createElement('canvas');
  canvas.width = size * 1.5;
  canvas.height = size * 1.5;
  const ctx = canvas.getContext('2d');

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  if (glowColor) {
    ctx.save();
    ctx.shadowColor = glowColor;
    ctx.shadowBlur = 18;
    ctx.fillStyle = glowColor;
    ctx.beginPath();
    ctx.arc(cx, cy, size * 0.45, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  ctx.font = `${size}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(emoji, cx, cy + size * 0.08);

  scene.textures.addCanvas(key, canvas);
}

function createCircleTexture(scene, key, radius, color, glow = null) {
  const canvas = document.createElement('canvas');
  const d = (radius + (glow ? 12 : 2)) * 2;
  canvas.width = d;
  canvas.height = d;
  const ctx = canvas.getContext('2d');
  const cx = d / 2;
  const cy = d / 2;

  if (glow) {
    ctx.shadowColor = glow;
    ctx.shadowBlur = 12;
  }
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();

  scene.textures.addCanvas(key, canvas);
}

// ==========================================
// 3. BootScene (初期化 & テクスチャ生成)
// ==========================================
class BootScene extends Phaser.Scene {
  constructor() {
    super({ key: 'BootScene' });
  }

  create() {
    // ボール絵文字テクスチャ
    createEmojiTexture(this, 'ball_normal', '⚽', 36, 'rgba(56, 189, 248, 0.4)');
    createEmojiTexture(this, 'ball_bomb', '💣', 38, 'rgba(239, 68, 68, 0.7)');
    createEmojiTexture(this, 'ball_fire', '🔥', 40, 'rgba(249, 115, 22, 0.8)');
    createEmojiTexture(this, 'ball_thunder', '⚡', 40, 'rgba(234, 179, 8, 0.8)');

    // 敵絵文字テクスチャ
    createEmojiTexture(this, 'enemy_zako', '👾', 42, 'rgba(168, 85, 247, 0.4)');
    createEmojiTexture(this, 'enemy_speed', '👽', 38, 'rgba(34, 197, 94, 0.5)');
    createEmojiTexture(this, 'enemy_ufo', '🛸', 46, 'rgba(6, 182, 212, 0.6)');
    createEmojiTexture(this, 'enemy_giant', '🧟', 56, 'rgba(236, 72, 153, 0.6)');
    createEmojiTexture(this, 'enemy_boss', '🦖', 76, 'rgba(225, 29, 72, 0.8)');

    // アイテムドロップテクスチャ
    createEmojiTexture(this, 'item_bomb', '💣', 32, 'rgba(239, 68, 68, 0.8)');
    createEmojiTexture(this, 'item_fire', '🔥', 32, 'rgba(249, 115, 22, 0.8)');
    createEmojiTexture(this, 'item_thunder', '⚡', 32, 'rgba(234, 179, 8, 0.8)');

    // パーティクル用
    createCircleTexture(this, 'spark_blue', 4, '#38bdf8', '#38bdf8');
    createCircleTexture(this, 'spark_orange', 5, '#f97316', '#ea580c');
    createCircleTexture(this, 'spark_yellow', 4, '#fde047', '#eab308');
    createCircleTexture(this, 'spark_red', 6, '#ef4444', '#b91c1c');
    createCircleTexture(this, 'spark_white', 3, '#ffffff', '#ffffff');

    // キッカーアイコン
    createEmojiTexture(this, 'kicker_pedestal', '👟', 44, 'rgba(56, 189, 248, 0.6)');

    this.scene.start('TitleScene');
  }
}

// ==========================================
// 4. TitleScene (タイトル画面)
// ==========================================
class TitleScene extends Phaser.Scene {
  constructor() {
    super({ key: 'TitleScene' });
  }

  create() {
    const { width, height } = this.scale;
    const highScore = localStorage.getItem('choujin_soccer_highscore') || localStorage.getItem('space_kicker_highscore') || 0;

    // 背景星屑パーティクル
    this.createStarfield();

    // タイトルロゴ
    const titleText = this.add.text(width / 2, height * 0.22, '超人サッカー', {
      fontFamily: 'system-ui, -apple-system, sans-serif',
      fontSize: '48px',
      fontWeight: '900',
      align: 'center',
      color: '#ffffff',
      stroke: '#0284c7',
      strokeThickness: 8,
      shadow: { color: '#38bdf8', fill: true, blur: 20, offsetY: 0 }
    }).setOrigin(0.5);

    this.tweens.add({
      targets: titleText,
      y: height * 0.22 - 8,
      duration: 1200,
      yoyo: true,
      repeat: -1,
      ease: 'Sine.easeInOut'
    });

    // サブタイトル
    this.add.text(width / 2, height * 0.35, '⚡ 待ち時間ゼロの爆速キック防衛戦 ⚡', {
      fontSize: '15px',
      fontWeight: '700',
      color: '#38bdf8',
      align: 'center'
    }).setOrigin(0.5);

    // キャラクタープレビュー演出
    const demoBall = this.add.sprite(width / 2, height * 0.44, 'ball_normal').setScale(1.2);
    this.tweens.add({
      targets: demoBall,
      scaleX: 1.4,
      scaleY: 1.4,
      rotation: Math.PI * 2,
      duration: 2000,
      repeat: -1,
      yoyo: true,
      ease: 'Cubic.easeInOut'
    });

    // 操作説明
    const howtoBox = this.add.graphics();
    howtoBox.fillStyle(0x0f172a, 0.85);
    howtoBox.lineStyle(2, 0x38bdf8, 0.8);
    howtoBox.fillRoundedRect(width * 0.1, height * 0.52, width * 0.8, 140, 12);
    howtoBox.strokeRoundedRect(width * 0.1, height * 0.52, width * 0.8, 140, 12);

    this.add.text(width / 2, height * 0.52 + 22, '【 あそびかた 】', {
      fontSize: '16px',
      fontWeight: '800',
      color: '#facc15'
    }).setOrigin(0.5);

    this.add.text(width / 2, height * 0.52 + 70, '👆 画面をスワイプ＆タップで狙い撃ち！\n⚽ 前のボールが動いていても超連射OK！\n🛡️ 最下部ゴールラインを死守せよ！', {
      fontSize: '13px',
      fontWeight: '600',
      color: '#e2e8f0',
      align: 'center',
      lineSpacing: 8
    }).setOrigin(0.5);

    // ハイスコア表示
    this.add.text(width / 2, height * 0.72, `🏆 HIGH SCORE: ${highScore}`, {
      fontSize: '18px',
      fontWeight: '800',
      color: '#f472b6'
    }).setOrigin(0.5);

    // STARTボタン
    const startBtn = this.add.container(width / 2, height * 0.83);
    const btnBg = this.add.graphics();
    btnBg.fillStyle(0x0284c7, 1);
    btnBg.lineStyle(3, 0x38bdf8, 1);
    btnBg.fillRoundedRect(-120, -28, 240, 56, 28);
    btnBg.strokeRoundedRect(-120, -28, 240, 56, 28);

    const btnText = this.add.text(0, 0, 'KICK START!', {
      fontSize: '22px',
      fontWeight: '900',
      color: '#ffffff'
    }).setOrigin(0.5);

    startBtn.add([btnBg, btnText]);
    startBtn.setSize(240, 56);
    startBtn.setInteractive({ useHandCursor: true });

    this.tweens.add({
      targets: startBtn,
      scaleX: 1.05,
      scaleY: 1.05,
      duration: 700,
      yoyo: true,
      repeat: -1,
      ease: 'Quad.easeInOut'
    });

    startBtn.on('pointerdown', () => {
      sounds.init();
      sounds.playKick('NORMAL');
      this.cameras.main.fade(250, 0, 0, 0, false, (cam, progress) => {
        if (progress === 1) {
          this.scene.start('MainScene');
        }
      });
    });
  }

  createStarfield() {
    const { width, height } = this.scale;
    const starGraphics = this.add.graphics();
    for (let i = 0; i < 60; i++) {
      const x = Phaser.Math.Between(0, width);
      const y = Phaser.Math.Between(0, height);
      const r = Phaser.Math.FloatBetween(0.5, 2.0);
      const a = Phaser.Math.FloatBetween(0.2, 0.9);
      starGraphics.fillStyle(0xffffff, a);
      starGraphics.fillCircle(x, y, r);
    }
  }
}

// ==========================================
// 5. MainScene (ゲーム本編)
// ==========================================
class MainScene extends Phaser.Scene {
  constructor() {
    super({ key: 'MainScene' });
  }

  create() {
    const { width, height } = this.scale;
    this.score = 0;
    this.highScore = parseInt(localStorage.getItem('choujin_soccer_highscore') || localStorage.getItem('space_kicker_highscore') || '0', 10);
    this.wave = 1;
    this.combo = 0;
    this.comboTimer = 0;
    this.isGameOver = false;

    // パワーアップストック: [{ type: 'BOMB', count: 3 }]
    this.powerUpStock = [];

    // 背景描画
    this.createSpaceBackground();

    // 防衛ゴールライン (y: 770)
    this.goalY = height - 84;
    this.createDefenseLine();

    // キッカー発射台 (x: 240, y: 780)
    this.kickerX = width / 2;
    this.kickerY = this.goalY + 20;
    this.kicker = this.add.sprite(this.kickerX, this.kickerY, 'kicker_pedestal').setScale(1.1);

    // グループ作成
    this.balls = this.physics.add.group();
    this.enemies = this.physics.add.group();
    this.items = this.physics.add.group();

    // 照準ガイドライン
    this.aimGraphics = this.add.graphics();
    this.isAiming = false;
    this.aimStartPos = new Phaser.Math.Vector2();
    this.aimCurrentPos = new Phaser.Math.Vector2();

    // UI作成
    this.createUI();

    // 入力イベント
    this.input.on('pointerdown', this.onPointerDown, this);
    this.input.on('pointermove', this.onPointerMove, this);
    this.input.on('pointerup', this.onPointerUp, this);

    // 物理コリジョン設定 (画面下部以外をワールド境界として反射)
    this.physics.world.setBounds(0, 0, width, height + 120);

    // 敵とボールの衝突判定（Overlapベースで密集時・超高速時でも100%確実にダメージ＆全方位反射）
    this.physics.add.overlap(
      this.balls,
      this.enemies,
      this.handleBallEnemyOverlap,
      null,
      this
    );

    // アイテム取得判定 (Overlap)
    this.physics.add.overlap(this.balls, this.items, this.handleBallItemOverlap, null, this);

    // ウェーブ・敵出現タイマー
    this.enemySpawnTimer = 0;
    this.spawnInterval = 2200; // ms
    this.waveTimer = this.time.addEvent({
      delay: 15000,
      callback: this.nextWave,
      callbackScope: this,
      loop: true
    });
  }

  createSpaceBackground() {
    const { width, height } = this.scale;
    // グリッドライン
    this.gridGraphics = this.add.graphics();
    this.gridGraphics.lineStyle(1, 0x1e293b, 0.4);
    for (let x = 0; x < width; x += 40) {
      this.gridGraphics.moveTo(x, 0);
      this.gridGraphics.lineTo(x, height);
    }
    for (let y = 0; y < height; y += 40) {
      this.gridGraphics.moveTo(0, y);
      this.gridGraphics.lineTo(width, y);
    }
    this.gridGraphics.strokePath();

    // 流れる星
    this.stars = [];
    for (let i = 0; i < 45; i++) {
      const star = this.add.circle(
        Phaser.Math.Between(0, width),
        Phaser.Math.Between(0, height),
        Phaser.Math.FloatBetween(0.6, 2.2),
        0x38bdf8,
        Phaser.Math.FloatBetween(0.2, 0.8)
      );
      this.stars.push({
        obj: star,
        speed: Phaser.Math.FloatBetween(0.4, 2.0)
      });
    }
  }

  createDefenseLine() {
    const { width } = this.scale;
    this.defenseGraphics = this.add.graphics();
    this.defenseGraphics.lineStyle(3, 0xef4444, 0.9);
    this.defenseGraphics.moveTo(0, this.goalY);
    this.defenseGraphics.lineTo(width, this.goalY);
    this.defenseGraphics.strokePath();

    // ネオン発光バー
    this.add.text(width / 2, this.goalY - 12, '🚨 DEFENSE LINE 🚨', {
      fontSize: '11px',
      fontWeight: '800',
      color: '#f87171'
    }).setOrigin(0.5);
  }

  createUI() {
    const { width } = this.scale;

    // トップバー背景
    const topBar = this.add.graphics();
    topBar.fillStyle(0x0f172a, 0.85);
    topBar.fillRect(0, 0, width, 56);
    topBar.lineStyle(1, 0x334155, 1);
    topBar.moveTo(0, 56);
    topBar.lineTo(width, 56);
    topBar.strokePath();

    // スコア
    this.scoreText = this.add.text(16, 12, 'SCORE: 0', {
      fontSize: '18px',
      fontWeight: '900',
      color: '#38bdf8'
    });

    // ウェーブ
    this.waveText = this.add.text(width / 2, 12, 'WAVE 1', {
      fontSize: '18px',
      fontWeight: '900',
      color: '#facc15'
    }).setOrigin(0.5, 0);

    // ハイスコア
    this.highScoreText = this.add.text(width - 16, 12, `HI: ${this.highScore}`, {
      fontSize: '16px',
      fontWeight: '800',
      color: '#94a3b8'
    }).setOrigin(1, 0);

    // 装填中特殊弾UIバッジ
    this.stockBadge = this.add.container(width / 2, this.kickerY - 45);
    this.stockBadgeBg = this.add.graphics();
    this.stockBadgeText = this.add.text(0, 0, '', {
      fontSize: '13px',
      fontWeight: '800',
      color: '#ffffff'
    }).setOrigin(0.5);
    this.stockBadge.add([this.stockBadgeBg, this.stockBadgeText]);
    this.stockBadge.setVisible(false);

    // コンボ表示用
    this.comboText = this.add.text(width / 2, 180, '', {
      fontSize: '32px',
      fontWeight: '900',
      color: '#f43f5e',
      stroke: '#ffffff',
      strokeThickness: 4,
      shadow: { color: '#f43f5e', fill: true, blur: 15 }
    }).setOrigin(0.5).setAlpha(0);
  }

  update(time, delta) {
    if (this.isGameOver) return;

    // 背景星の移動
    const { height } = this.scale;
    this.stars.forEach(s => {
      s.obj.y += s.speed;
      if (s.obj.y > height) {
        s.obj.y = 0;
        s.obj.x = Phaser.Math.Between(0, this.scale.width);
      }
    });

    // コンボタイマー減衰
    if (this.combo > 0) {
      this.comboTimer -= delta;
      if (this.comboTimer <= 0) {
        this.combo = 0;
        this.tweens.add({
          targets: this.comboText,
          alpha: 0,
          scale: 0.5,
          duration: 200
        });
      }
    }

    // 敵の出現管理
    this.enemySpawnTimer += delta;
    if (this.enemySpawnTimer >= this.spawnInterval) {
      this.enemySpawnTimer = 0;
      this.spawnEnemyWave();
    }

    // 敵の移動＆ゴールライン突破チェック
    this.enemies.getChildren().forEach(enemy => {
      if (!enemy.active || !enemy.body) return;
      if (enemy.updateAI) enemy.updateAI(time, delta);
      if (enemy.active && enemy.y + enemy.height * 0.3 >= this.goalY) {
        this.triggerGameOver();
      }
    });

    // ボールの寿命＆挙動管理
    this.balls.getChildren().forEach(ball => {
      ball.updateBall(time, delta);
    });

    // アイテムの更新
    this.items.getChildren().forEach(item => {
      item.y += 0.8;
      if (item.y > this.goalY) {
        item.destroy();
      }
    });

    // 照準線の描画
    this.drawAimGuide();
  }

  // ====================
  // 操作 (直感ダイレクトエイム & タップ連射)
  // ====================
  onPointerDown(pointer) {
    if (this.isGameOver) return;
    this.isAiming = true;
    this.aimStartPos.set(pointer.x, pointer.y);
    this.aimCurrentPos.set(pointer.x, pointer.y);
  }

  onPointerMove(pointer) {
    if (!this.isAiming) return;
    this.aimCurrentPos.set(pointer.x, pointer.y);
  }

  onPointerUp(pointer) {
    if (!this.isAiming || this.isGameOver) return;
    this.isAiming = false;
    this.aimGraphics.clear();

    const dx = this.aimCurrentPos.x - this.aimStartPos.x;
    const dy = this.aimCurrentPos.y - this.aimStartPos.y;
    const dragDistance = Math.sqrt(dx * dx + dy * dy);

    let launchAngle;
    let speed;

    if (dragDistance < 12) {
      // 【タップ操作】発射台からタップ位置へ向けて直接キック！(画面をポンポン連打でマシンガン連射)
      const tapDx = pointer.x - this.kickerX;
      let tapDy = pointer.y - this.kickerY;
      if (tapDy > -20) tapDy = -20; // 常に上方向

      launchAngle = Math.atan2(tapDy, tapDx);
      launchAngle = Phaser.Math.Clamp(launchAngle, -Math.PI * 0.95, -Math.PI * 0.05);
      speed = 1000;
    } else {
      // 【ダイレクトドラッグ】画面のどこでも指をスワイプした方向へ飛ばす
      let shootDx = dx;
      let shootDy = dy;
      if (shootDy > -10) {
        shootDy = -Math.max(Math.abs(shootDy), 20); // 下向き操作も上向きに補正
      }

      launchAngle = Math.atan2(shootDy, shootDx);
      launchAngle = Phaser.Math.Clamp(launchAngle, -Math.PI * 0.95, -Math.PI * 0.05);
      speed = Phaser.Math.Clamp(dragDistance * 9.0, 750, 1500);
    }

    this.launchBall(launchAngle, speed);
  }

  drawAimGuide() {
    this.aimGraphics.clear();
    if (!this.isAiming || this.isGameOver) return;

    const dx = this.aimCurrentPos.x - this.aimStartPos.x;
    const dy = this.aimCurrentPos.y - this.aimStartPos.y;
    const dragDistance = Math.sqrt(dx * dx + dy * dy);

    let launchAngle;
    if (dragDistance < 12) {
      // タップ待機時: キッカーからタッチ位置への角度
      const tapDx = this.aimStartPos.x - this.kickerX;
      let tapDy = this.aimStartPos.y - this.kickerY;
      if (tapDy > -20) tapDy = -20;
      launchAngle = Math.atan2(tapDy, tapDx);
      launchAngle = Phaser.Math.Clamp(launchAngle, -Math.PI * 0.95, -Math.PI * 0.05);
    } else {
      // ドラッグ中: 指のスワイプ方向
      let shootDx = dx;
      let shootDy = dy;
      if (shootDy > -10) {
        shootDy = -Math.max(Math.abs(shootDy), 20);
      }
      launchAngle = Math.atan2(shootDy, shootDx);
      launchAngle = Phaser.Math.Clamp(launchAngle, -Math.PI * 0.95, -Math.PI * 0.05);
    }

    const currentType = this.getCurrentBallType();
    let guideColor = 0x38bdf8;
    if (currentType === 'BOMB') guideColor = 0xef4444;
    else if (currentType === 'FIRE') guideColor = 0xf97316;
    else if (currentType === 'THUNDER') guideColor = 0xeab308;

    // 1. 最下部キッカーから上空へ向けて弾道予測線（点線＋壁反射）を描画
    let curX = this.kickerX;
    let curY = this.kickerY - 15;
    let dirX = Math.cos(launchAngle);
    let dirY = Math.sin(launchAngle);
    const stepSize = 18;
    const totalSteps = dragDistance < 12 ? 20 : Math.min(Math.floor(dragDistance / 3.5) + 10, 30);

    for (let i = 1; i <= totalSteps; i++) {
      curX += dirX * stepSize;
      curY += dirY * stepSize;

      // 左右壁の反射シミュレーション
      if (curX <= 18) {
        curX = 18 + (18 - curX);
        dirX *= -1;
      } else if (curX >= this.scale.width - 18) {
        curX = (this.scale.width - 18) - (curX - (this.scale.width - 18));
        dirX *= -1;
      }

      if (curY <= 15) break; // 上端到達

      const alpha = Math.max(0.25, 1 - (i / totalSteps) * 0.7);
      const size = Math.max(2, 4.5 - (i / totalSteps) * 2.2);

      this.aimGraphics.fillStyle(guideColor, alpha);
      this.aimGraphics.fillCircle(curX, curY, size);
    }

    // 2. ドラッグ中の操作線（指を動かした位置に表示）
    if (dragDistance >= 12) {
      this.aimGraphics.lineStyle(2.5, guideColor, 0.6);
      this.aimGraphics.strokeLineShape(new Phaser.Geom.Line(
        this.aimStartPos.x, this.aimStartPos.y,
        this.aimCurrentPos.x, this.aimCurrentPos.y
      ));

      // タッチ開始点と現在の指先サークル
      this.aimGraphics.fillStyle(0xffffff, 0.4);
      this.aimGraphics.fillCircle(this.aimStartPos.x, this.aimStartPos.y, 5);
      this.aimGraphics.fillStyle(guideColor, 0.6);
      this.aimGraphics.fillCircle(this.aimCurrentPos.x, this.aimCurrentPos.y, 8);
    }
  }

  getCurrentBallType() {
    if (this.powerUpStock.length > 0) {
      return this.powerUpStock[0].type;
    }
    return 'NORMAL';
  }

  consumeBallStock() {
    if (this.powerUpStock.length > 0) {
      this.powerUpStock[0].count--;
      if (this.powerUpStock[0].count <= 0) {
        this.powerUpStock.shift();
      }
      this.updateStockUI();
    }
  }

  updateStockUI() {
    if (this.powerUpStock.length > 0) {
      const stock = this.powerUpStock[0];
      let icon = '💣';
      let color = 0xef4444;
      if (stock.type === 'FIRE') { icon = '🔥'; color = 0xf97316; }
      if (stock.type === 'THUNDER') { icon = '⚡'; color = 0xeab308; }

      this.stockBadgeBg.clear();
      this.stockBadgeBg.fillStyle(color, 0.9);
      this.stockBadgeBg.fillRoundedRect(-40, -14, 80, 28, 14);
      this.stockBadgeText.setText(`${icon} × ${stock.count}`);
      this.stockBadge.setVisible(true);
    } else {
      this.stockBadge.setVisible(false);
    }
  }

  launchBall(angle, speed, overrideType = null, startX = null, startY = null) {
    const ballType = overrideType || this.getCurrentBallType();
    if (!overrideType) {
      this.consumeBallStock();
    }

    const sx = startX !== null ? startX : this.kickerX;
    const sy = startY !== null ? startY : this.kickerY - 15;

    let textureKey = 'ball_normal';
    if (ballType === 'BOMB') textureKey = 'ball_bomb';
    if (ballType === 'FIRE') textureKey = 'ball_fire';
    if (ballType === 'THUNDER') textureKey = 'ball_thunder';

    const ball = this.balls.create(sx, sy, textureKey);
    ball.ballType = ballType;
    ball.bouncesLeft = ballType === 'FIRE' ? 15 : 8;
    ball.hitCooldowns = new Map(); // 同一敵への超短時間多重判定防止マップ
    
    // 重力完全無効化・十分な大きさの円形コリジョン・完全弾性反発
    ball.body.allowGravity = false;
    const r = ballType === 'FIRE' ? 22 : 18;
    ball.body.setCircle(r, (ball.width - r * 2) / 2, (ball.height - r * 2) / 2);
    ball.setCollideWorldBounds(true);
    ball.setBounce(1.0, 1.0);

    const vx = Math.cos(angle) * speed;
    const vy = Math.sin(angle) * speed;
    ball.setVelocity(vx, vy);

    // 発射音
    sounds.playKick(ballType);

    // 発射アニメーション
    this.tweens.add({
      targets: this.kicker,
      y: this.kickerY + 6,
      duration: 60,
      yoyo: true
    });

    // ボール毎の固有更新
    ball.updateBall = (time, delta) => {
      // 画面最下部を抜けたら消滅
      if (ball.y > this.goalY + 40) {
        this.createBallVanishEffect(ball.x, ball.y, ballType);
        ball.destroy();
        return;
      }

      // ワールド境界バウンドで寿命減少
      if (ball.body.blocked.left || ball.body.blocked.right || ball.body.blocked.up) {
        ball.bouncesLeft--;
        this.createSparkEffect(ball.x, ball.y, 4, 'spark_blue');
        if (ball.bouncesLeft <= 0) {
          this.createBallVanishEffect(ball.x, ball.y, ballType);
          ball.destroy();
        }
      }
    };
  }

  // ====================
  // 敵AI & 出現システム
  // ====================
  spawnEnemyWave() {
    const { width } = this.scale;
    // ボス出現条件（ウェーブ5の倍数でまだボスがいない場合）
    if (this.wave % 5 === 0 && !this.enemies.getChildren().some(e => e.active && e.enemyType === 'BOSS')) {
      this.spawnBoss();
      return;
    }

    // 敵数（最大5スロットで安全に出現）
    const count = Phaser.Math.Between(2, Math.min(2 + Math.floor(this.wave * 0.7), 5));
    const availableSlots = [width * 0.15, width * 0.32, width * 0.5, width * 0.68, width * 0.85];
    Phaser.Utils.Array.Shuffle(availableSlots);

    for (let i = 0; i < count; i++) {
      // スロットから安全に取得（配列外参照によるNaN発生を完全防止）
      const x = availableSlots[i] !== undefined ? availableSlots[i] : Phaser.Math.Between(width * 0.15, width * 0.85);
      const rand = Math.random();
      let type = 'ZAKO';

      if (this.wave >= 2 && rand < 0.3) type = 'SPEED';
      else if (this.wave >= 3 && rand < 0.6) type = 'UFO';
      else if (this.wave >= 4 && rand < 0.85) type = 'GIANT';

      this.spawnSingleEnemy(x, -30 - (i * 22), type);
    }
  }

  spawnSingleEnemy(x, y, type) {
    let texture = 'enemy_zako';
    let hp = 2 + Math.floor(this.wave * 0.8);
    let speed = 25 + Math.min(this.wave * 2, 40);

    if (type === 'SPEED') {
      texture = 'enemy_speed';
      hp = 1 + Math.floor(this.wave * 0.4);
      speed = 65 + Math.min(this.wave * 4, 70);
    } else if (type === 'UFO') {
      texture = 'enemy_ufo';
      hp = 4 + Math.floor(this.wave * 1.2);
      speed = 22 + this.wave;
    } else if (type === 'GIANT') {
      texture = 'enemy_giant';
      hp = 12 + Math.floor(this.wave * 2.5);
      speed = 14 + this.wave * 0.5;
    }

    const enemy = this.enemies.create(x, y, texture);
    enemy.id = 'enemy_' + Phaser.Math.RND.uuid(); // 一意のID
    enemy.enemyType = type;
    enemy.maxHp = hp;
    enemy.hp = hp;
    enemy.baseSpeed = speed;
    enemy.startX = x;
    enemy.timeOffset = Math.random() * 1000;
    enemy.shield = type === 'UFO' ? 1 : 0;

    // 物理ボディ設定 (円形当たり判定をしっかり確保)
    const radius = type === 'GIANT' ? 26 : 20;
    enemy.body.setCircle(radius, (enemy.width - radius * 2) / 2, (enemy.height - radius * 2) / 2);

    // HPバー用グラフィックス
    enemy.hpBar = this.add.graphics();

    // 固有AIロジック
    enemy.updateAI = (time, delta) => {
      if (!enemy.active || !enemy.body) return;
      const dt = delta / 1000;
      if (type === 'SPEED') {
        enemy.y += enemy.baseSpeed * dt;
        enemy.x = enemy.startX + Math.sin((time + enemy.timeOffset) * 0.006) * 45;
      } else if (type === 'UFO') {
        enemy.y += enemy.baseSpeed * dt;
        enemy.x = enemy.startX + Math.cos((time + enemy.timeOffset) * 0.003) * 60;
      } else {
        enemy.y += enemy.baseSpeed * dt;
      }

      // HPバー描画
      if (enemy.hpBar && enemy.active && enemy.hp < enemy.maxHp) {
        enemy.hpBar.clear();
        const barW = enemy.width * 0.9;
        const barH = 5;
        const barX = enemy.x - barW / 2;
        const barY = enemy.y - enemy.height * 0.5 - 8;

        enemy.hpBar.fillStyle(0x000000, 0.6);
        enemy.hpBar.fillRect(barX, barY, barW, barH);

        const healthRatio = Phaser.Math.Clamp(enemy.hp / enemy.maxHp, 0, 1);
        enemy.hpBar.fillStyle(healthRatio > 0.4 ? 0x22c55e : 0xef4444, 1);
        enemy.hpBar.fillRect(barX, barY, barW * healthRatio, barH);
      } else if (enemy.hpBar) {
        enemy.hpBar.clear();
      }
    };
  }

  spawnBoss() {
    sounds.playWarning();
    const { width } = this.scale;
    const hp = 40 + this.wave * 8;
    const boss = this.enemies.create(width / 2, -60, 'enemy_boss');
    boss.id = 'boss_' + Phaser.Math.RND.uuid();
    boss.enemyType = 'BOSS';
    boss.maxHp = hp;
    boss.hp = hp;
    boss.baseSpeed = 10;
    boss.startX = width / 2;
    boss.timeOffset = 0;
    boss.shield = 0;
    boss.summonTimer = 0;

    const radius = 36;
    boss.body.setCircle(radius, (boss.width - radius * 2) / 2, (boss.height - radius * 2) / 2);

    boss.hpBar = this.add.graphics();

    // ボス警告バナー
    const warningText = this.add.text(width / 2, 220, '⚠️ BOSS APPROACHING ⚠️', {
      fontSize: '24px',
      fontWeight: '900',
      color: '#ef4444',
      stroke: '#ffffff',
      strokeThickness: 3
    }).setOrigin(0.5);

    this.tweens.add({
      targets: warningText,
      alpha: 0,
      scale: 1.3,
      duration: 1800,
      onComplete: () => warningText.destroy()
    });

    boss.updateAI = (time, delta) => {
      if (!boss.active || !boss.body) return;
      const dt = delta / 1000;
      if (boss.y < 130) {
        boss.y += 40 * dt;
      } else {
        boss.y += boss.baseSpeed * dt;
        boss.x = boss.startX + Math.sin(time * 0.002) * (width * 0.35);
      }

      // 取り巻き召喚
      boss.summonTimer += delta;
      if (boss.summonTimer > 4500 && boss.y > 50) {
        boss.summonTimer = 0;
        this.spawnSingleEnemy(boss.x + Phaser.Math.Between(-60, 60), boss.y + 40, 'ZAKO');
      }

      // HPバー描画 (大)
      if (boss.hpBar && boss.active) {
        boss.hpBar.clear();
        const barW = width * 0.75;
        const barH = 10;
        const barX = width / 2 - barW / 2;
        const barY = 64;

        boss.hpBar.fillStyle(0x0f172a, 0.8);
        boss.hpBar.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);

        const healthRatio = Phaser.Math.Clamp(boss.hp / boss.maxHp, 0, 1);
        boss.hpBar.fillStyle(0xf43f5e, 1);
        boss.hpBar.fillRect(barX, barY, barW * healthRatio, barH);
      }
    };
  }

  nextWave() {
    if (this.isGameOver) return;
    this.wave++;
    this.waveText.setText(`WAVE ${this.wave}`);
    this.spawnInterval = Math.max(1200, 2200 - this.wave * 120);

    // ウェーブアップ演出
    const waveNotice = this.add.text(this.scale.width / 2, 260, `WAVE ${this.wave}!`, {
      fontSize: '36px',
      fontWeight: '900',
      color: '#facc15',
      stroke: '#000000',
      strokeThickness: 6
    }).setOrigin(0.5).setAlpha(0);

    this.tweens.add({
      targets: waveNotice,
      alpha: 1,
      scale: 1.2,
      duration: 400,
      yoyo: true,
      hold: 600,
      onComplete: () => waveNotice.destroy()
    });
  }

  // ====================
  // 敵との衝突判定 (Overlap & 法線反射)
  // ====================
  handleBallEnemyOverlap(ball, enemy) {
    if (!ball.active || !enemy.active || !enemy.body || enemy.hp <= 0) return;

    // 敵IDによる短時間多重ヒット防止（25msクールダウン）
    const now = this.time.now;
    if (ball.hitCooldowns && enemy.id && ball.hitCooldowns.has(enemy.id)) {
      const lastHit = ball.hitCooldowns.get(enemy.id);
      if (now - lastHit < 25) return;
    }
    if (!ball.hitCooldowns) ball.hitCooldowns = new Map();
    if (enemy.id) ball.hitCooldowns.set(enemy.id, now);

    // UFOシールド判定
    if (enemy.shield > 0) {
      enemy.shield--;
      sounds.playHit(1);
      this.createSparkEffect(enemy.x, enemy.y, 8, 'spark_blue');
      this.showDamageText(enemy.x, enemy.y, 'GUARD!', '#38bdf8');
      this.reflectBallFromEnemy(ball, enemy);
      return;
    }

    // コンボ加算
    this.combo++;
    this.comboTimer = 2200;
    this.showComboUI();

    // ボールタイプごとの挙動
    if (ball.ballType === 'BOMB') {
      this.triggerBombExplosion(ball.x, ball.y);
      ball.destroy();
      return;
    }

    if (ball.ballType === 'THUNDER') {
      this.triggerThunderSplit(ball);
      this.damageEnemy(enemy, 2, ball);
      ball.destroy();
      return;
    }

    if (ball.ballType === 'FIRE') {
      // ファイヤーボール: 反射せず敵を貫通直進
      this.damageEnemy(enemy, 3, ball);
      sounds.playKick('FIRE');
      this.cameras.main.shake(80, 0.008);
      return;
    }

    // NORMALボール: ダメージ ＋ 敵中心からの法線ベクトルでカキーンと全方位反射！
    this.damageEnemy(enemy, 1, ball);
    sounds.playHit(this.combo);
    this.reflectBallFromEnemy(ball, enemy);
  }

  // 敵中心からの法線ベクトルによる完全反射
  reflectBallFromEnemy(ball, enemy) {
    ball.bouncesLeft--;
    if (ball.bouncesLeft <= 0) {
      this.createBallVanishEffect(ball.x, ball.y, ball.ballType);
      ball.destroy();
      return;
    }

    // 敵の中心からボールの中心へ向かう反発角
    const reflectAngle = Phaser.Math.Angle.Between(enemy.x, enemy.y, ball.x, ball.y);
    const currentSpeed = Math.max(800, ball.body.velocity.length());
    ball.setVelocity(Math.cos(reflectAngle) * currentSpeed, Math.sin(reflectAngle) * currentSpeed);
    this.createSparkEffect(ball.x, ball.y, 4, 'spark_blue');
  }

  // ヒットストップ効果（大ヒット時の手応え演出）
  triggerHitStop(duration = 40) {
    this.physics.world.pause();
    this.time.delayedCall(duration, () => {
      if (!this.isGameOver) {
        this.physics.world.resume();
      }
    });
  }

  damageEnemy(enemy, dmg, sourceBall) {
    enemy.hp -= dmg;
    this.showDamageText(enemy.x, enemy.y, `-${dmg}`, '#ffffff');

    // ヒットフラッシュ
    enemy.setTint(0xffffff);
    this.time.delayedCall(70, () => {
      if (enemy.active) enemy.clearTint();
    });

    // スコア加算
    const pts = dmg * 10 * Math.max(1, Math.floor(this.combo * 0.5));
    this.addScore(pts);

    // 撃破判定
    if (enemy.hp <= 0) {
      this.destroyEnemy(enemy);
    }
  }

  destroyEnemy(enemy) {
    sounds.playKill();
    this.createExplosionParticles(enemy.x, enemy.y, enemy.enemyType === 'BOSS' ? 30 : 12);

    if (enemy.enemyType === 'BOSS') {
      this.triggerHitStop(120);
      this.cameras.main.shake(350, 0.025);
      this.addScore(1000);
    } else if (enemy.enemyType === 'GIANT') {
      this.triggerHitStop(40);
      this.cameras.main.shake(120, 0.012);
      this.addScore(150);
      if (Math.random() < 0.6) this.spawnPowerUpItem(enemy.x, enemy.y);
    } else {
      this.addScore(50);
      // ドロップ判定 (28% の確率)
      if (Math.random() < 0.28) {
        this.spawnPowerUpItem(enemy.x, enemy.y);
      }
    }

    // HPバーの安全破棄と物理ボディの無効化（ゴースト化防止）
    if (enemy.hpBar) {
      enemy.hpBar.destroy();
      enemy.hpBar = null;
    }
    enemy.disableBody(true, true);
    enemy.destroy();
  }

  // ボム爆発処理 (範囲ダメージ)
  triggerBombExplosion(x, y) {
    sounds.playExplosion();
    this.triggerHitStop(60);
    this.cameras.main.shake(260, 0.03);
    this.createExplosionParticles(x, y, 28);

    const radius = 130;
    this.enemies.getChildren().forEach(enemy => {
      const dist = Phaser.Math.Distance.Between(x, y, enemy.x, enemy.y);
      if (dist <= radius) {
        const bombDmg = 5;
        this.damageEnemy(enemy, bombDmg, null);
      }
    });
  }

  // サンダー分裂処理 (3方向に放電拡散)
  triggerThunderSplit(ball) {
    sounds.playThunder();
    this.createSparkEffect(ball.x, ball.y, 15, 'spark_yellow');
    const baseAngle = ball.body.velocity.angle();

    [-0.5, 0, 0.5].forEach(offsetAngle => {
      this.launchBall(baseAngle + offsetAngle, 900, 'NORMAL', ball.x, ball.y);
    });
  }

  // ====================
  // アイテム・パワーアップ
  // ====================
  spawnPowerUpItem(x, y) {
    const types = ['BOMB', 'FIRE', 'THUNDER'];
    const selected = Phaser.Utils.Array.GetRandom(types);

    let tex = 'item_bomb';
    if (selected === 'FIRE') tex = 'item_fire';
    if (selected === 'THUNDER') tex = 'item_thunder';

    const item = this.items.create(x, y, tex);
    item.itemType = selected;

    this.tweens.add({
      targets: item,
      scaleX: 1.2,
      scaleY: 1.2,
      duration: 400,
      yoyo: true,
      repeat: -1
    });
  }

  handleBallItemOverlap(ball, item) {
    if (!item.active) return;
    sounds.playPowerUp();
    this.createSparkEffect(item.x, item.y, 16, 'spark_yellow');

    const type = item.itemType;
    let label = '💣 BOMB +3!';
    if (type === 'FIRE') label = '🔥 FIRE +3!';
    if (type === 'THUNDER') label = '⚡ THUNDER +3!';

    this.showDamageText(item.x, item.y, label, '#facc15');

    // ストックに追加
    const existing = this.powerUpStock.find(s => s.type === type);
    if (existing) {
      existing.count += 3;
    } else {
      this.powerUpStock.push({ type, count: 3 });
    }
    this.updateStockUI();

    item.destroy();
  }

  // ====================
  // スコア・コンボ・演出
  // ====================
  addScore(pts) {
    this.score += pts;
    this.scoreText.setText(`SCORE: ${this.score}`);
    if (this.score > this.highScore) {
      this.highScore = this.score;
      this.highScoreText.setText(`HI: ${this.highScore}`);
      localStorage.setItem('choujin_soccer_highscore', this.highScore);
    }
  }

  showComboUI() {
    if (this.combo >= 2) {
      this.comboText.setText(`${this.combo} COMBO!`);
      this.comboText.setAlpha(1).setScale(1.2);
      this.tweens.add({
        targets: this.comboText,
        scaleX: 1.0,
        scaleY: 1.0,
        duration: 150
      });
    }
  }

  showDamageText(x, y, text, color = '#ffffff') {
    const t = this.add.text(x, y, text, {
      fontSize: '16px',
      fontWeight: '900',
      color: color,
      stroke: '#000000',
      strokeThickness: 3
    }).setOrigin(0.5);

    this.tweens.add({
      targets: t,
      y: y - 30,
      alpha: 0,
      scale: 1.2,
      duration: 600,
      onComplete: () => t.destroy()
    });
  }

  createSparkEffect(x, y, count, texture) {
    for (let i = 0; i < count; i++) {
      const spark = this.add.sprite(x, y, texture);
      const angle = Math.random() * Math.PI * 2;
      const speed = Phaser.Math.Between(40, 160);
      const vx = Math.cos(angle) * speed;
      const vy = Math.sin(angle) * speed;

      this.tweens.add({
        targets: spark,
        x: x + vx * 0.4,
        y: y + vy * 0.4,
        alpha: 0,
        scale: 0.2,
        duration: Phaser.Math.Between(250, 450),
        onComplete: () => spark.destroy()
      });
    }
  }

  createExplosionParticles(x, y, count) {
    const textures = ['spark_red', 'spark_orange', 'spark_yellow', 'spark_white'];
    for (let i = 0; i < count; i++) {
      const tex = Phaser.Utils.Array.GetRandom(textures);
      const p = this.add.sprite(x, y, tex);
      const angle = Math.random() * Math.PI * 2;
      const dist = Phaser.Math.Between(30, 120);

      this.tweens.add({
        targets: p,
        x: x + Math.cos(angle) * dist,
        y: y + Math.sin(angle) * dist,
        alpha: 0,
        scale: Phaser.Math.FloatBetween(0.1, 0.4),
        duration: Phaser.Math.Between(350, 650),
        ease: 'Cubic.easeOut',
        onComplete: () => p.destroy()
      });
    }
  }

  createBallVanishEffect(x, y, type) {
    let tex = 'spark_blue';
    if (type === 'BOMB') tex = 'spark_red';
    if (type === 'FIRE') tex = 'spark_orange';
    if (type === 'THUNDER') tex = 'spark_yellow';
    this.createSparkEffect(x, y, 6, tex);
  }

  // ====================
  // ゲームオーバー
  // ====================
  triggerGameOver() {
    if (this.isGameOver) return;
    this.isGameOver = true;
    sounds.playGameOver();

    this.cameras.main.shake(500, 0.035);
    this.cameras.main.fade(800, 15, 23, 42, false, (cam, progress) => {
      if (progress === 1) {
        this.scene.start('GameOverScene', {
          score: this.score,
          highScore: this.highScore,
          wave: this.wave
        });
      }
    });
  }
}

// ==========================================
// 6. GameOverScene (結果画面 & Xシェア)
// ==========================================
class GameOverScene extends Phaser.Scene {
  constructor() {
    super({ key: 'GameOverScene' });
  }

  init(data) {
    this.finalScore = data.score || 0;
    this.highScore = data.highScore || 0;
    this.wave = data.wave || 1;
    this.isNewRecord = this.finalScore >= this.highScore && this.finalScore > 0;
  }

  create() {
    const { width, height } = this.scale;

    // ゲームオーバータイトル
    this.add.text(width / 2, height * 0.18, 'GAME OVER', {
      fontSize: '44px',
      fontWeight: '900',
      color: '#ef4444',
      stroke: '#000000',
      strokeThickness: 6,
      shadow: { color: '#ef4444', fill: true, blur: 25 }
    }).setOrigin(0.5);

    // リザルトパネル
    const panel = this.add.graphics();
    panel.fillStyle(0x0f172a, 0.9);
    panel.lineStyle(2, 0x38bdf8, 0.8);
    panel.fillRoundedRect(width * 0.1, height * 0.28, width * 0.8, 220, 16);
    panel.strokeRoundedRect(width * 0.1, height * 0.28, width * 0.8, 220, 16);

    if (this.isNewRecord) {
      const newRecBadge = this.add.text(width / 2, height * 0.28 + 26, '🎉 NEW RECORD! 🎉', {
        fontSize: '18px',
        fontWeight: '900',
        color: '#facc15'
      }).setOrigin(0.5);

      this.tweens.add({
        targets: newRecBadge,
        scaleX: 1.15,
        scaleY: 1.15,
        duration: 500,
        yoyo: true,
        repeat: -1
      });
    }

    this.add.text(width / 2, height * 0.38, 'SCORE', {
      fontSize: '16px',
      fontWeight: '700',
      color: '#94a3b8'
    }).setOrigin(0.5);

    this.add.text(width / 2, height * 0.44, `${this.finalScore}`, {
      fontSize: '42px',
      fontWeight: '900',
      color: '#38bdf8'
    }).setOrigin(0.5);

    this.add.text(width / 2, height * 0.50, `REACHED WAVE ${this.wave}  |  BEST: ${this.highScore}`, {
      fontSize: '14px',
      fontWeight: '700',
      color: '#cbd5e1'
    }).setOrigin(0.5);

    // RETRYボタン
    const retryBtn = this.add.container(width / 2, height * 0.62);
    const retryBg = this.add.graphics();
    retryBg.fillStyle(0x0284c7, 1);
    retryBg.lineStyle(2, 0x38bdf8, 1);
    retryBg.fillRoundedRect(-110, -26, 220, 52, 26);
    retryBg.strokeRoundedRect(-110, -26, 220, 52, 26);

    const retryText = this.add.text(0, 0, '🔄 RETRY', {
      fontSize: '20px',
      fontWeight: '900',
      color: '#ffffff'
    }).setOrigin(0.5);

    retryBtn.add([retryBg, retryText]);
    retryBtn.setSize(220, 52);
    retryBtn.setInteractive({ useHandCursor: true });

    retryBtn.on('pointerdown', () => {
      sounds.init();
      sounds.playKick('NORMAL');
      this.scene.start('MainScene');
    });

    // X (Twitter) シェアボタン
    const shareBtn = this.add.container(width / 2, height * 0.72);
    const shareBg = this.add.graphics();
    shareBg.fillStyle(0x000000, 1);
    shareBg.lineStyle(2, 0xffffff, 0.8);
    shareBg.fillRoundedRect(-110, -24, 220, 48, 24);
    shareBg.strokeRoundedRect(-110, -24, 220, 48, 24);

    const shareText = this.add.text(0, 0, '𝕏 でスコアをシェア', {
      fontSize: '15px',
      fontWeight: '800',
      color: '#ffffff'
    }).setOrigin(0.5);

    shareBtn.add([shareBg, shareText]);
    shareBtn.setSize(220, 48);
    shareBtn.setInteractive({ useHandCursor: true });

    shareBtn.on('pointerdown', () => {
      const text = `『超人サッカー』でスコア【${this.finalScore}】(WAVE ${this.wave}) を達成！\n待ち時間ゼロで連射しまくるのが超気持ちいい！⚽⚡\n#超人サッカー #Phaser3 #ブラウザゲーム`;
      const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    });

    // タイトルへ戻る
    const titleBtn = this.add.text(width / 2, height * 0.82, 'タイトルへ戻る', {
      fontSize: '14px',
      fontWeight: '700',
      color: '#94a3b8',
      underline: true
    }).setOrigin(0.5).setInteractive({ useHandCursor: true });

    titleBtn.on('pointerdown', () => {
      this.scene.start('TitleScene');
    });
  }
}

// ==========================================
// 7. Phaser ゲーム設定・起動
// ==========================================
const config = {
  type: Phaser.AUTO,
  parent: 'game-container',
  width: 480,
  height: 854,
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  physics: {
    default: 'arcade',
    arcade: {
      gravity: { y: 0 }, // 無重力・反射物理
      fps: 120, // 120FPSサブステップで高速ボールのトンネリング（すり抜け）を完全根絶！
      fixedStep: true,
      debug: false
    }
  },
  scene: [BootScene, TitleScene, MainScene, GameOverScene],
  backgroundColor: '#000000'
};

window.addEventListener('DOMContentLoaded', () => {
  new Phaser.Game(config);
});
</script>
