    function evaluateRank(seconds, lang = currentLang) {
      const t = I18N[lang] || I18N.ja;
      if (seconds >= 120) {
        return { grade: 'S', title: t.ranks.S, color: '#00f5d4', hex: 0x00f5d4 };
      } else if (seconds >= 60) {
        return { grade: 'A', title: t.ranks.A, color: '#ffdd00', hex: 0xffdd00 };
      } else if (seconds >= 30) {
        return { grade: 'B', title: t.ranks.B, color: '#4facfe', hex: 0x4facfe };
      } else {
        return { grade: 'C', title: t.ranks.C, color: '#cbd5e1', hex: 0xcbd5e1 };
      }
    }

    function formatTime(seconds) {
      const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    /**
     * ============================================================================
     * 1. サウンド管理クラス（Web Audio API によるシンセサイザー効果音生成）
     * ============================================================================
     */
    class SoundManager {
      constructor() {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = AudioCtx ? new AudioCtx() : null;
        if (this.ctx) {
          this.masterGain = this.ctx.createGain();
          this.masterGain.gain.value = soundEnabled ? 0.3 : 0;
          this.masterGain.connect(this.ctx.destination);
        }
      }

      syncMuteState() {
        if (!this.ctx || !this.masterGain) return;
        this.masterGain.gain.setValueAtTime(soundEnabled ? 0.3 : 0, this.ctx.currentTime);
      }

      resume() {
        if (!this.ctx) return;
        this.syncMuteState();
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playClick() {
        if (!soundEnabled || !this.ctx) return;
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(560, now);
        osc.frequency.exponentialRampToValueAtTime(1120, now + 0.09);

        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.09);
      }

      playShoot() {
        if (!soundEnabled || !this.ctx) return;
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(920, now);
        osc.frequency.exponentialRampToValueAtTime(170, now + 0.08);

        gain.gain.setValueAtTime(0.24, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.08);
      }

      playHit() {
        if (!soundEnabled || !this.ctx) return;
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.05);

        gain.gain.setValueAtTime(0.28, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.05);
      }

      playSlice() {
        if (!soundEnabled || !this.ctx) return;
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(750, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.07);

        gain.gain.setValueAtTime(0.22, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.07);
      }

      playExplosion(combo = 0) {
        if (!soundEnabled || !this.ctx) return;
        this.resume();
        const now = this.ctx.currentTime;

        const pitchFactor = Math.min(2.4, 1 + Math.min(combo, 35) * 0.04);

        const bufferSize = Math.floor(this.ctx.sampleRate * 0.16);
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800 * pitchFactor, now);
        filter.frequency.exponentialRampToValueAtTime(70 * pitchFactor, now + 0.16);

        const noiseGain = this.ctx.createGain();
        noiseGain.gain.setValueAtTime(0.42, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(this.masterGain);

        noise.start(now);
        noise.stop(now + 0.16);

        if (combo >= 2) {
          const toneOsc = this.ctx.createOscillator();
          const toneGain = this.ctx.createGain();
          toneOsc.type = 'triangle';

          const noteBase = 260 * pitchFactor;
          toneOsc.frequency.setValueAtTime(noteBase, now);
          toneOsc.frequency.exponentialRampToValueAtTime(noteBase * 1.5, now + 0.11);

          toneGain.gain.setValueAtTime(0.22, now);
          toneGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

          toneOsc.connect(toneGain);
          toneGain.connect(this.masterGain);

          toneOsc.start(now);
          toneOsc.stop(now + 0.11);
        }
      }

      playGem() {
        if (!soundEnabled || !this.ctx) return;
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(1046.5, now);
        osc.frequency.setValueAtTime(1318.5, now + 0.04);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.1);
      }

      playDamage() {
        if (!soundEnabled || !this.ctx) return;
        this.resume();
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.linearRampToValueAtTime(55, now + 0.2);

        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

        osc.connect(gain);
        gain.connect(this.masterGain);

        osc.start(now);
        osc.stop(now + 0.2);
      }

      playLevelUp() {
        if (!soundEnabled || !this.ctx) return;
        this.resume();
        const now = this.ctx.currentTime;
        const notes = [523.25, 659.25, 783.99, 987.77, 1046.50];

        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const startTime = now + idx * 0.07;
          const duration = 0.25;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, startTime);

          gain.gain.setValueAtTime(0.001, startTime);
          gain.gain.linearRampToValueAtTime(0.35, startTime + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

          osc.connect(gain);
          gain.connect(this.masterGain);

          osc.start(startTime);
          osc.stop(startTime + duration);
        });
      }
    }

    /**
     * ============================================================================
     * 2. タイトルシーン（SceneTitle）
     * ============================================================================
     */
    class SceneTitle extends Phaser.Scene {
      constructor() {
        super({ key: 'SceneTitle' });
      }

      create() {
        if (!this.sys.game.sfx) {
          this.sys.game.sfx = new SoundManager();
        }
        this.sfx = this.sys.game.sfx;

        const w = this.scale.width;
        const h = this.scale.height;
        const isCompact = w < 560;
        const t = I18N[currentLang] || I18N.ja;

        // サイバーグリッド背景
        const bg = this.add.graphics();
        bg.fillGradientStyle(0x050610, 0x050610, 0x071824, 0x050b14, 1);
        bg.fillRect(0, 0, w, h);

        bg.lineStyle(1, 0x00f5d4, 0.09);
        const step = 48;
        for (let x = 0; x <= w; x += step) {
          bg.moveTo(x, 0);
          bg.lineTo(x, h);
        }
        for (let y = 0; y <= h; y += step) {
          bg.moveTo(0, y);
          bg.lineTo(w, y);
        }
        bg.strokePath();

        // 上部ヘッダーボタン群（サウンド ON/OFF ＆ 言語切替 JP/EN）
        const pillW = isCompact ? 148 : 175;
        const pillH = 42;
        const topY = 38;

        const soundBg = this.add.rectangle(20 + pillW / 2, topY, pillW, pillH, 0x0d1b2a, 0.92)
          .setStrokeStyle(1.5, soundEnabled ? 0x00f5d4 : 0x64748b, 0.85)
          .setInteractive({ useHandCursor: true });

        this.add.text(20 + pillW / 2, topY, soundEnabled ? t.soundOn : t.soundOff, {
          fontSize: isCompact ? '13px' : '15px',
          fontStyle: 'bold',
          color: soundEnabled ? '#00f5d4' : '#94a3b8'
        }).setOrigin(0.5);

        soundBg.on('pointerdown', () => {
          setSoundEnabled(!soundEnabled);
          this.sfx.syncMuteState();
          this.sfx.playClick();
          this.scene.restart();
        });

        const langBg = this.add.rectangle(w - 20 - pillW / 2, topY, pillW, pillH, 0x0d1b2a, 0.92)
          .setStrokeStyle(1.5, 0x00b4d8, 0.85)
          .setInteractive({ useHandCursor: true });

        this.add.text(w - 20 - pillW / 2, topY, `${t.langLabel} (${currentLang.toUpperCase()})`, {
          fontSize: isCompact ? '13px' : '15px',
          fontStyle: 'bold',
          color: '#e2e8f0'
        }).setOrigin(0.5);

        langBg.on('pointerdown', () => {
          const nextLang = currentLang === 'ja' ? 'en' : 'ja';
          setLanguage(nextLang);
          this.sfx.playClick();
          this.scene.restart();
        });

        // メインアイコン（🏃）＋ ネオンリング演出
        const iconY = h * 0.25;
        const ring = this.add.circle(w / 2, iconY, isCompact ? 54 : 64, 0x00f5d4, 0.12)
          .setStrokeStyle(2, 0x00f5d4, 0.55);

        const mainIcon = this.add.text(w / 2, iconY, '🏃', {
          fontSize: isCompact ? '64px' : '78px'
        }).setOrigin(0.5);

        this.tweens.add({
          targets: [mainIcon, ring],
          y: iconY - 10,
          duration: 1200,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });

        // メインタイトル
        this.add.text(w / 2, h * 0.40, t.mainTitle, {
          fontSize: isCompact ? '24px' : '36px',
          fontStyle: 'bold',
          color: '#00f5d4',
          stroke: '#002b36',
          strokeThickness: 6,
          align: 'center',
          wordWrap: { width: w - 36 }
        }).setOrigin(0.5);

        // サブ説明
        this.add.text(w / 2, h * 0.50, t.subDesc, {
          fontSize: isCompact ? '15px' : '18px',
          fontStyle: 'bold',
          color: '#ffffff',
          align: 'center',
          lineSpacing: 6,
          wordWrap: { width: Math.min(w - 40, 680) }
        }).setOrigin(0.5);

        // 操作案内ボックス
        const guideBoxW = Math.min(w - 40, 600);
        const guideBoxH = isCompact ? 68 : 60;
        const guideY = h * 0.63;

        this.add.rectangle(w / 2, guideY, guideBoxW, guideBoxH, 0x091326, 0.9)
          .setStrokeStyle(1.5, 0x00b4d8, 0.6);

        this.add.text(w / 2, guideY, `🕹️ ${t.controlsGuide}`, {
          fontSize: isCompact ? '14px' : '16px',
          fontStyle: 'bold',
          color: '#7dd3fc',
          align: 'center',
          wordWrap: { width: guideBoxW - 24 }
        }).setOrigin(0.5);

        // START ボタン
        const btnW = Math.min(w - 60, 320);
        const btnH = 62;
        const btnY = h * 0.79;

        const startBtnContainer = this.add.container(w / 2, btnY);
        const startBtnBg = this.add.rectangle(0, 0, btnW, btnH, 0x00b4d8, 0.95)
          .setStrokeStyle(3, 0x00f5d4, 1)
          .setInteractive({ useHandCursor: true });

        const startBtnTxt = this.add.text(0, 0, `▶  ${t.startBtn}`, {
          fontSize: '26px',
          fontStyle: 'bold',
          color: '#041019'
        }).setOrigin(0.5);

        startBtnContainer.add([startBtnBg, startBtnTxt]);

        this.tweens.add({
          targets: startBtnContainer,
          scaleX: 1.04,
          scaleY: 1.04,
          duration: 750,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });

        startBtnBg.on('pointerover', () => {
          startBtnBg.setFillStyle(0x00f5d4, 1);
        });
        startBtnBg.on('pointerout', () => {
          startBtnBg.setFillStyle(0x00b4d8, 0.95);
        });
        startBtnBg.on('pointerdown', () => {
          this.sfx.playLevelUp();
          this.scene.start('SceneGame');
        });
      }
    }

    /**
     * ============================================================================
     * 3. メインゲームシーン（SceneGame）
     * ============================================================================
     */
    class SceneGame extends Phaser.Scene {
      constructor() {
        super({ key: 'SceneGame' });
      }

      init() {
        if (!this.sys.game.sfx) {
          this.sys.game.sfx = new SoundManager();
        }
        this.sfx = this.sys.game.sfx;

        this.worldSize = 2400;
        this.isPausedForModal = false;
        this.isGameOver = false;
        this.elapsedSeconds = 0;
        this.killCount = 0;

        this.comboCount = 0;
        this.comboTimer = 0;
        this.maxComboTime = 1800;

        this.isDragging = false;
        this.dragStartX = 0;
        this.dragStartY = 0;
        this.dragVecX = 0;
        this.dragVecY = 0;

        this.playerStats = {
          level: 1,
          exp: 0,
          nextExp: 5,
          hp: 100,
          maxHp: 100,
          speed: 230,
          fireRate: 520,
          bulletCount: 1,
          bulletSpeed: 540,
          bulletDamage: 26,
          pierce: 1,
          magnetRadius: 130,
          orbitCount: 1,
          orbitRadius: 90,
          orbitSpeed: 3.5,
          orbitDamage: 22
        };

        this.orbitAngle = 0;
        this.lastShotTime = 0;
        this.lastDamageTime = 0;
      }

      preload() {
        this.createProceduralTextures();
      }

      createProceduralTextures() {
        if (this.textures.exists('player')) return;

        const g = this.make.graphics({ x: 0, y: 0, add: false });

        g.clear();
        g.fillStyle(0x00ffff, 0.25);
        g.fillCircle(24, 24, 22);
        g.lineStyle(3, 0x00ffff, 1);
        g.strokeCircle(24, 24, 16);
        g.fillStyle(0xffffff, 1);
        g.fillCircle(24, 24, 7);
        g.generateTexture('player', 48, 48);

        g.clear();
        g.fillStyle(0xff0066, 0.3);
        g.fillCircle(20, 20, 18);
        g.lineStyle(3, 0xff0066, 1);
        g.beginPath();
        g.moveTo(20, 4);
        g.lineTo(36, 20);
        g.lineTo(20, 36);
        g.lineTo(4, 20);
        g.closePath();
        g.strokePath();
        g.fillStyle(0xff99bb, 1);
        g.fillCircle(20, 20, 4);
        g.generateTexture('enemy_basic', 40, 40);

        g.clear();
        g.fillStyle(0xffdd00, 0.3);
        g.fillCircle(18, 18, 15);
        g.lineStyle(2.5, 0xffdd00, 1);
        g.strokeTriangle(18, 3, 33, 31, 3, 31);
        g.generateTexture('enemy_fast', 36, 36);

        g.clear();
        g.fillStyle(0xaa00ff, 0.35);
        g.fillCircle(28, 28, 25);
        g.lineStyle(4, 0xd466ff, 1);
        g.strokeCircle(28, 28, 20);
        g.lineStyle(2, 0xffffff, 0.9);
        g.strokeRect(16, 16, 24, 24);
        g.generateTexture('enemy_tank', 56, 56);

        g.clear();
        g.fillStyle(0x00ffff, 0.4);
        g.fillCircle(10, 10, 9);
        g.fillStyle(0xffffff, 1);
        g.fillCircle(10, 10, 4);
        g.generateTexture('bullet', 20, 20);

        g.clear();
        g.fillStyle(0x00ff88, 0.35);
        g.fillCircle(12, 12, 10);
        g.lineStyle(2, 0x00ff88, 1);
        g.fillStyle(0xaaffdd, 1);
        g.beginPath();
        g.moveTo(12, 3);
        g.lineTo(21, 12);
        g.lineTo(12, 21);
        g.lineTo(3, 12);
        g.closePath();
        g.fillPath();
        g.strokePath();
        g.generateTexture('gem', 24, 24);

        g.clear();
        g.fillStyle(0xffffff, 1);
        g.fillCircle(4, 4, 4);
        g.generateTexture('particle', 8, 8);

        g.clear();
        g.lineStyle(3, 0x00ffff, 1);
        g.strokeCircle(20, 20, 18);
        g.generateTexture('shockwave', 40, 40);

        g.clear();
        g.fillStyle(0x00ffff, 0.35);
        g.fillRoundedRect(0, 4, 38, 12, 6);
        g.lineStyle(2, 0x00ffff, 1);
        g.strokeRoundedRect(0, 4, 38, 12, 6);
        g.fillStyle(0xffffff, 1);
        g.fillRoundedRect(8, 7, 22, 6, 3);
        g.generateTexture('orbit_blade', 38, 20);

        g.destroy();
      }

      create() {
        this.physics.world.setBounds(0, 0, this.worldSize, this.worldSize);

        this.createCyberGrid();

        this.bullets = this.physics.add.group();
        this.enemies = this.physics.add.group();
        this.gems = this.physics.add.group();
        this.orbitGroup = this.physics.add.group();

        this.player = this.physics.add.sprite(this.worldSize / 2, this.worldSize / 2, 'player');
        this.player.setCollideWorldBounds(true);
        this.player.setCircle(16, 8, 8);
        this.player.setDepth(10);

        this.magnetRing = this.add.circle(this.player.x, this.player.y, this.playerStats.magnetRadius);
        this.magnetRing.setStrokeStyle(1, 0x00ffff, 0.18);
        this.magnetRing.setDepth(1);

        this.setupOrbitBlades();

        this.cameras.main.setBounds(0, 0, this.worldSize, this.worldSize);
        this.cameras.main.startFollow(this.player, true, 0.1, 0.1);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.wasd = this.input.keyboard.addKeys({
          up: Phaser.Input.Keyboard.KeyCodes.W,
          down: Phaser.Input.Keyboard.KeyCodes.S,
          left: Phaser.Input.Keyboard.KeyCodes.A,
          right: Phaser.Input.Keyboard.KeyCodes.D
        });

        this.setupDragControls();

        this.physics.add.overlap(this.bullets, this.enemies, this.onBulletHitEnemy, null, this);
        this.physics.add.overlap(this.player, this.enemies, this.onPlayerHitEnemy, null, this);
        this.physics.add.overlap(this.player, this.gems, this.onPlayerCollectGem, null, this);
        this.physics.add.overlap(this.orbitGroup, this.enemies, this.onOrbitHitEnemy, null, this);

        this.physics.add.collider(this.enemies, this.enemies);

        this.createHUD();

        this.spawnTimer = 0;
        this.secondTimer = 0;

        for (let i = 0; i < 7; i++) {
          this.spawnEnemy();
        }
      }

      setupDragControls() {
        this.joyBase = this.add.circle(0, 0, 44, 0x00f5d4, 0.12)
          .setStrokeStyle(2, 0x00f5d4, 0.45)
          .setScrollFactor(0)
          .setDepth(120)
          .setVisible(false);

        this.joyStick = this.add.circle(0, 0, 20, 0x00f5d4, 0.5)
          .setStrokeStyle(2, 0xffffff, 0.85)
          .setScrollFactor(0)
          .setDepth(121)
          .setVisible(false);

        const maxJoyRadius = 50;

        this.input.on('pointerdown', (pointer) => {
          if (this.isPausedForModal || this.isGameOver) return;
          this.isDragging = true;
          this.dragStartX = pointer.x;
          this.dragStartY = pointer.y;
          this.dragVecX = 0;
          this.dragVecY = 0;

          this.joyBase.setPosition(pointer.x, pointer.y).setVisible(true);
          this.joyStick.setPosition(pointer.x, pointer.y).setVisible(true);
        });

        this.input.on('pointermove', (pointer) => {
          if (this.isPausedForModal || this.isGameOver) return;
          if (!pointer.isDown) {
            if (this.isDragging) this.resetDragState();
            return;
          }

          if (!this.isDragging) {
            this.isDragging = true;
            this.dragStartX = pointer.x;
            this.dragStartY = pointer.y;
            this.joyBase.setPosition(pointer.x, pointer.y).setVisible(true);
            this.joyStick.setPosition(pointer.x, pointer.y).setVisible(true);
          }

          const dx = pointer.x - this.dragStartX;
          const dy = pointer.y - this.dragStartY;
          const dist = Math.hypot(dx, dy);

          if (dist > 6) {
            const angle = Math.atan2(dy, dx);
            const clampedDist = Math.min(dist, maxJoyRadius);
            this.joyStick.setPosition(
              this.dragStartX + Math.cos(angle) * clampedDist,
              this.dragStartY + Math.sin(angle) * clampedDist
            );

            if (dist > maxJoyRadius * 1.35) {
              const pull = dist - maxJoyRadius * 1.35;
              this.dragStartX += Math.cos(angle) * pull;
              this.dragStartY += Math.sin(angle) * pull;
              this.joyBase.setPosition(this.dragStartX, this.dragStartY);
            }

            const speedFactor = Math.min(1, dist / 22);
            this.dragVecX = Math.cos(angle) * speedFactor;
            this.dragVecY = Math.sin(angle) * speedFactor;
          } else {
            this.dragVecX = 0;
            this.dragVecY = 0;
            this.joyStick.setPosition(this.dragStartX, this.dragStartY);
          }
        });

        this.input.on('pointerup', () => {
          this.resetDragState();
        });

        this.input.on('pointerupoutside', () => {
          this.resetDragState();
        });
      }

      resetDragState() {
        this.isDragging = false;
        this.dragVecX = 0;
        this.dragVecY = 0;
        if (this.joyBase) this.joyBase.setVisible(false);
        if (this.joyStick) this.joyStick.setVisible(false);
      }

      setupOrbitBlades() {
        this.orbitGroup.clear(true, true);
        const count = this.playerStats.orbitCount;
        for (let i = 0; i < count; i++) {
          const blade = this.orbitGroup.create(this.player.x, this.player.y, 'orbit_blade');
          blade.setCircle(10, 9, 0);
          blade.setDepth(12);
        }
      }

      createCyberGrid() {
        const grid = this.add.graphics();
        grid.lineStyle(1, 0x00ffff, 0.08);

        const step = 80;
        for (let x = 0; x <= this.worldSize; x += step) {
          grid.moveTo(x, 0);
          grid.lineTo(x, this.worldSize);
        }
        for (let y = 0; y <= this.worldSize; y += step) {
          grid.moveTo(0, y);
          grid.lineTo(this.worldSize, y);
        }
        grid.strokePath();

        grid.lineStyle(6, 0xff0055, 0.6);
        grid.strokeRect(0, 0, this.worldSize, this.worldSize);
      }

      createHUD() {
        const w = this.scale.width;
        const t = I18N[currentLang] || I18N.ja;

        this.hudContainer = this.add.container(0, 0).setScrollFactor(0).setDepth(100);

        const topBg = this.add.rectangle(w / 2, 36, w, 72, 0x050510, 0.85);
        topBg.setStrokeStyle(1, 0x00ffff, 0.3);

        this.expBarBg = this.add.rectangle(w / 2, 12, w - 40, 12, 0x112233).setOrigin(0.5, 0.5);
        this.expBarFill = this.add.rectangle(20, 12, 0, 12, 0x00ff88).setOrigin(0, 0.5);

        this.levelText = this.add.text(20, 28, 'LV: 1', {
          fontSize: w < 500 ? '17px' : '20px',
          fontStyle: 'bold',
          color: '#00ffff'
        });

        this.timerText = this.add.text(w / 2, 28, 'TIME 00:00', {
          fontSize: w < 500 ? '18px' : '22px',
          fontStyle: 'bold',
          color: '#ffffff'
        }).setOrigin(0.5, 0);

        this.killText = this.add.text(w - 20, 28, 'KILLS: 0', {
          fontSize: w < 500 ? '16px' : '18px',
          fontStyle: 'bold',
          color: '#ff66aa'
        }).setOrigin(1, 0);

        this.guideText = this.add.text(w / 2, this.scale.height - 20, t.hudMoveGuide, {
          fontSize: w < 500 ? '11px' : '14px',
          color: '#88aaaa'
        }).setOrigin(0.5, 0.5);

        this.hudContainer.add([
          topBg,
          this.expBarBg,
          this.expBarFill,
          this.levelText,
          this.timerText,
          this.killText,
          this.guideText
        ]);

        this.comboText = this.add.text(w / 2, 85, '', {
          fontSize: '26px',
          fontStyle: 'bold',
          color: '#ffdd00',
          stroke: '#ff0055',
          strokeThickness: 4
        }).setOrigin(0.5).setScrollFactor(0).setDepth(150);

        this.hpBarBg = this.add.rectangle(0, 0, 48, 6, 0x330011).setDepth(20);
        this.hpBarFill = this.add.rectangle(0, 0, 48, 6, 0x00ff66).setDepth(21);

        this.updateHUD();
      }

      updateHUD() {
        const w = this.scale.width;
        const expRatio = Phaser.Math.Clamp(this.playerStats.exp / this.playerStats.nextExp, 0, 1);
        this.expBarFill.width = (w - 40) * expRatio;

        this.levelText.setText(`LV: ${this.playerStats.level}`);
        this.killText.setText(`KILLS: ${this.killCount}`);
        this.timerText.setText(`TIME ${formatTime(this.elapsedSeconds)}`);
      }

      updateCombo(delta) {
        if (this.comboCount > 0) {
          this.comboTimer -= delta;
          if (this.comboTimer <= 0) {
            this.comboCount = 0;
            this.comboText.setText('');
          } else {
            const alphaRatio = Phaser.Math.Clamp(this.comboTimer / 500, 0.3, 1);
            this.comboText.setAlpha(alphaRatio);
          }
        }
      }

      update(time, delta) {
        if (this.isPausedForModal || this.isGameOver) return;

        this.handlePlayerMovement();
        this.handleTimersAndSpawning(delta);
        this.updateOrbitBlades(delta);
        this.updateCombo(delta);

        if (time > this.lastShotTime + this.playerStats.fireRate) {
          const fired = this.autoFireAtNearestEnemy();
          if (fired) {
            this.lastShotTime = time;
          }
        }

        this.updateEnemies();
        this.updateGems();
        this.cleanupBullets();
      }

      handlePlayerMovement() {
        let vx = 0;
        let vy = 0;

        if (this.cursors.left.isDown || this.wasd.left.isDown) vx -= 1;
        if (this.cursors.right.isDown || this.wasd.right.isDown) vx += 1;
        if (this.cursors.up.isDown || this.wasd.up.isDown) vy -= 1;
        if (this.cursors.down.isDown || this.wasd.down.isDown) vy += 1;

        if (vx !== 0 || vy !== 0) {
          const len = Math.hypot(vx, vy);
          vx = (vx / len) * this.playerStats.speed;
          vy = (vy / len) * this.playerStats.speed;
          this.player.rotation += 0.05;
        } else if (this.isDragging && (this.dragVecX !== 0 || this.dragVecY !== 0)) {
          vx = this.dragVecX * this.playerStats.speed;
          vy = this.dragVecY * this.playerStats.speed;
          this.player.rotation += 0.05;
        }

        this.player.setVelocity(vx, vy);

        this.magnetRing.setPosition(this.player.x, this.player.y);
        this.magnetRing.setRadius(this.playerStats.magnetRadius);

        const hpRatio = Phaser.Math.Clamp(this.playerStats.hp / this.playerStats.maxHp, 0, 1);
        this.hpBarBg.setPosition(this.player.x, this.player.y - 32);
        this.hpBarFill.setPosition(this.player.x - 24 + (48 * hpRatio) / 2, this.player.y - 32);
        this.hpBarFill.width = 48 * hpRatio;
        this.hpBarFill.fillColor = hpRatio > 0.4 ? 0x00ff66 : 0xff2255;
      }

      updateOrbitBlades(delta) {
        this.orbitAngle += this.playerStats.orbitSpeed * (delta / 1000);
        const blades = this.orbitGroup.getChildren();
        const count = blades.length;

        blades.forEach((blade, index) => {
          const angle = this.orbitAngle + (index * (Math.PI * 2 / count));
          const ox = this.player.x + Math.cos(angle) * this.playerStats.orbitRadius;
          const oy = this.player.y + Math.sin(angle) * this.playerStats.orbitRadius;

          blade.setPosition(ox, oy);
          blade.rotation = angle + Math.PI / 2;
        });
      }

      handleTimersAndSpawning(delta) {
        this.secondTimer += delta;
        if (this.secondTimer >= 1000) {
          this.secondTimer -= 1000;
          this.elapsedSeconds++;
          this.updateHUD();
        }

        const currentSpawnInterval = Math.max(140, 950 - this.elapsedSeconds * 14);
        this.spawnTimer += delta;
        if (this.spawnTimer >= currentSpawnInterval) {
          this.spawnTimer = 0;
          const batchCount = 1 + Math.floor(this.elapsedSeconds / 24);
          for (let i = 0; i < batchCount; i++) {
            this.spawnEnemy();
          }
        }
      }

      spawnEnemy() {
        if (this.enemies.countActive(true) >= 220) return;

        const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
        const distance = Phaser.Math.Between(360, 560);
        const spawnX = Phaser.Math.Clamp(this.player.x + Math.cos(angle) * distance, 40, this.worldSize - 40);
        const spawnY = Phaser.Math.Clamp(this.player.y + Math.sin(angle) * distance, 40, this.worldSize - 40);

        const roll = Math.random();
        let type = 'enemy_basic';
        let hp = 24 + this.elapsedSeconds * 1.1;
        let speed = 95 + Math.min(85, this.elapsedSeconds * 0.85);
        let expValue = 1;

        if (this.elapsedSeconds > 12 && roll < 0.3) {
          type = 'enemy_fast';
          hp = 18 + this.elapsedSeconds * 0.9;
          speed = 160 + Math.min(95, this.elapsedSeconds * 1.0);
          expValue = 2;
        } else if (this.elapsedSeconds > 26 && roll > 0.78) {
          type = 'enemy_tank';
          hp = 85 + this.elapsedSeconds * 3.4;
          speed = 65 + Math.min(50, this.elapsedSeconds * 0.5);
          expValue = 5;
        }

        const enemy = this.enemies.create(spawnX, spawnY, type);
        enemy.setCircle(enemy.width * 0.38, enemy.width * 0.12, enemy.height * 0.12);
        enemy.hp = hp;
        enemy.maxHp = hp;
        enemy.moveSpeed = speed;
        enemy.expValue = expValue;
        enemy.lastOrbitHitTime = 0;
      }

      autoFireAtNearestEnemy() {
        const activeEnemies = this.enemies.getChildren().filter(e => e.active);
        if (activeEnemies.length === 0) return false;

        let nearestEnemy = null;
        let minDistance = 780;

        for (const enemy of activeEnemies) {
          const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, enemy.x, enemy.y);
          if (dist < minDistance) {
            minDistance = dist;
            nearestEnemy = enemy;
          }
        }

        if (!nearestEnemy) return false;

        const baseAngle = Phaser.Math.Angle.Between(
          this.player.x,
          this.player.y,
          nearestEnemy.x,
          nearestEnemy.y
        );

        const count = this.playerStats.bulletCount;
        const spreadAngle = 0.16;

        for (let i = 0; i < count; i++) {
          const offsetIndex = i - (count - 1) / 2;
          const angle = baseAngle + offsetIndex * spreadAngle;

          const bullet = this.bullets.create(this.player.x, this.player.y, 'bullet');
          bullet.setCircle(6, 4, 4);
          bullet.setDepth(8);
          bullet.damage = this.playerStats.bulletDamage;
          bullet.pierceLeft = this.playerStats.pierce;
          bullet.hitEnemies = new Set();

          this.physics.velocityFromRotation(angle, this.playerStats.bulletSpeed, bullet.body.velocity);
        }

        this.sfx.playShoot();
        return true;
      }

      updateEnemies() {
        const children = this.enemies.getChildren();
        for (const enemy of children) {
          if (!enemy.active) continue;
          this.physics.moveToObject(enemy, this.player, enemy.moveSpeed);
          enemy.rotation += 0.03;
        }
      }

      updateGems() {
        const children = this.gems.getChildren();
        for (const gem of children) {
          if (!gem.active) continue;
          const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, gem.x, gem.y);
          if (dist <= this.playerStats.magnetRadius) {
            this.physics.moveToObject(gem, this.player, 480);
          } else {
            gem.body.setVelocity(0, 0);
          }
        }
      }

      cleanupBullets() {
        const children = this.bullets.getChildren();
        for (const bullet of children) {
          if (!bullet.active) continue;
          const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, bullet.x, bullet.y);
          if (dist > 920) {
            bullet.destroy();
          }
        }
      }

      onBulletHitEnemy(bullet, enemy) {
        if (!bullet.active || !enemy.active) return;

        if (bullet.hitEnemies.has(enemy)) return;
        bullet.hitEnemies.add(enemy);

        enemy.hp -= bullet.damage;
        this.showDamagePopup(enemy.x, enemy.y - 12, Math.round(bullet.damage));

        const bvx = bullet.body.velocity.x;
        const bvy = bullet.body.velocity.y;
        const bSpeed = Math.hypot(bvx, bvy) || 1;
        const knockbackDist = 20;
        enemy.x = Phaser.Math.Clamp(enemy.x + (bvx / bSpeed) * knockbackDist, 40, this.worldSize - 40);
        enemy.y = Phaser.Math.Clamp(enemy.y + (bvy / bSpeed) * knockbackDist, 40, this.worldSize - 40);

        enemy.setTintFill(0xffffff);
        this.time.delayedCall(50, () => {
          if (enemy && enemy.active) enemy.clearTint();
        });

        this.spawnBurstParticles(enemy.x, enemy.y, 0x00ffff, 4, 0.4);

        bullet.pierceLeft--;
        if (bullet.pierceLeft <= 0) {
          bullet.destroy();
        }

        if (enemy.hp <= 0) {
          this.killEnemy(enemy);
        } else {
          this.sfx.playHit();
        }
      }

      onOrbitHitEnemy(blade, enemy) {
        if (!enemy.active) return;

        const now = this.time.now;
        if (now - (enemy.lastOrbitHitTime || 0) < 220) return;
        enemy.lastOrbitHitTime = now;

        enemy.hp -= this.playerStats.orbitDamage;
        this.showDamagePopup(enemy.x, enemy.y - 14, Math.round(this.playerStats.orbitDamage));
        this.sfx.playSlice();

        const angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, enemy.x, enemy.y);
        const knockDist = 26;
        enemy.x = Phaser.Math.Clamp(enemy.x + Math.cos(angle) * knockDist, 40, this.worldSize - 40);
        enemy.y = Phaser.Math.Clamp(enemy.y + Math.sin(angle) * knockDist, 40, this.worldSize - 40);

        enemy.setTintFill(0x00ffff);
        this.time.delayedCall(60, () => {
          if (enemy && enemy.active) enemy.clearTint();
        });

        this.spawnBurstParticles(enemy.x, enemy.y, 0x00ffcc, 6, 0.6);

        if (enemy.hp <= 0) {
          this.killEnemy(enemy);
        }
      }

      killEnemy(enemy) {
        const ex = enemy.x;
        const ey = enemy.y;
        const expVal = enemy.expValue || 1;
        const isTank = enemy.texture.key === 'enemy_tank';

        enemy.destroy();
        this.killCount++;

        this.comboCount++;
        this.comboTimer = this.maxComboTime;
        this.triggerComboPopup();

        this.updateHUD();

        this.sfx.playExplosion(this.comboCount);

        if (isTank) {
          this.cameras.main.shake(120, 0.007);
        } else {
          this.cameras.main.shake(65, 0.0035);
        }

        this.spawnShockwave(ex, ey, isTank ? 0xaa00ff : 0x00ffff);

        const particleCount = isTank ? 28 : 16;
        this.spawnBurstParticles(ex, ey, isTank ? 0xd466ff : 0xff0066, particleCount, 1.0);

        const gem = this.gems.create(ex, ey, 'gem');
        gem.setCircle(9, 3, 3);
        gem.expValue = expVal;
      }

      spawnShockwave(x, y, color) {
        const ring = this.add.image(x, y, 'shockwave');
        ring.setTint(color);
        ring.setScale(0.2);
        ring.setDepth(14);
        ring.setBlendMode(Phaser.BlendModes.ADD);

        this.tweens.add({
          targets: ring,
          scale: 1.8,
          alpha: 0,
          duration: 200,
          ease: 'Cubic.easeOut',
          onComplete: () => ring.destroy()
        });
      }

      triggerComboPopup() {
        if (this.comboCount >= 2) {
          let comboColor = '#ffdd00';
          if (this.comboCount >= 25) comboColor = '#00ffff';
          else if (this.comboCount >= 10) comboColor = '#ff00aa';

          this.comboText.setText(`${this.comboCount} COMBO!`);
          this.comboText.setColor(comboColor);
          this.comboText.setAlpha(1);
          this.comboText.setScale(1.4);

          this.tweens.killTweensOf(this.comboText);
          this.tweens.add({
            targets: this.comboText,
            scale: 1.0,
            duration: 130,
            ease: 'Back.easeOut'
          });
        }
      }

      spawnBurstParticles(x, y, color, count = 16, intensity = 1.0) {
        for (let i = 0; i < count; i++) {
          const p = this.add.image(x, y, 'particle');
          const sparkColor = Math.random() < 0.35 ? 0xffffff : color;
          p.setTint(sparkColor);
          p.setDepth(15);
          p.setBlendMode(Phaser.BlendModes.ADD);

          const angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
          const dist = Phaser.Math.Between(30, 95) * intensity;

          this.tweens.add({
            targets: p,
            x: x + Math.cos(angle) * dist,
            y: y + Math.sin(angle) * dist,
            alpha: 0,
            scale: 0.1,
            duration: Phaser.Math.Between(200, 420),
            ease: 'Cubic.easeOut',
            onComplete: () => p.destroy()
          });
        }
      }

      showDamagePopup(x, y, amount) {
        const txt = this.add.text(x, y, String(amount), {
          fontSize: '15px',
          fontStyle: 'bold',
          color: '#ffff66',
          stroke: '#000000',
          strokeThickness: 3
        }).setOrigin(0.5).setDepth(30);

        this.tweens.add({
          targets: txt,
          y: y - 28,
          alpha: 0,
          duration: 420,
          ease: 'Quad.easeOut',
          onComplete: () => txt.destroy()
        });
      }

      onPlayerHitEnemy(player, enemy) {
        if (this.isPausedForModal || this.isGameOver) return;

        const now = this.time.now;
        if (now < this.lastDamageTime + 400) return;
        this.lastDamageTime = now;

        this.playerStats.hp = Math.max(0, this.playerStats.hp - 12);
        this.sfx.playDamage();
        this.cameras.main.shake(140, 0.009);

        player.setTintFill(0xff0044);
        this.time.delayedCall(120, () => {
          if (player && player.active) player.clearTint();
        });

        if (this.playerStats.hp <= 0) {
          this.triggerGameOver();
        }
      }

      onPlayerCollectGem(player, gem) {
        if (!gem.active || this.isPausedForModal || this.isGameOver) return;

        const val = gem.expValue || 1;
        gem.destroy();

        this.sfx.playGem();
        this.playerStats.exp += val;

        if (this.playerStats.exp >= this.playerStats.nextExp) {
          this.triggerLevelUp();
        } else {
          this.updateHUD();
        }
      }

      triggerLevelUp() {
        this.playerStats.exp -= this.playerStats.nextExp;
        this.playerStats.level++;
        this.playerStats.nextExp = Math.floor(this.playerStats.nextExp * 1.45) + 4;
        this.updateHUD();

        this.resetDragState();
        this.isPausedForModal = true;
        this.physics.pause();
        this.sfx.playLevelUp();

        const u = (I18N[currentLang] || I18N.ja).upgrades;

        const upgradePool = [
          {
            ...u.orbit,
            color: 0x00ffcc,
            apply: () => {
              this.playerStats.orbitCount += 1;
              this.playerStats.orbitSpeed *= 1.15;
              this.playerStats.orbitRadius = Math.min(150, this.playerStats.orbitRadius + 8);
              this.playerStats.orbitDamage = Math.floor(this.playerStats.orbitDamage * 1.25);
              this.setupOrbitBlades();
            }
          },
          {
            ...u.rapid,
            color: 0x00ffff,
            apply: () => {
              this.playerStats.fireRate = Math.max(100, Math.floor(this.playerStats.fireRate * 0.82));
            }
          },
          {
            ...u.multi,
            color: 0xff00aa,
            apply: () => {
              this.playerStats.bulletCount += 1;
            }
          },
          {
            ...u.pierce,
            color: 0xffdd00,
            apply: () => {
              this.playerStats.pierce += 1;
              this.playerStats.bulletSpeed = Math.floor(this.playerStats.bulletSpeed * 1.15);
            }
          },
          {
            ...u.voltage,
            color: 0xff5500,
            apply: () => {
              this.playerStats.bulletDamage = Math.floor(this.playerStats.bulletDamage * 1.3);
            }
          },
          {
            ...u.thruster,
            color: 0x00ff88,
            apply: () => {
              this.playerStats.speed = Math.floor(this.playerStats.speed * 1.18);
            }
          },
          {
            ...u.repair,
            color: 0x55ff55,
            apply: () => {
              this.playerStats.maxHp += 30;
              this.playerStats.hp = Math.min(
                this.playerStats.maxHp,
                this.playerStats.hp + Math.floor(this.playerStats.maxHp * 0.5)
              );
            }
          },
          {
            ...u.magnet,
            color: 0xaa66ff,
            apply: () => {
              this.playerStats.magnetRadius = Math.floor(this.playerStats.magnetRadius * 1.45);
            }
          }
        ];

        const choices = Phaser.Utils.Array.Shuffle(upgradePool).slice(0, 3);
        this.showUpgradeModal(choices);
      }

      showUpgradeModal(choices) {
        const w = this.scale.width;
        const h = this.scale.height;
        const isPortrait = w < 620;
        const t = I18N[currentLang] || I18N.ja;

        this.modalElements = [];

        const overlay = this.add.rectangle(w / 2, h / 2, w, h, 0x000008, 0.82)
          .setScrollFactor(0)
          .setDepth(200)
          .setInteractive();
        this.modalElements.push(overlay);

        const title = this.add.text(w / 2, isPortrait ? h * 0.12 : h * 0.18, t.levelUpTitle(this.playerStats.level), {
          fontSize: isPortrait ? '26px' : '34px',
          fontStyle: 'bold',
          color: '#00ffff',
          stroke: '#003344',
          strokeThickness: 4
        }).setOrigin(0.5).setScrollFactor(0).setDepth(201);

        const subTitle = this.add.text(w / 2, isPortrait ? h * 0.18 : h * 0.25, t.levelUpSub, {
          fontSize: isPortrait ? '13px' : '16px',
          color: '#cccccc',
          align: 'center',
          wordWrap: { width: w - 32 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(201);

        this.modalElements.push(title, subTitle);

        if (isPortrait) {
          const cardW = Math.min(w - 36, 420);
          const cardH = Math.min(148, (h * 0.68) / 3 - 14);
          const gap = 14;
          const startY = h * 0.30 + cardH / 2;

          choices.forEach((choice, index) => {
            const cx = w / 2;
            const cy = startY + index * (cardH + gap);

            const cardBg = this.add.rectangle(cx, cy, cardW, cardH, 0x0c1022, 0.96)
              .setStrokeStyle(2.5, choice.color, 0.9)
              .setScrollFactor(0)
              .setDepth(202)
              .setInteractive({ useHandCursor: true });

            const nameTxt = this.add.text(cx, cy - cardH * 0.28, `${choice.title}  (${choice.subtitle})`, {
              fontSize: '16px',
              fontStyle: 'bold',
              color: '#' + choice.color.toString(16).padStart(6, '0'),
              align: 'center',
              wordWrap: { width: cardW - 24 }
            }).setOrigin(0.5).setScrollFactor(0).setDepth(203);

            const descTxt = this.add.text(cx, cy + 4, choice.desc, {
              fontSize: '13px',
              color: '#dde6f0',
              align: 'center',
              wordWrap: { width: cardW - 28 }
            }).setOrigin(0.5).setScrollFactor(0).setDepth(203);

            const selectLabel = this.add.text(cx, cy + cardH * 0.34, t.selectLabel, {
              fontSize: '13px',
              fontStyle: 'bold',
              color: '#00ffff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(203);

            this.bindUpgradeCardEvents(cardBg, choice);
            this.modalElements.push(cardBg, nameTxt, descTxt, selectLabel);
          });
        } else {
          const cardW = Math.min(240, (w - 80) / 3);
          const cardH = 260;
          const gap = 24;
          const startX = w / 2 - (cardW + gap);
          const centerY = h * 0.55;

          choices.forEach((choice, index) => {
            const cx = startX + index * (cardW + gap);
            const cy = centerY;

            const cardBg = this.add.rectangle(cx, cy, cardW, cardH, 0x0c1022, 0.95)
              .setStrokeStyle(2.5, choice.color, 0.9)
              .setScrollFactor(0)
              .setDepth(202)
              .setInteractive({ useHandCursor: true });

            const nameTxt = this.add.text(cx, cy - 82, choice.title, {
              fontSize: '20px',
              fontStyle: 'bold',
              color: '#ffffff',
              align: 'center',
              wordWrap: { width: cardW - 20 }
            }).setOrigin(0.5).setScrollFactor(0).setDepth(203);

            const subTxt = this.add.text(cx, cy - 42, choice.subtitle, {
              fontSize: '15px',
              fontStyle: 'bold',
              color: '#' + choice.color.toString(16).padStart(6, '0'),
              align: 'center',
              wordWrap: { width: cardW - 16 }
            }).setOrigin(0.5).setScrollFactor(0).setDepth(203);

            const descTxt = this.add.text(cx, cy + 20, choice.desc, {
              fontSize: '14px',
              color: '#bbccdd',
              align: 'center',
              lineSpacing: 6,
              wordWrap: { width: cardW - 28 }
            }).setOrigin(0.5).setScrollFactor(0).setDepth(203);

            const selectLabel = this.add.text(cx, cy + 95, t.selectLabel, {
              fontSize: '15px',
              fontStyle: 'bold',
              color: '#00ffff'
            }).setOrigin(0.5).setScrollFactor(0).setDepth(203);

            this.bindUpgradeCardEvents(cardBg, choice);
            this.modalElements.push(cardBg, nameTxt, subTxt, descTxt, selectLabel);
          });
        }
      }

      bindUpgradeCardEvents(cardBg, choice) {
        cardBg.on('pointerover', () => {
          cardBg.setFillStyle(0x1a2644, 1);
          cardBg.setScale(1.03);
        });
        cardBg.on('pointerout', () => {
          cardBg.setFillStyle(0x0c1022, 0.95);
          cardBg.setScale(1.0);
        });
        cardBg.on('pointerdown', () => {
          choice.apply();
          this.sfx.playGem();

          this.modalElements.forEach(el => {
            if (el && el.destroy) el.destroy();
          });
          this.modalElements = [];

          this.isPausedForModal = false;
          this.physics.resume();

          this.spawnShockwave(this.player.x, this.player.y, 0x00ffff);
          this.spawnBurstParticles(this.player.x, this.player.y, 0x00ffff, 20, 1.2);
        });
      }

      triggerGameOver() {
        if (this.isGameOver) return;
        this.isGameOver = true;
        this.resetDragState();
        this.physics.pause();
        this.player.setTint(0x555555);
        this.sfx.playExplosion(0);

        this.time.delayedCall(450, () => {
          this.scene.start('SceneResult', {
            elapsedSeconds: this.elapsedSeconds,
            killCount: this.killCount,
            level: this.playerStats.level
          });
        });
      }
    }

    /**
     * ============================================================================
     * 4. リザルトシーン（SceneResult）
     * ============================================================================
     */
    class SceneResult extends Phaser.Scene {
      constructor() {
        super({ key: 'SceneResult' });
      }

      init(data) {
        this.elapsedSeconds = data && typeof data.elapsedSeconds === 'number' ? data.elapsedSeconds : 0;
        this.killCount = data && typeof data.killCount === 'number' ? data.killCount : 0;
        this.reachedLevel = data && typeof data.level === 'number' ? data.level : 1;
      }

      create() {
        if (!this.sys.game.sfx) {
          this.sys.game.sfx = new SoundManager();
        }
        this.sfx = this.sys.game.sfx;

        const w = this.scale.width;
        const h = this.scale.height;
        const cx = w / 2;
        const cy = h / 2;
        const t = I18N[currentLang] || I18N.ja;

        const sec = Math.floor(this.elapsedSeconds);
        let bestSec = parseInt(localStorage.getItem('survivor_best_seconds') || '0', 10);
        const isNew = sec > bestSec;
        if (isNew) {
          bestSec = sec;
          localStorage.setItem('survivor_best_seconds', bestSec.toString());
        }

        const timeStr = formatTime(sec);
        const bestTimeStr = formatTime(bestSec);
        const rankInfo = evaluateRank(this.elapsedSeconds, currentLang);

        this.add.rectangle(cx, cy, w, h, 0x06070d, 0.94).setScrollFactor(0);
        this.add.rectangle(cx, cy, 420, 520, 0x0f1424, 0.96)
          .setStrokeStyle(2, rankInfo.hex, 0.65)
          .setScrollFactor(0);

        // 1. 終了タイトル
        this.add.text(cx, cy - 195, t.resultHeader, {
          fontSize: '34px',
          fontStyle: 'bold',
          color: '#ff2266',
          stroke: '#000',
          strokeThickness: 5
        }).setOrigin(0.5).setScrollFactor(0);

        // 2. 今回スコア (生存時間 + 撃破数)
        this.add.text(cx, cy - 125, `SCORE: ${timeStr} (${this.killCount} KILLS)`, {
          fontSize: '26px',
          fontStyle: 'bold',
          color: '#00f5d4'
        }).setOrigin(0.5).setScrollFactor(0);

        // 3. ランク／称号
        this.add.text(cx, cy - 65, `ランク: 【 ${rankInfo.title} 】`, {
          fontSize: '16px',
          fontStyle: 'bold',
          color: rankInfo.color,
          stroke: '#000000',
          strokeThickness: 3,
          align: 'center',
          wordWrap: { width: 380 }
        }).setOrigin(0.5).setScrollFactor(0);

        // 4. ベストスコア
        this.add.text(cx, cy - 15, `🏆 BEST SCORE: ${bestTimeStr}${isNew ? ' 🔥 NEW!' : ''}`, {
          fontSize: '18px',
          fontStyle: 'bold',
          color: '#38bdf8'
        }).setOrigin(0.5).setScrollFactor(0);

        // 上段ボタン: もう一回 / RETRY (横幅いっぱい)
        const fullBtnW = 360;
        this.createResultButton(
          cx,
          cy + 60,
          fullBtnW,
          52,
          t.retryBtn,
          0x004455,
          0x00f5d4,
          '#00f5d4',
          () => {
            this.sfx.playLevelUp();
            this.scene.start('SceneGame');
          }
        );

        // 中段ボタン: 𝕏 でポスト / 𝕏 POST TO X (横幅いっぱい)
        this.createResultButton(
          cx,
          cy + 126,
          fullBtnW,
          52,
          t.shareBtn,
          0x0284c7,
          0x38bdf8,
          '#ffffff',
          () => {
            this.sfx.playClick();
            const shareText = t.shareTemplate(timeStr, this.killCount, rankInfo.title);
            const shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(window.location.href)}`;
            window.open(shareUrl, '_blank', 'noopener,noreferrer');
          }
        );

        // 下段ボタン (左右2分割で横並び配置)
        const halfW = 172;
        const gap = 16;
        const bottomY = cy + 192;
        const leftX = cx - (halfW / 2 + gap / 2);
        const rightX = cx + (halfW / 2 + gap / 2);

        this.createResultButton(
          leftX,
          bottomY,
          halfW,
          48,
          t.titleBtn,
          0x334155,
          0x64748b,
          '#f8fafc',
          () => {
            this.sfx.playClick();
            this.scene.start('SceneTitle');
          }
        );

        this.createResultButton(
          rightX,
          bottomY,
          halfW,
          48,
          t.portalBtn,
          0x475569,
          0x94a3b8,
          '#f8fafc',
          () => {
            this.sfx.playClick();
            window.location.href = '../index.html';
          }
        );
      }

      createResultButton(x, y, w, h, label, fillHex, strokeHex, textColor, onClick) {
        const bg = this.add.rectangle(x, y, w, h, fillHex, 0.95)
          .setStrokeStyle(1.5, strokeHex, 0.95)
          .setInteractive({ useHandCursor: true })
          .setScrollFactor(0);

        const txt = this.add.text(x, y, label, {
          fontSize: w < 220 ? '15px' : '18px',
          fontStyle: 'bold',
          color: textColor
        }).setOrigin(0.5).setScrollFactor(0);

        bg.on('pointerover', () => {
          bg.setScale(1.03);
          txt.setScale(1.03);
        });
        bg.on('pointerout', () => {
          bg.setScale(1.0);
          txt.setScale(1.0);
        });
        bg.on('pointerdown', onClick);
      }
    }

    /**
     * ============================================================================
     * 5. Phaser ゲームインスタンスの起動設定（3シーン構成）
     * ============================================================================
     */
    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: 480, height: 800,
      backgroundColor: '#060712',
      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 0 },
          debug: false
        }
      },
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      },
      scene: [SceneTitle, SceneGame, SceneResult]
    };

    window.addEventListener('load', () => {
      new Phaser.Game(config);
    });
  </script>
</body>
</html>
