<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>積む積む - Stack Tower | Shigege Games</title>
  <meta name="description" content="タイミングよくブロックを積み上げて超高層タワーを目指すハイパーカジュアルゲーム『積む積む』。">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4EBNDS3X7P');
  </script>

  <!-- Phaser 3 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      background: #06070d;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: 100vh;
      max-height: 800px;
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.2), 0 0 50px rgba(0, 0, 0, 0.9);
      overflow: hidden;
      background: #0f1015;
    }
    canvas {
      display: block;
      margin: auto;
      touch-action: none;
    }
  </style>
</head>
<body>

<div id="game-container"></div>

<script>
(function() {
  'use strict';

  // ==========================================
  // 1. 共通定数・ローカライズ辞書
  // ==========================================
  let currentLang = localStorage.getItem('shigege_game_lang') || ((navigator.language && navigator.language.startsWith('ja')) ? 'ja' : 'en');
  let soundEnabled = (localStorage.getItem('shigege_game_sfx') !== 'false');

  const I18N = {
    ja: {
      title: "積む積む",
      subTitle: "タイミングよくブロックを積み上げろ！",
      howToPlay: "【 あそびかた 】",
      rule1: "👆 タップで動くブロックを配置",
      rule2: "⚡ ズレた部分は削落！ピッタリ重ねてコンボ",
      rule3: "🛡️ 完全にはみ出したらゲームオーバー",
      startBtn: "🎮 ゲームスタート",
      gameOver: "GAME OVER",
      score: "SCORE",
      bestScore: "BEST SCORE",
      retryBtn: "🔄 もう一回",
      shareBtn: "🐦 Xにポスト",
      titleBtn: "🏠 タイトルへ",
      portalBtn: "🌐 他のゲームで遊ぶ",
      comboText: "連続 PERFECT!",
      shareText: "【積む積む】でスコア {score} 段を達成したよ！ #ShigegeGames"
    },
    en: {
      title: "STACK TOWER",
      subTitle: "Stack blocks with perfect timing!",
      howToPlay: "【 HOW TO PLAY 】",
      rule1: "👆 Tap / Space to place moving block",
      rule2: "⚡ Match edges perfectly for combo bonuses",
      rule3: "🛡️ Misaligned parts get sliced off",
      startBtn: "🎮 TAP TO START",
      gameOver: "GAME OVER",
      score: "SCORE",
      bestScore: "BEST SCORE",
      retryBtn: "🔄 RETRY",
      shareBtn: "🐦 SHARE ON X",
      titleBtn: "🏠 TITLE",
      portalBtn: "🌐 MORE GAMES",
      comboText: "PERFECT COMBO!",
      shareText: "I reached {score} floors in 【Stack Tower】! #ShigegeGames"
    }
  };

  // ==========================================
  // 2. 共通Web Audioサウンドエンジン (外部ファイルゼロ)
  // ==========================================
  class SoundFX {
    static ctx = null;

    static init() {
      if (!this.ctx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) this.ctx = new AudioContextClass();
      }
    }

    static play(type) {
      if (!soundEnabled) return;
      this.init();
      if (!this.ctx) return;
      if (this.ctx.state === 'suspended') this.ctx.resume();

      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.connect(gain);
      gain.connect(this.ctx.destination);

      if (type === 'tap') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'place') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, now);
        osc.frequency.exponentialRampToValueAtTime(160, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'perfect') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(587.33, now);
        osc.frequency.setValueAtTime(880, now + 0.06);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
        osc.start(now);
        osc.stop(now + 0.18);
      } else if (type === 'gameover') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(55, now + 0.45);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
      }
    }
  }

  // ==========================================
  // 3. 共通タイトルシーン (SceneTitle)
  // ==========================================
  class SceneTitle extends Phaser.Scene {
    constructor() { super('SceneTitle'); }

    create() {
      const { width, height } = this.scale;
      const t = I18N[currentLang];

      // 背景
      this.add.rectangle(0, 0, width, height, 0x0a0c16).setOrigin(0);

      // --- トップバー (UIトグル) ---
      this.createHeaderUI(width);

      // タイトルロゴ
      this.add.text(width / 2, 175, t.title, {
        fontSize: '36px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        fill: '#00f2fe'
      }).setOrigin(0.5);

      this.add.text(width / 2, 218, t.subTitle, {
        fontSize: '13px',
        fill: '#94a3b8'
      }).setOrigin(0.5);

      // メインアイコンアニメーション
      const icon = this.add.text(width / 2, 290, '📦', { fontSize: '68px' }).setOrigin(0.5);
      this.tweens.add({
        targets: icon,
        scale: 1.15,
        yoyo: true,
        repeat: -1,
        duration: 800,
        ease: 'Sine.easeInOut'
      });

      // 遊び方カード
      const card = this.add.graphics();
      card.fillStyle(0x131826, 0.9);
      card.lineStyle(1, 0x00f2fe, 0.3);
      card.strokeRoundedRect(28, 360, width - 56, 170, 16);
      card.fillRoundedRect(28, 360, width - 56, 170, 16);

      this.add.text(width / 2, 385, t.howToPlay, { fontSize: '15px', fontStyle: 'bold', fill: '#f8fafc' }).setOrigin(0.5);
      this.add.text(width / 2, 425, t.rule1, { fontSize: '13px', fill: '#cbd5e1' }).setOrigin(0.5);
      this.add.text(width / 2, 458, t.rule2, { fontSize: '13px', fill: '#fbbf24' }).setOrigin(0.5);
      this.add.text(width / 2, 492, t.rule3, { fontSize: '13px', fill: '#f87171' }).setOrigin(0.5);

      // ハイスコア表示
      const best = localStorage.getItem('tsumtsum_best_score') || 0;
      this.add.text(width / 2, 560, `🏆 ${t.bestScore}: ${best}`, {
        fontSize: '16px',
        fontStyle: 'bold',
        fill: '#38bdf8'
      }).setOrigin(0.5);

      // スタートボタン
      const startBtn = this.add.rectangle(width / 2, 635, width - 80, 54, 0x00f2fe).setInteractive({ useHandCursor: true });
      const startTxt = this.add.text(width / 2, 635, t.startBtn, {
        fontSize: '18px',
        fontStyle: 'bold',
        fill: '#06070d'
      }).setOrigin(0.5);

      this.tweens.add({
        targets: [startBtn, startTxt],
        scaleX: 1.03,
        scaleY: 1.03,
        yoyo: true,
        repeat: -1,
        duration: 600
      });

      startBtn.on('pointerdown', () => {
        SoundFX.play('tap');
        this.scene.start('SceneGame');
      });

      this.input.keyboard.on('keydown-SPACE', () => {
        SoundFX.play('tap');
        this.scene.start('SceneGame');
      });
    }

    createHeaderUI(w) {
      // サウンド切替ピル
      const sfxBg = this.add.rectangle(80, 42, 110, 32, soundEnabled ? 0x0369a1 : 0x1e293b, 0.9)
        .setStrokeStyle(1, soundEnabled ? 0x38bdf8 : 0x475569)
        .setInteractive({ useHandCursor: true });
      this.add.text(80, 42, soundEnabled ? '🔊 SFX ON' : '🔇 OFF', {
        fontSize: '12px', fontStyle: 'bold', fill: '#fff'
      }).setOrigin(0.5);

      sfxBg.on('pointerdown', () => {
        soundEnabled = !soundEnabled;
        localStorage.setItem('shigege_game_sfx', soundEnabled ? 'true' : 'false');
        SoundFX.play('tap');
        this.scene.restart();
      });

      // 言語切替ピル
      const langBg = this.add.rectangle(w - 80, 42, 110, 32, 0x1e293b, 0.9)
        .setStrokeStyle(1, 0x00f2fe, 0.5)
        .setInteractive({ useHandCursor: true });
      this.add.text(w - 80, 42, currentLang === 'ja' ? '🇯🇵 日本語' : '🇺🇸 English', {
        fontSize: '12px', fontStyle: 'bold', fill: '#38bdf8'
      }).setOrigin(0.5);

      langBg.on('pointerdown', () => {
        currentLang = currentLang === 'ja' ? 'en' : 'ja';
        localStorage.setItem('shigege_game_lang', currentLang);
        SoundFX.play('tap');
        this.scene.restart();
      });
    }
  }

  // ==========================================
  // 4. メインゲームシーン (SceneGame)
  // ==========================================
  class SceneGame extends Phaser.Scene {
    constructor() { super('SceneGame'); }

    create() {
      this.width = this.cameras.main.width;
      this.height = this.cameras.main.height;

      // ゲームパラメータ
      this.blockHeight = 36;
      this.initialWidth = 260;
      this.perfectTolerance = 3;
      this.moveSpeed = 280;
      this.maxSpeed = 700;

      this.score = 0;
      this.combo = 0;
      this.hue = Math.floor(Math.random() * 360);
      this.stack = [];
      this.isGameOver = false;

      // 背景
      this.add.rectangle(0, 0, this.width, this.height, 0x090b14).setOrigin(0);

      this.stackContainer = this.add.container(0, 0);

      // スコア表示
      this.scoreText = this.add.text(24, 24, `SCORE: 0`, {
        fontSize: '24px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        color: '#00f2fe'
      }).setDepth(100);

      // 初回ベースブロック
      const startY = this.height - this.blockHeight / 2 - 100;
      this.currentY = startY;
      this.currentWidth = this.initialWidth;

      const baseBlock = this.add.rectangle(
        this.width / 2,
        this.currentY,
        this.currentWidth,
        this.blockHeight,
        this.getColor()
      );
      this.stackContainer.add(baseBlock);
      this.stack.push(baseBlock);

      this.spawnBlock();

      this.input.on('pointerdown', this.placeBlock, this);
      this.input.keyboard.on('keydown-SPACE', this.placeBlock, this);
    }

    getColor() {
      const color = Phaser.Display.Color.HSLToColor(this.hue / 360, 0.85, 0.58);
      return color.color;
    }

    spawnBlock() {
      this.hue = (this.hue + 24) % 360;
      this.currentY -= this.blockHeight;

      const startX = (this.stack.length % 2 === 0) ? -this.currentWidth / 2 : this.width + this.currentWidth / 2;
      const targetX = (this.stack.length % 2 === 0) ? this.width + this.currentWidth / 2 : -this.currentWidth / 2;

      this.movingBlock = this.add.rectangle(
        startX,
        this.currentY,
        this.currentWidth,
        this.blockHeight,
        this.getColor()
      );
      this.stackContainer.add(this.movingBlock);

      const distance = Math.abs(targetX - startX);
      const duration = (distance / this.moveSpeed) * 1000;

      this.blockTween = this.tweens.add({
        targets: this.movingBlock,
        x: targetX,
        duration: duration,
        yoyo: true,
        repeat: -1,
        ease: 'Linear'
      });
    }

    showCombo(x, y) {
      if (this.combo < 2) return;
      const t = I18N[currentLang];

      const comboText = this.add.text(x, y - 10, `✨ ${this.combo} ${t.comboText}`, {
        fontSize: '22px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        color: '#ffdd00',
        stroke: '#ff0055',
        strokeThickness: 3
      }).setOrigin(0.5);

      this.stackContainer.add(comboText);

      this.tweens.add({
        targets: comboText,
        y: y - 60,
        alpha: 0,
        duration: 800,
        ease: 'Cubic.easeOut',
        onComplete: () => comboText.destroy()
      });
    }

    placeBlock() {
      if (this.isGameOver) return;

      this.blockTween.stop();

      const previousBlock = this.stack[this.stack.length - 1];
      const moveX = this.movingBlock.x;
      const prevX = previousBlock.x;

      const diff = moveX - prevX;
      const absDiff = Math.abs(diff);

      if (absDiff <= this.perfectTolerance) {
        // Perfect stack
        this.movingBlock.x = prevX;
        this.cameras.main.shake(80, 0.008);
        this.combo++;
        SoundFX.play('perfect');
        this.addScore();
        this.showCombo(this.movingBlock.x, this.currentY);
        this.finalizePlacement(this.movingBlock);
      } else if (absDiff < this.currentWidth) {
        // Overhang (cut block)
        this.combo = 0;
        SoundFX.play('place');
        const newWidth = this.currentWidth - absDiff;
        const placedX = prevX + (diff / 2);
        this.movingBlock.destroy();

        const placedBlock = this.add.rectangle(
          placedX,
          this.currentY,
          newWidth,
          this.blockHeight,
          this.getColor()
        );
        this.stackContainer.add(placedBlock);

        // 破片ブロックの落下
        const dropWidth = absDiff;
        const dropX = diff > 0 ? prevX + (this.currentWidth / 2) + (dropWidth / 2) : prevX - (this.currentWidth / 2) - (dropWidth / 2);

        const debris = this.add.rectangle(
          dropX,
          this.currentY,
          dropWidth,
          this.blockHeight,
          this.getColor()
        );

        this.tweens.add({
          targets: debris,
          y: this.height + 60,
          rotation: diff > 0 ? 1.2 : -1.2,
          duration: 900,
          ease: 'Quad.easeIn',
          onComplete: () => debris.destroy()
        });

        this.currentWidth = newWidth;
        this.addScore();
        this.finalizePlacement(placedBlock);
      } else {
        // Missed completely -> Game Over
        this.isGameOver = true;
        this.combo = 0;
        SoundFX.play('gameover');
        this.cameras.main.shake(180, 0.018);

        this.tweens.add({
          targets: this.movingBlock,
          y: this.height + 60,
          rotation: diff > 0 ? 1 : -1,
          duration: 900,
          ease: 'Quad.easeIn',
          onComplete: () => {
            this.scene.start('SceneResult', { score: this.score });
          }
        });
      }
    }

    addScore() {
      this.score++;
      this.scoreText.setText(`SCORE: ${this.score}`);
      if (this.moveSpeed < this.maxSpeed) {
        this.moveSpeed += 12;
      }
    }

    finalizePlacement(block) {
      this.stack.push(block);

      const targetVisualY = this.height - this.blockHeight / 2 - 250;
      const newContainerY = targetVisualY - this.currentY;

      this.tweens.add({
        targets: this.stackContainer,
        y: newContainerY,
        duration: 200,
        ease: 'Sine.easeOut'
      });

      this.tweens.add({
        targets: block,
        scaleX: 1.04,
        scaleY: 1.04,
        duration: 50,
        yoyo: true
      });

      this.spawnBlock();
    }
  }

  // ==========================================
  // 5. 共通リザルトシーン (SceneResult)
  // ==========================================
  class SceneResult extends Phaser.Scene {
    constructor() { super('SceneResult'); }
    init(data) { this.finalScore = data.score || 0; }

    create() {
      const { width, height } = this.scale;
      const t = I18N[currentLang];

      // GA4 tracking
      if (typeof window.gtag === 'function') {
        window.gtag('event', 'game_over', { 'score': this.finalScore });
      }

      // ベストスコア更新判定
      let best = parseInt(localStorage.getItem('tsumtsum_best_score') || '0', 10);
      const isNew = this.finalScore > best;
      if (isNew) {
        best = this.finalScore;
        localStorage.setItem('tsumtsum_best_score', best);
      }

      this.add.rectangle(0, 0, width, height, 0x070913, 0.96).setOrigin(0);

      // GAMEOVER ロゴ
      this.add.text(width / 2, 140, t.gameOver, {
        fontSize: '34px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        fill: '#ef4444'
      }).setOrigin(0.5);

      // スコア表示
      this.add.text(width / 2, 220, `${t.score}: ${this.finalScore}`, {
        fontSize: '38px',
        fontFamily: 'system-ui, sans-serif',
        fontStyle: 'bold',
        fill: '#ffffff'
      }).setOrigin(0.5);

      this.add.text(width / 2, 275, `🏆 ${t.bestScore}: ${best} ${isNew ? '🔥 NEW!' : ''}`, {
        fontSize: '18px',
        fontStyle: 'bold',
        fill: '#f59e0b'
      }).setOrigin(0.5);

      // 1. もう一回 (RETRY)
      const retryBtn = this.add.rectangle(width / 2, 365, width - 80, 52, 0x10b981).setInteractive({ useHandCursor: true });
      this.add.text(width / 2, 365, t.retryBtn, { fontSize: '18px', fontStyle: 'bold', fill: '#fff' }).setOrigin(0.5);
      retryBtn.on('pointerdown', () => {
        SoundFX.play('tap');
        this.scene.start('SceneGame');
      });

      // 2. Xにポスト (SHARE)
      const shareBtn = this.add.rectangle(width / 2, 435, width - 80, 52, 0x0284c7).setInteractive({ useHandCursor: true });
      this.add.text(width / 2, 435, t.shareBtn, { fontSize: '18px', fontStyle: 'bold', fill: '#fff' }).setOrigin(0.5);
      shareBtn.on('pointerdown', () => {
        SoundFX.play('tap');
        const text = encodeURIComponent(t.shareText.replace('{score}', this.finalScore));
        const url = encodeURIComponent(window.location.href);
        window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank');
      });

      // 3. タイトルへ (TITLE)
      const titleBtn = this.add.rectangle(width / 2 - 95, 515, 160, 46, 0x334155).setInteractive({ useHandCursor: true });
      this.add.text(width / 2 - 95, 515, t.titleBtn, { fontSize: '14px', fontStyle: 'bold', fill: '#cbd5e1' }).setOrigin(0.5);
      titleBtn.on('pointerdown', () => {
        SoundFX.play('tap');
        this.scene.start('SceneTitle');
      });

      // 4. ポータルへ (MORE GAMES)
      const portalBtn = this.add.rectangle(width / 2 + 95, 515, 160, 46, 0x475569).setInteractive({ useHandCursor: true });
      this.add.text(width / 2 + 95, 515, t.portalBtn, { fontSize: '14px', fontStyle: 'bold', fill: '#cbd5e1' }).setOrigin(0.5);
      portalBtn.on('pointerdown', () => {
        SoundFX.play('tap');
        window.open('../index.html', '_self');
      });

      // キーボードスペースでリトライ
      this.input.keyboard.on('keydown-SPACE', () => {
        SoundFX.play('tap');
        this.scene.start('SceneGame');
      });
    }
  }

  // ==========================================
  // 6. Phaser ゲーム起動設定
  // ==========================================
  const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    width: 480,
    height: 800,
    scale: {
      mode: Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH
    },
    scene: [SceneTitle, SceneGame, SceneResult]
  };

  const game = new Phaser.Game(config);

})();
</script>
</body>
</html>
